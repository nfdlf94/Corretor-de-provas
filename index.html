    }catch(err){ console.error(err); alert("Não foi possível montar a planilha."); }
  };
}

/* Um simulado novo já nasce gravado, como rascunho: o professor pode sair
   e voltar sem perder nada, e não existe botão “Salvar” para procurar. */
/* As turmas da mesma série que ainda podem receber este simulado */
function turmasDaSerie(t){
  const k=chaveSerie(t);
  return E.turmas.filter(x=>x.ativa!==false && chaveSerie(x)===k);
}

/* Cria o simulado na SÉRIE: um registro por turma, todos com a mesma
   matriz. O caderno é montado uma vez e propagado. */
function criarSimuladoNaSerie(t){
  const turmas=turmasDaSerie(t);
  const matriz=uid("m");
  const primeiro=criarSimulado(t, matriz);
  turmas.forEach(outra=>{
    if(outra.id===t.id) return;
    criarSimulado(outra, matriz, primeiro.titulo, primeiro.ano);
  });
  salvar();
  return primeiro;
}

function criarSimulado(t, matriz, tituloFixo, anoFixo){
  const ano=new Date().getFullYear();
  const n=simuladosDa(t.id).length+1;
  const sm={id:uid("s"),turma:t.id,titulo:tituloFixo||(n+"º Simulado SAEPE"),
    etapa:sugerirEtapa(t), matriz:matriz||null, serie:chaveSerie(t),
    ano: anoFixo||ano, metodo:"tri", alternarBlocos:true, tipos:0,
    valorParticipacao:valorSugerido(), qtd:{LP:10,MAT:10},
    fontes:{}, criado:Date.now(), prova:null};
  const pr={id:uid("p"),turma:t.id,disciplina:null,simulado:sm.id,
    codigo:codigoSugerido(t,ano),titulo:sm.titulo,
    nq:0,no:SAEPE_NO,gabC:"",periodo:null,
    comps:[],desc:[],habs:[],gabItens:[],orig:[],
    pontosObj:10,pontosDisc:0,questoes:[],discursivas:[],criada:Date.now()};
  sm.prova=pr.id;
  E.provas.push(pr);
  if(!Array.isArray(E.simulados)) E.simulados=[];
  E.simulados.push(sm);
  COMPONENTES.forEach(c=>ajustarQuantidade(sm,c.id));
  salvar();
  return sm;
}

function sugerirEtapa(t){
  const txt=((t.serie||"")+" "+(t.nome||"")).toLowerCase();
  if(/\b(3|3º|3°|terceir)/.test(txt)&&/(m[ée]dio|em)\b/.test(txt)) return "3EM";
  if(/\b(9|9º|9°|nono)/.test(txt)) return "9EF";
  if(/\b(5|5º|5°|quinto)/.test(txt)) return "5EF";
  return "3EM";
}
const codigoSugerido=(t,ano)=>
  (String(t.nome).toUpperCase().replace(/[^A-Z0-9]/g,"")+"-SAEPE-"+String(ano).slice(2)).slice(0,16);

/* ── criação e edição do simulado, em uma tela só ──────────────────
   Era um vaivém entre quatro telas (criar → simulado → importar →
   itens). Agora é um formulário linear, com as etapas numeradas e tudo
   gravando sozinho: não há botão “Salvar” que pareça não fazer nada. */
function avisoSalvo(){
  const el=$("#smSalvo"); if(!el) return;
  el.textContent="salvo";
  el.style.opacity="1";
  clearTimeout(avisoSalvo._t);
  avisoSalvo._t=setTimeout(()=>{ if($("#smSalvo")) $("#smSalvo").style.opacity="0"; },1400);
}
function guardar(){ salvar(); avisoSalvo(); }

function telaSimulado(box){
  const sm=simuladoDe(casaSim);
  if(!sm){ casaNivel="simulados"; return montarCasa(); }
  const pr=provaDoSim(sm), t=turmaDe(sm.turma);
  if(!pr||!t){ casaNivel="simulados"; return montarCasa(); }
  const et=etapaDe(sm.etapa), f=faltasDoCaderno(pr);
  const corrigidos=resDa(pr.id).length;
  const nAlunos=(t.alunos||[]).filter(ativo).length;

  const passo=(n,titulo,estado)=>`<div class="rot" style="display:flex;align-items:center;gap:8px">
    <span class="nu" style="flex:0 0 auto;color:var(--orange)">${n}</span>
    <span style="flex:1">${titulo}</span>
    ${estado?`<span class="tag${estado.ok?" ok":""}">${esc(estado.txt)}</span>`:""}</div>`;

  let h=`<div class="migalha"><button id="mVolta">‹ Simulados</button><span>·</span>
      <span>${esc(t.nome)}</span><span id="smSalvo" class="tag ok"
      style="opacity:0;transition:opacity .3s;margin-left:auto"></span></div>
    <h2>${esc(sm.titulo||"Simulado")}</h2>
    <p class="sub">${esc(et.nome)} · ${nAlunos} estudante${nAlunos===1?"":"s"} na turma</p>
    ${sm.matriz
      ? `<div class="diag"><b>Simulado da série</b>
         O mesmo caderno vale para ${irmaosDaMatriz(sm).length+1} turmas:
         ${esc([t].concat(irmaosDaMatriz(sm).map(x=>turmaDe(x.turma)))
             .filter(Boolean).map(x=>x.nome).join(", "))}.
         Mexer nos itens aqui muda o caderno de todas — e é isso que permite
         comparar as turmas na mesma escala de proficiência.</div>`
      : (turmasDaSerie(t).length>1
        ? `<div class="aviso"><b>Vale só para esta turma</b>
           As outras turmas da série têm o seu próprio sorteio. Dá para comparar
           percentual de acerto e acerto por descritor, mas não a proficiência numa
           escala única. O próximo simulado pode ser criado para a série inteira.</div>`
        : "")}`;

  /* 1 — identificação */
  h+=passo(1,"Identificação")+`
    <label>Nome do simulado</label>
    <input id="smTit" value="${esc(sm.titulo||"")}" placeholder="1º Simulado SAEPE">
    <div class="duo" style="margin-top:10px">
      <div><label>Etapa avaliada</label>
        <select id="smEt">${ETAPAS.map(x=>`<option value="${x.id}"${
          x.id===sm.etapa?" selected":""}>${esc(x.nome)}</option>`).join("")}</select></div>
      <div><label>Ano</label>
        <input id="smAno" type="number" inputmode="numeric" value="${sm.ano||new Date().getFullYear()}"></div>
    </div>
    <label>Código impresso no cartão</label>
    <input id="smCod" value="${esc(pr.codigo||"")}">`;

  /* 2 — quantidade de questões */
  const pedidoTotal=COMPONENTES.reduce((n,c)=>n+qtdPedida(sm,c.id),0);
  h+=passo(2,"Quantidade de questões",
      {ok:pedidoTotal>0&&pedidoTotal<=SAEPE_MAX, txt:pedidoTotal+" no total"})+
    `<p class="hint" style="margin-top:-4px">Esta é a regra: o simulado terá exatamente
      esta quantidade, mesmo que os arquivos tragam mais questões.</p>
    <div class="duo">${COMPONENTES.map(c=>`<div>
      <label>${esc(c.nome)}</label>
      <input id="smQ${c.id}" type="number" inputmode="numeric" min="0" max="30"
        value="${qtdPedida(sm,c.id)}"></div>`).join("")}</div>
    ${pedidoTotal>SAEPE_MAX
      ? `<div class="aviso" style="margin-top:10px">O cartão-resposta comporta até
         ${SAEPE_MAX} itens no total. Reduza para caber.</div>`
      : pedidoTotal&&pedidoTotal<MIN_Q_CARTAO
      ? `<div class="aviso" style="margin-top:10px">Com menos de ${MIN_Q_CARTAO} itens
         não sai cartão-resposta.</div>`:""}`;

  /* 3 — arquivos */
  const pronto3=COMPONENTES.every(c=>!qtdPedida(sm,c.id)||!f.questoes[c.id]);
  h+=passo(3,"Questões",{ok:pronto3, txt:(pr.nq-f.totalQuestoes)+"/"+pr.nq+" prontas"});
  h+=`<p class="hint" style="margin-top:-4px">Word ou PDF com as questões numeradas, um
    bloco <b>GABARITO</b> e um bloco <b>DESCRITORES</b> no fim.</p>`;
  COMPONENTES.forEach(c=>{
    const pedido=qtdPedida(sm,c.id);
    const temAgora=itensDe(pr,c.id).filter(i=>temQuestao((pr.questoes||[])[i])).length;
    const fonte=(sm.fontes||{})[c.id];
    h+=`<div class="item" style="display:block;cursor:default">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div class="t1">${esc(c.nome)}</div>
          <div class="t2">${pedido?pedido+" questões pedidas":"quantidade não definida"}${
            fonte?" · "+esc(fonte.nome):""}</div>
        </div>
        <button class="btn sec" data-arq="${c.id}"
          style="flex:0 0 auto;width:auto;padding:9px 14px;margin:0">${
          temAgora?"Trocar":"Enviar"}</button>
      </div>
      ${fonte?`<div class="hint" style="margin:8px 0 0">
        ${fonte.encontradas} questões encontradas no arquivo ·
        ${fonte.usadas} usadas${fonte.sorteadas?" (sorteadas)":""}</div>`:""}
      ${(pedido&&!temAgora)?`<div class="hint" style="margin:8px 0 0;color:var(--amber)">
        Nenhuma questão carregada ainda.</div>`:""}
    </div>
    <input type="file" data-inp="${c.id}" accept=".docx,.pdf,.txt" style="display:none">`;
  });
  h+=`<div id="impInfo"></div>`;

  /* 4 — gabarito e descritores */
  const nDesc=(pr.desc||[]).filter(Boolean).length;
  h+=passo(4,"Gabarito e descritores",
      {ok:!f.gab&&nDesc===pr.nq&&pr.nq>0, txt:(pr.nq-f.gab)+" gab · "+nDesc+" desc"})+
    `<p class="hint" style="margin-top:-4px">Vêm prontos do arquivo. Confira ou ajuste
      item a item se precisar.</p>
    <button class="btn gho" id="bItens">Conferir os ${pr.nq} itens</button>
    <button class="btn gho" id="bBanco" style="margin-top:8px">Banco de descritores</button>`;

  /* 5 — tipos de prova */
  const tipos=sm.tipos||0;
  h+=passo(5,"Tipos de prova",{ok:true, txt:tipos?tipos+" tipos":"um por estudante"})+
    `<select id="smTipos">
      <option value="0"${!tipos?" selected":""}>Um caderno por estudante (mais seguro)</option>
      ${[2,3,4,5,6].map(n=>`<option value="${n}"${tipos===n?" selected":""}>${n} tipos de prova</option>`).join("")}
    </select>
    <p class="hint">Com tipos, você imprime ${tipos||"N"} cadernos e tira cópias; números
      vizinhos caem sempre em tipos diferentes. Um por estudante embaralha para cada um,
      o que protege mais, mas exige uma impressão diferente por aluno.</p>
    <label>Ordem dos blocos</label>
    <select id="smAlt">
      <option value="1"${alternaBlocos(pr)?" selected":""}>Alternar entre Língua Portuguesa e Matemática</option>
      <option value="0"${alternaBlocos(pr)?"":" selected"}>Fixa — sempre Língua Portuguesa primeiro</option>
    </select>
    <p class="hint">Alternar só serve para aplicação em dia único.</p>`;

  /* 6 — resumo e geração */
  const impedimentos=[];
  COMPONENTES.forEach(c=>{
    const pedido=qtdPedida(sm,c.id);
    if(!pedido) return;
    const faltam=f.questoes[c.id]||0;
    if(faltam) impedimentos.push(faltam+" questões de "+nomeComp(c.id)+" sem enunciado");
  });
  if(!pedidoTotal) impedimentos.push("a quantidade de questões não foi definida");
  if(pedidoTotal>SAEPE_MAX) impedimentos.push("são "+pedidoTotal+" itens, acima do limite de "+SAEPE_MAX);
  if(pedidoTotal&&pedidoTotal<MIN_Q_CARTAO) impedimentos.push("menos de "+MIN_Q_CARTAO+" itens");
  if(f.gab) impedimentos.push(f.gab+" itens sem letra no gabarito");
  if(!nAlunos) impedimentos.push("a turma não tem estudantes cadastrados");

  const jaGerado=!!sm.geradoEm;
  h+=passo(6, jaGerado?"Imprimir e aplicar":"Gerar o simulado",
      jaGerado?{ok:true, txt:"já gerado"}:null)+
    `<div class="card"><div class="linha" style="justify-content:space-between">
      <span>${esc(sm.titulo||"Simulado")}</span><b>${sm.ano||""}</b></div>
      ${COMPONENTES.map(c=>`<div class="linha" style="justify-content:space-between">
        <span style="color:var(--mute)">${esc(c.nome)}</span>
        <b>${qtdPedida(sm,c.id)} questões</b></div>`).join("")}
      <div class="linha" style="justify-content:space-between">
        <span style="color:var(--mute)">Total</span><b>${pedidoTotal} questões</b></div>
      <div class="linha" style="justify-content:space-between">
        <span style="color:var(--mute)">Tipos de prova</span>
        <b>${tipos?tipos:nAlunos+" (um por estudante)"}</b></div>
      <div class="linha" style="justify-content:space-between">
        <span style="color:var(--mute)">Cartão-resposta</span><b>1 por estudante</b></div>
      <div class="linha" style="justify-content:space-between">
        <span style="color:var(--mute)">Páginas por estudante</span>
        <b id="smPag">—</b></div>
    </div><div id="smAjuste"></div>`;
  if(impedimentos.length){
    h+=`<div class="aviso">Falta para poder gerar:<br>${
      impedimentos.map(x=>"· "+esc(x)).join("<br>")}</div>`;
  }
  if(jaGerado){
    const d=new Date(sm.geradoEm);
    const dd=x=>String(x).padStart(2,"0");
    h+=`<div class="diag"><b>Já gerado em ${dd(d.getDate())}/${dd(d.getMonth()+1)} às
      ${dd(d.getHours())}h${dd(d.getMinutes())}</b>
      As questões deste simulado foram sorteadas uma única vez e ficaram gravadas.
      Gerar de novo devolve exatamente os mesmos cadernos, com as mesmas questões,
      na mesma ordem, para os mesmos estudantes — serve para reimprimir a prova de
      quem faltou ou perdeu a folha, sem bagunçar o resto da turma.</div>`;
  }
  h+=`<button class="btn" id="bGerar" ${impedimentos.length?"disabled":""}
      style="margin-top:12px">${jaGerado
        ?"Abrir para imprimir ou corrigir":"Gerar simulado"}</button>
    <button class="btn gho" id="smDel" style="margin-top:18px">Excluir simulado</button>
    <p class="hint">Excluir apaga o caderno e as correções dele. As provas normais não
      são afetadas.</p>`;

  /* 7 — resultados: sempre visíveis, mesmo antes da primeira correção */
  const totalAlunos=(t.alunos||[]).filter(ativo).length;
  h+=passo(7,"Resultados",
      {ok:corrigidos>0, txt:corrigidos?corrigidos+" de "+totalAlunos+" corrigidos":"aguardando"})+
    `<button class="item" id="bCorrigirSim"><div class="cor">
      <div class="t1">Corrigir cartões deste simulado</div>
      <div class="t2">Deixa o caderno ativo e abre a câmera — dá para lançar
        à mão pela aba Manual também</div>
      </div><span class="ch">›</span></button>
    <button class="item" id="bRel"><div class="cor">
      <div class="t1">Resultados por componente</div>
      <div class="t2">Proficiência, padrões de desempenho e acerto por descritor,
        separados em Língua Portuguesa e Matemática</div>
      </div><span class="ch">›</span></button>
    <button class="item" id="bPart"><div class="cor">
      <div class="t1">Nota de participação</div>
      <div class="t2">Até ${String(valorParticipacao(sm)).replace(".",",")} ponto(s),
        proporcional aos acertos</div>
      </div><span class="ch">›</span></button>
    ${corrigidos
      ? ""
      : `<div class="diag"><b>Ainda sem correções</b>
         Depois de aplicar, use o botão acima: ele deixa este caderno ativo e
         abre a câmera. Aponte para cada cartão-resposta — o app reconhece o
         estudante pelo QR e as notas vão aparecendo aqui. Dá para corrigir na
         ordem que quiser, e o caderno também aparece no seletor das abas
         <b>Ler</b> e <b>Manual</b>.</div>`}`;
  box.innerHTML=h;

  /* ── tudo grava sozinho ─────────────────────────────────────────── */
  const trocouTit=()=>{ const v=$("#smTit").value.trim();
    sm.titulo=v; pr.titulo=v||"Simulado"; guardar(); };
  $("#smTit").onchange=trocouTit;
  $("#smEt").onchange=()=>{ sm.etapa=$("#smEt").value; guardar(); montarCasa(); };
  $("#smAno").onchange=()=>{ sm.ano=parseInt($("#smAno").value,10)||sm.ano; guardar(); };
  $("#smCod").onchange=()=>{ pr.codigo=$("#smCod").value.trim().toUpperCase()||pr.codigo;
    guardar(); refletirBarra(); };
  COMPONENTES.forEach(c=>{
    $("#smQ"+c.id).onchange=()=>{
      const v=Math.max(0,Math.min(30,parseInt($("#smQ"+c.id).value,10)||0));
      sm.qtd=sm.qtd||{}; sm.qtd[c.id]=v;
      ajustarQuantidade(sm,c.id);
      guardar(); montarCasa(); };
  });
  $("#smTipos").onchange=()=>{
    const n=parseInt($("#smTipos").value,10)||0;
    if(corrigidos && !confirm("Mudar os tipos de prova muda o caderno de cada estudante. "+
      "Os cartões já impressos deixam de valer e as "+corrigidos+
      " correções ficam erradas.\n\nContinuar?")){ montarCasa(); return; }
    sm.tipos=n; guardar(); montarCasa(); };
  $("#smAlt").onchange=()=>{
    const v=$("#smAlt").value==="1";
    if(corrigidos && !confirm("Mudar a ordem dos blocos invalida os cartões já impressos "+
      "e as "+corrigidos+" correções.\n\nContinuar?")){ montarCasa(); return; }
    sm.alternarBlocos=v; guardar(); montarCasa(); };

  $("#mVolta").onclick=()=>{casaNivel="simulados";montarCasa();};
  $("#bItens").onclick=()=>{casaNivel="itens";montarCasa();};
  $("#bBanco").onclick=()=>{casaComp=casaComp||"LP";casaNivel="banco";montarCasa();};
  $("#bRel").onclick=()=>{irParticipacao=false;casaNivel="relSaepe";montarCasa();};
  $("#bPart").onclick=()=>{irParticipacao=true;casaNivel="relSaepe";montarCasa();};
  $("#bCorrigirSim").onclick=()=>{
    if(pr.nq<MIN_Q_CARTAO){ alert("O caderno ainda não tem itens."); return; }
    ativar(pr.id); irPara("ler"); };
  $("#smDel").onclick=()=>{
    if(!confirm("Excluir “"+(sm.titulo||"simulado")+"” e as correções dele?")) return;
    E.provas=E.provas.filter(x=>x.id!==pr.id);
    E.res=E.res.filter(r=>r.prova!==pr.id);
    E.simulados=E.simulados.filter(x=>x.id!==sm.id);
    if(E.ativa===pr.id){ E.ativa=null; refletirBarra(); }
    salvar(); pintarResultados(); pintarDesempenho();
    casaNivel="simulados"; montarCasa(); };

  /* ── envio de arquivo, ali mesmo ────────────────────────────────── */
  box.querySelectorAll("[data-arq]").forEach(b=>b.onclick=()=>{
    const comp=b.dataset.arq;
    if(!qtdPedida(sm,comp)){
      alert("Defina quantas questões de "+nomeComp(comp)+" o simulado terá antes de enviar o arquivo.");
      return; }
    box.querySelector(`[data-inp="${comp}"]`).click();
  });
  box.querySelectorAll("[data-inp]").forEach(inp=>inp.onchange=async ev=>{
    const comp=inp.dataset.inp;
    const arq=ev.target.files&&ev.target.files[0]; if(!arq) return;
    const info=t=>{ const el=$("#impInfo"); if(el) el.innerHTML=t; };
    info(`<div class="diag" style="margin-top:10px">Lendo ${esc(arq.name)}…</div>`);
    try{
      let txt="";
      if(/\.docx$/i.test(arq.name))     txt=await textoDeDocx(arq);
      else if(/\.pdf$/i.test(arq.name)) txt=await textoDePdf(arq);
      else                              txt=await arq.text();
      if(!txt.trim()) throw new Error("o arquivo não devolveu texto");
      const lido=lerSimuladoDoc(txt);
      if(!lido.itens.length) throw new Error("não encontrei questões numeradas");
      const sel=selecionarItens(sm,comp,lido.itens);
      if(sel.erro){ info(`<div class="aviso" style="margin-top:10px">${esc(sel.erro)}</div>`); return; }
      if(resDa(pr.id).length && !confirm("Trocar as questões invalida os "+
        resDa(pr.id).length+" cartões já corrigidos deste simulado.\n\nContinuar?")){
        info(""); return; }
      /* textos dos descritores vão para o banco daquele componente */
      E.descritores=E.descritores||{LP:{},MAT:{}};
      E.descritores[comp]=E.descritores[comp]||{};
      lido.descritores.forEach(d=>{ if(d.texto) E.descritores[comp][d.cod]=d.texto; });
      aplicarImportacao(sm,comp,sel.itens);
      sm.fontes=sm.fontes||{};
      sm.fontes[comp]={nome:arq.name, encontradas:sel.encontradas,
        usadas:sel.usadas, sorteadas:!!sel.sorteadas, quando:Date.now()};
      guardar();
      if(E.ativa===pr.id) ativar(pr.id);
      montarCasa();
      /* o que ficou incompleto precisa aparecer: passar batido faz o
         professor descobrir só na hora de gerar, ou pior, nunca */
      const semGab=sel.itens.filter(x=>!x.gab).length;
      const semDesc=sel.itens.filter(x=>!x.desc).length;
      const curtas=sel.itens.filter(x=>
        (x.questao.alternativas||[]).filter(a=>String(a).trim()).length<SAEPE_NO).length;
      const alertas=[];
      if(semGab)  alertas.push(semGab+" sem letra no gabarito");
      if(semDesc) alertas.push(semDesc+" sem descritor — confira se o arquivo tem o bloco DESCRITORES");
      if(curtas)  alertas.push(curtas+" com menos de "+SAEPE_NO+" alternativas legíveis");
      $("#impInfo").innerHTML=`<div class="diag" style="margin-top:10px">
        <b>${esc(arq.name)}</b>${sel.encontradas} questões encontradas ·
        ${sel.usadas} ${sel.sorteadas?"sorteadas":"usadas"} em ${esc(nomeComp(comp))} ·
        ${lido.descritores.length} descritor${lido.descritores.length===1?"":"es"} no arquivo${
        sel.sorteadas?"<br>Sorteadas as originais: "+
          sel.itens.map(x=>x.orig).join(", "):""}</div>${
        alertas.length?`<div class="aviso" style="margin-top:8px">${
          alertas.map(esc).join("<br>")}</div>`:""}`;
    }catch(e){
      info(`<div class="aviso" style="margin-top:10px">Não consegui ler: ${esc(e.message)}</div>`);
    }
    inp.value="";
  });

  /* ── páginas previstas e geração ────────────────────────────────── */
  const prever=()=>{
    if(impedimentos.length || typeof gerarProvas!=="function") return;
    try{
      const doc=gerarProvas(cfgDoCaderno(sm,pr,t),[ (t.alunos||[])[0] ], window.jspdf.jsPDF);
      const el=$("#smPag"), av=$("#smAjuste");
      const corpo=doc.corpoUsado?String(doc.corpoUsado).replace(".",",")+" pt":"";
      if(el) el.textContent=(doc.paginasPorAluno||"?")+(corpo?" · corpo "+corpo:"");
      if(av && doc.avisoPaginas){
        av.innerHTML=`<div class="aviso" style="margin-top:10px">
          Com ${pr.nq} questões a prova sai com ${doc.avisoPaginas} páginas, mesmo na
          menor letra permitida (9 pt). Ao gerar, o app vai propor a maior quantidade
          que cabe em ${MAX_PAG_SIMULADO} páginas.</div>`;
      }else if(av) av.innerHTML="";
    }catch(e){ /* previsão é enfeite: se falhar, o botão continua valendo */ }
  };
  setTimeout(()=>{ if(casaNivel==="simulado") prever(); },30);

  if($("#bGerar")) $("#bGerar").onclick=()=>{
    if(pr.nq<MIN_Q_CARTAO){ alert("O caderno ainda não tem itens."); return; }
    const abrir=()=>{
      voltaPara.prova="simulado"; casaProva=pr.id; ativar(pr.id);
      casaNivel="prova"; montarCasa(); };
    const aj=melhorAjuste(sm);
    if(!aj || aj.corte===0){ abrir(); return; }   // coube como está
    const antes=pr.nq;
    const resumo=COMPONENTES.filter(c=>aj.qtd[c.id]!=null)
      .map(c=>aj.qtd[c.id]+" de "+nomeComp(c.id)).join(" e ");
    if(aj.paginas>MAX_PAG_SIMULADO){
      alert("Mesmo com "+aj.lista.length+" questões e a menor letra permitida, a prova "+
        "sai com "+aj.paginas+" páginas. Reduza a quantidade pedida ou use enunciados menores.");
      return; }
    if(!confirm("As "+antes+" questões não cabem em "+MAX_PAG_SIMULADO+" páginas, nem "+
      "reduzindo a letra até 9 pt.\n\nA maior quantidade que cabe é "+resumo+
      " — "+aj.lista.length+" questões, corpo "+String(aj.corpo).replace(".",",")+" pt.\n\n"+
      "Aplicar esse ajuste? As questões retiradas saem do fim de cada bloco; "+
      "gabarito e descritores continuam certos.")) return;
    aplicarAjuste(sm,aj);
    montarCasa();
    setTimeout(abrir,0);
  };
}

/* ── apuração de um componente ───────────────────────────────────── */
function apurarComp(sm,comp){
  const pr=provaDoSim(sm), t=turmaDe(sm.turma);
  if(!pr||!t) return null;
  const idx=itensDe(pr,comp);
  if(!idx.length) return null;
  const g=String(pr.gabC||"").toUpperCase();
  const alunos=alunosDaProva(t,pr);
  const linhas=alunos.map(a=>{
    const r=E.res.find(x=>x.prova===pr.id && x.numero===a.numero);
    return {aluno:a,res:r||null,acertos:r?acertosComp(pr,r,comp):null};
  });
  E.res.filter(r=>r.prova===pr.id).forEach(r=>{        // corrigido e já transferido
    if(!alunos.some(a=>a.numero===r.numero))
      linhas.push({aluno:{numero:r.numero,nome:r.nome},res:r,
                   acertos:acertosComp(pr,r,comp),fora:true});
  });
  const feitos=linhas.filter(L=>L.res);

  /* TRI quando há gente e itens suficientes; senão, percentual */
  let metodo="pct", par=null, thMedio=0, centro=null;
  const matriz=feitos.map(L=>idx.map(i=>(L.res.Rc&&L.res.Rc[i]===g[i])?1:0));
  if(sm.metodo!=="pct" && feitos.length>=TRI_MIN_ALUNOS && idx.length>=TRI_MIN_ITENS){
    par=calibrar(matriz,pr.no);
    if(par){
      metodo="tri";
      feitos.forEach((L,k)=>{ L.theta=estimarTheta(matriz[k],par); });
      thMedio=feitos.reduce((x,L)=>x+L.theta,0)/feitos.length;
      /* o nível da turma vem do acerto absoluto; a TRI distribui em volta */
      const mediaAcertos=feitos.reduce((x,L)=>x+L.acertos,0)/feitos.length;
      centro=profPorPercentual(sm,mediaAcertos,idx.length,pr.no);
      feitos.forEach(L=>{ L.prof=escalaTRI(sm,L.theta,thMedio,centro); });
    }
  }
  if(metodo==="pct")
    feitos.forEach(L=>{ L.prof=profPorPercentual(sm,L.acertos,idx.length,pr.no); });
  linhas.forEach(L=>{ if(L.prof==null) L.prof=null;
    L.padrao=L.prof==null?null:padraoDe(L.prof,sm.etapa,comp); });

  const media=feitos.length?feitos.reduce((x,L)=>x+L.prof,0)/feitos.length:null;
  const dist=[0,0,0,0];
  feitos.forEach(L=>{ if(L.padrao) dist[L.padrao.indice]++; });

  /* acerto por item e por descritor, dentro do componente */
  const itens=idx.map((i,k)=>({
    q:i+1, cod:(pr.desc||[])[i]||"",
    pct:feitos.length?100*feitos.filter(L=>L.res.Rc&&L.res.Rc[i]===g[i]).length/feitos.length:null,
    dif:par?escalaTRI(sm,par[k].b,thMedio,centro):null,
    a:par?par[k].a:null,
    r:par?par[k].r:null      // correlação item-total: é ela que diz se separa
  }));
  const agrup={};
  itens.forEach(it=>{ if(it.cod&&it.pct!=null) (agrup[it.cod]=agrup[it.cod]||[]).push(it.pct); });
  const descritores=Object.entries(agrup)
    .map(([cod,v])=>({cod,pct:v.reduce((a,b)=>a+b,0)/v.length,itens:v.length}))
    .sort((a,b)=>a.pct-b.pct);

  return {pr,t,comp,total:idx.length,linhas,feitos,media,dist,itens,descritores,
          metodo,par,padraoMedio:padraoDe(media,sm.etapa,comp)};
}

/* ═══════════════════════════════════════════════════════════════════
   ANÁLISE LONGITUDINAL POR DESCRITOR
   Como cada estudante vem se saindo, descritor a descritor, ao longo dos
   simulados. A comparação é sempre com a ÚLTIMA VEZ EM QUE AQUELE
   DESCRITOR FOI AVALIADO — não com o simulado anterior. Descritor que
   não apareceu num simulado é "não avaliado", nunca 0%: tratar ausência
   como zero inventaria uma queda que não existe.

   A chave lógica é aluno + disciplina + descritor. O mesmo código em
   componentes diferentes são coisas diferentes: `D17` é "relações
   lógico-discursivas" em Língua Portuguesa e "equação do 2º grau" em
   Matemática. Compará-los entre si produziria um histórico sem sentido.
   ═══════════════════════════════════════════════════════════════════ */

/* tolerância, em pontos percentuais, para considerar que "manteve" */
const TOL_LONGITUDINAL=5;
/* abaixo disto, em avaliações sucessivas, é dificuldade persistente */
const PISO_DIFICULDADE=50;

const chaveLong=(numero,comp,cod)=>String(numero)+"|"+comp+"|"+codDesc(cod);

/* Ordem dos simulados no tempo. `criado` é o carimbo de criação; o ano e
   o título desempatam para os que vieram de cópia de segurança antiga. */
function ordenarSimulados(sims){
  return sims.slice().sort((a,b)=>
    ((a.criado||0)-(b.criado||0)) || ((a.ano||0)-(b.ano||0)) ||
    String(a.titulo||"").localeCompare(String(b.titulo||"")));
}

/* Acerto de UM estudante em UM descritor de UM caderno.
   Devolve null quando o descritor não foi avaliado ali ou quando o
   estudante não fez o simulado — os dois são ausência, não zero. */
function acertoNoDescritor(pr,reg,comp,cod){
  if(!pr||!reg) return null;
  const g=String(pr.gabC||"").toUpperCase(), alvo=codDesc(cod);
  const idx=itensDe(pr,comp).filter(i=>codDesc((pr.desc||[])[i]||"")===alvo);
  if(!idx.length) return null;
  const certos=idx.filter(i=>reg.Rc && reg.Rc[i]===g[i]).length;
  return {itens:idx.length, acertos:certos, pct:100*certos/idx.length};
}

/* Descritores de um caderno, por componente, sem repetir. */
function descritoresDo(pr,comp){
  const vistos=[];
  itensDe(pr,comp).forEach(i=>{
    const c=codDesc((pr.desc||[])[i]||"");
    if(c && !vistos.includes(c)) vistos.push(c);
  });
  return vistos;
}

/* Classificação de uma medida contra a anterior do MESMO descritor. */
function classificarLong(pct,anterior,tol){
  if(anterior==null) return {classe:"primeira", rotulo:"primeira avaliação", delta:null};
  const d=pct-anterior;
  const t=(tol==null?TOL_LONGITUDINAL:tol);
  if(d>t)  return {classe:"melhorou", rotulo:"melhorou", delta:d};
  if(d<-t) return {classe:"piorou",   rotulo:"piorou",   delta:d};
  return {classe:"manteve", rotulo:"manteve", delta:d};
}

/* O histórico completo de um recorte de simulados.
   `sims` são os cadernos a considerar, em qualquer ordem; a função os
   ordena no tempo. Devolve uma linha por (estudante, componente,
   descritor), com todas as medidas e a comparação com a anterior. */
function historicoPorDescritor(sims,opc){
  opc=opc||{};
  const tol=opc.tolerancia==null?TOL_LONGITUDINAL:opc.tolerancia;
  const piso=opc.piso==null?PISO_DIFICULDADE:opc.piso;
  const ordem=ordenarSimulados(sims);
  const mapa={};                      // chave lógica → linha
  const avaliacoes=[];                // os simulados que renderam medida

  ordem.forEach(sm=>{
    const pr=provaDoSim(sm), t=turmaDe(sm.turma);
    if(!pr||!t) return;
    const rotulo={id:sm.id, titulo:sm.titulo||"Simulado", ano:sm.ano,
                  turma:t.nome, etapa:sm.etapa};
    let usou=false;
    COMPONENTES.forEach(c=>{
      const cods=descritoresDo(pr,c.id);
      if(!cods.length) return;
      resDa(pr.id).forEach(reg=>{
        cods.forEach(cod=>{
          const m=acertoNoDescritor(pr,reg,c.id,cod);
          if(!m) return;
          usou=true;
          const k=chaveLong(reg.numero,c.id,cod);
          const L=mapa[k]||(mapa[k]={numero:reg.numero, nome:reg.nome,
            turma:t.nome, comp:c.id, cod:codDesc(cod),
            texto:textoDesc(c.id,cod), medidas:[]});
          if(!L.nome && reg.nome) L.nome=reg.nome;
          L.medidas.push(Object.assign({simulado:rotulo}, m));
        });
      });
    });
    if(usou) avaliacoes.push(rotulo);
  });

  const linhas=Object.values(mapa).map(L=>{
    const m=L.medidas;
    const atual=m[m.length-1];
    /* a comparação é com a última vez em que ESTE descritor foi medido */
    const anterior=m.length>1?m[m.length-2]:null;
    const cls=classificarLong(atual.pct, anterior?anterior.pct:null, tol);
    /* dificuldade persistente: abaixo do piso em avaliações sucessivas */
    let seguidas=0;
    for(let i=m.length-1;i>=0 && m[i].pct<piso;i--) seguidas++;
    return Object.assign(L,{
      atual, anterior, delta:cls.delta, classe:cls.classe, rotuloClasse:cls.rotulo,
      vezes:m.length, abaixoSeguidas:seguidas,
      persistente: seguidas>=2,
      media: m.reduce((x,y)=>x+y.pct,0)/m.length
    });
  });

  linhas.sort((a,b)=>
    ordNum(a.numero,b.numero) ||
    String(a.comp).localeCompare(String(b.comp)) ||
    numDesc(a.cod)-numDesc(b.cod));
  return {linhas, avaliacoes, tolerancia:tol, piso};
}
const numDesc=c=>{ const m=/(\d+)/.exec(String(c||"")); return m?+m[1]:999; };

/* Resumo por descritor de um recorte: quantos melhoraram, mantiveram,
   pioraram, e quantos estão em dificuldade persistente. */
function resumoLongitudinal(hist){
  const mapa={};
  hist.linhas.forEach(L=>{
    const k=L.comp+"|"+L.cod;
    const R=mapa[k]||(mapa[k]={comp:L.comp, cod:L.cod, texto:L.texto,
      melhorou:0, manteve:0, piorou:0, primeira:0, persistentes:0,
      estudantes:0, somaAtual:0});
    R[L.classe]++; R.estudantes++; R.somaAtual+=L.atual.pct;
    if(L.persistente) R.persistentes++;
  });
  return Object.values(mapa).map(R=>Object.assign(R,{
    mediaAtual: R.estudantes?R.somaAtual/R.estudantes:null
  })).sort((a,b)=>
    String(a.comp).localeCompare(String(b.comp)) || numDesc(a.cod)-numDesc(b.cod));
}

/* ── séries e agrupamento de simulados ─────────────────────────────
   Uma série reúne as turmas com a mesma etapa: 3º A, 3º B, 3º C. Como o
   professor digita a série livremente, a comparação é feita sobre uma
   forma normalizada. */
function chaveSerie(t){
  const bruto=String((t&&t.serie)||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n=(bruto.match(/\d+/)||[])[0];
  const etapa=/medio|em\b/.test(bruto)?"EM":/fundamental|ef\b|ano/.test(bruto)?"EF":"";
  if(n) return n+(etapa?" "+etapa:"");
  return bruto.trim()||"(sem série)";
}
const nomeSerie=t=>String((t&&t.serie)||"").trim()||"(sem série)";
function seriesDisponiveis(){
  const mapa={};
  E.turmas.forEach(t=>{
    if(!simuladosDa(t.id).length) return;
    const k=chaveSerie(t);
    (mapa[k]=mapa[k]||{chave:k,nome:nomeSerie(t),turmas:[]}).turmas.push(t);
  });
  return Object.values(mapa).sort((a,b)=>a.nome.localeCompare(b.nome));
}
/* simulados "iguais" entre turmas: mesmo título e mesmo ano */
const chaveSimulado=sm=>String(sm.titulo||"").trim().toLowerCase()+"|"+(sm.ano||"");
function simuladosDaSerie(serie){
  const mapa={};
  serie.turmas.forEach(t=>simuladosDa(t.id).forEach(sm=>{
    const k=chaveSimulado(sm);
    (mapa[k]=mapa[k]||{chave:k,titulo:sm.titulo,ano:sm.ano,etapa:sm.etapa,sims:[]})
      .sims.push(sm);
  }));
  return Object.values(mapa).sort((a,b)=>
    (b.ano-a.ano)||String(b.titulo).localeCompare(String(a.titulo)));
}

/* ── TRI conjunta de um conjunto de cadernos ───────────────────────
   Uma única calibração com TODAS as respostas do recorte (a turma, ou a
   série inteira), separada por componente. Não é média de proficiências:
   os itens são calibrados juntos e cada estudante é posicionado na mesma
   escala. Cadernos diferentes entre turmas viram colunas diferentes da
   matriz, com `null` onde o estudante não respondeu aquele item. */
function chaveItem(pr,i){ return qidDoItem(pr,i); }

function apurarConjunto(sims,comp){
  const linhas=[], colunas={}, ordem=[];
  sims.forEach(sm=>{
    const pr=provaDoSim(sm), t=turmaDe(sm.turma);
    if(!pr||!t) return;
    const idx=itensDe(pr,comp);
    if(!idx.length) return;
    const g=String(pr.gabC||"").toUpperCase();
    const chaves=idx.map(i=>{
      const k=chaveItem(pr,i);
      if(colunas[k]==null){ colunas[k]=ordem.length;
        ordem.push({chave:k, cod:(pr.desc||[])[i]||"", comp}); }
      return colunas[k];
    });
    resDa(pr.id).forEach(r=>{
      const resp=new Array(0);
      const marc={};
      idx.forEach((i,k)=>{ marc[chaves[k]]=(r.Rc&&r.Rc[i]===g[i])?1:0; });
      linhas.push({sm, turma:t, res:r, marc,
        acertos:idx.filter(i=>r.Rc&&r.Rc[i]===g[i]).length, total:idx.length});
    });
  });
  if(!linhas.length) return null;
  const I=ordem.length;
  const matriz=linhas.map(L=>Array.from({length:I},(_,j)=>
    L.marc[j]==null?null:L.marc[j]));

  const no=5;
  const sm0=sims[0];
  const etapa=sm0.etapa;
  /* nível do recorte pelo acerto absoluto; a TRI distribui em volta */
  const mediaPct=linhas.reduce((x,L)=>x+L.acertos/L.total,0)/linhas.length;
  const centro=profPorPercentual(sm0, mediaPct*100, 100, no);

  /* ── itens âncora ────────────────────────────────────────────────
     Uma calibração conjunta só coloca estudantes de CADERNOS DIFERENTES
     na mesma escala se houver itens em comum entre eles — os itens
     âncora. É o que o Saeb faz. Sem nenhum item comum, o modelo não tem
     como saber se a turma A é melhor que a B ou se o caderno da A era
     mais fácil: ele assume que os grupos são iguais e ACHATA a diferença
     entre as turmas. Medido: três turmas com 79,2%, 62,5% e 46,9% de
     acerto saíam com 302, 294 e 290 — 12 pontos de distância, quando o
     mesmo caderno para todas dá 325, 297 e 264, que são 61.
     Sem âncoras suficientes, o honesto é usar o percentual de acerto,
     que ao menos não finge comparar o incomparável. */
  const cadernosPorColuna=new Array(I).fill(0);
  const vistas=new Set();
  linhas.forEach(L=>{
    Object.keys(L.marc).forEach(j=>{
      const k=L.sm.id+"#"+j;
      if(vistas.has(k)) return;
      vistas.add(k); cadernosPorColuna[+j]++;
    });
  });
  const nCadernos=new Set(linhas.map(L=>L.sm.id)).size;
  const ancoras=cadernosPorColuna.filter(n=>n>1).length;
  const semAncora=(nCadernos>1 && ancoras<ANCORA_MIN);

  let metodo="pct", par=null, thMedio=0;
  if(!semAncora && linhas.length>=TRI_MIN_ALUNOS && I>=TRI_MIN_ITENS){
    par=calibrar(matriz,no);
    if(par){
      metodo="tri";
      linhas.forEach((L,k)=>{ L.theta=estimarTheta(matriz[k],par); });
      thMedio=linhas.reduce((x,L)=>x+L.theta,0)/linhas.length;
      linhas.forEach(L=>{ L.prof=escalaTRI(sm0,L.theta,thMedio,centro); });
    }
  }
  if(metodo==="pct")
    linhas.forEach(L=>{ L.prof=profPorPercentual(sm0,L.acertos,L.total,no); });
  linhas.forEach(L=>{ L.padrao=padraoDe(L.prof,etapa,comp); });

  const media=linhas.reduce((x,L)=>x+L.prof,0)/linhas.length;
  const dist=[0,0,0,0];
  linhas.forEach(L=>{ if(L.padrao) dist[L.padrao.indice]++; });

  /* acerto por descritor, somando os itens de todos os cadernos */
  const porDesc={};
  ordem.forEach((col,j)=>{
    if(!col.cod) return;
    let ac=0,n=0;
    matriz.forEach(l=>{ if(l[j]==null) return; ac+=l[j]; n++; });
    if(!n) return;
    const d=porDesc[col.cod]=porDesc[col.cod]||{cod:col.cod,ac:0,n:0,itens:0};
    d.ac+=ac; d.n+=n; d.itens++;
  });
  const descritores=Object.values(porDesc)
    .map(d=>({cod:d.cod, pct:100*d.ac/d.n, itens:d.itens}))
    .sort((a,b)=>a.pct-b.pct);

  /* por turma, para a visão da série */
  const porTurma={};
  linhas.forEach(L=>{
    const k=L.turma.id;
    const o=porTurma[k]=porTurma[k]||{turma:L.turma, n:0, soma:0, ac:0, tot:0};
    o.n++; o.soma+=L.prof; o.ac+=L.acertos; o.tot+=L.total;
  });
  const turmas=Object.values(porTurma).map(o=>({turma:o.turma, n:o.n,
    media:o.soma/o.n, pct:100*o.ac/o.tot,
    padrao:padraoDe(o.soma/o.n,etapa,comp)})).sort((a,b)=>b.media-a.media);

  return {comp, etapa, linhas, media, dist, descritores, turmas, metodo,
    nCadernos, ancoras, semAncora,
    itens:I, alunos:linhas.length, padraoMedio:padraoDe(media,etapa,comp),
    cadernosDiferentes:sims.length>1 && I>Math.max.apply(null,
      sims.map(sm=>{const pr=provaDoSim(sm);return pr?itensDe(pr,comp).length:0}))};
}

/* ── um componente, desenhado igual na turma e na série ─────────── */
function blocoComponente(A,comp,opt){
  const c=COMPONENTES.find(x=>x.id===comp)||{nome:comp,curto:comp};
  if(!A) return `<div class="rot">${esc(c.nome)}</div>
    <p class="hint" style="margin:0 0 10px">Sem cartões corrigidos deste componente.</p>`;
  const cortes=etapaDe(A.etapa).cortes[comp]||[];
  const pm=A.padraoMedio;
  let h=`<div class="rot">${esc(c.nome)} · ${A.itens} ${A.itens===1?"item":"itens"} ·
      ${A.alunos} estudante${A.alunos===1?"":"s"}</div>
    <div class="kpi">
      <div><div class="v" style="color:${pm.cor}">${A.media.toFixed(1).replace(".",",")}</div>
        <div class="l">Proficiência</div></div>
      <div><div class="v" style="font-size:15px;color:${pm.cor}">${esc(pm.nome)}</div>
        <div class="l">Padrão</div></div>
      <div><div class="v">${A.alunos}</div><div class="l">Corrigidos</div></div></div>
    <p class="hint" style="margin-top:-4px">${A.metodo==="tri"
      ? "TRI de 3 parâmetros calibrada com as respostas dos "+A.alunos+
        " estudantes deste recorte, de uma vez — não é média de proficiências."
      : (A.semAncora
        ? "Percentual de acerto. A TRI conjunta ficou de fora aqui de propósito: "+
          "os "+A.nCadernos+" cadernos deste recorte não têm itens em comum "+
          "suficientes, e sem itens âncora a calibração não consegue distinguir "+
          "turma melhor de caderno mais fácil — ela achataria a diferença entre as turmas."
        : "Percentual de acerto: a TRI precisa de pelo menos "+TRI_MIN_ALUNOS+" cartões.")}
      Cortes da etapa: ${cortes.join(" · ")}.${A.cadernosDiferentes && !A.semAncora
      ? " Os cadernos das turmas não são idênticos; itens não respondidos entram como ausentes."
      : ""}</p>${A.semAncora
      ? `<div class="aviso" style="margin-bottom:10px"><b>Comparação entre turmas limitada</b>
         Cada turma respondeu a um sorteio diferente, sem itens em comum. Dá para
         comparar o <b>percentual de acerto</b> e o acerto por descritor, mas não a
         proficiência numa escala única. Para comparar turmas de verdade, aplique o
         <b>mesmo caderno</b> em toda a série.</div>`
      : ""}`;
  PADROES.forEach((pd,i)=>{
    const n=A.dist[i], pc=A.alunos?100*n/A.alunos:0;
    h+=`<div class="barra"><span class="lb">${esc(pd.nome)}</span>
      <span class="t"><span class="f" style="width:${pc.toFixed(0)}%;background:${pd.cor}"></span></span>
      <span class="p">${pc.toFixed(0)}%</span>
      <span class="q" style="width:22px;text-align:right">${n}</span></div>`;
  });
  if(opt&&opt.turmas&&A.turmas.length>1){
    h+=`<div class="rot" style="margin-top:12px">Turmas · ${esc(c.curto)}</div>`;
    h+=A.turmas.map(x=>`<div class="barra">
      <span class="lb">${esc(x.turma.nome)} <span style="color:var(--mute)">(${x.n})</span></span>
      <span class="t"><span class="f" style="width:${Math.min(100,x.pct).toFixed(0)}%;background:${x.padrao.cor}"></span></span>
      <span class="p">${x.media.toFixed(0)}</span></div>`).join("");
  }
  if(A.descritores.length){
    const fracos=A.descritores.filter(d=>d.pct<50);
    h+=`<div class="rot" style="margin-top:12px">Descritores críticos · ${esc(c.curto)}</div>`;
    h+=A.descritores.slice(0,8).map(d=>`<div class="barra">
      <span class="lb" title="${esc(rotuloDesc(comp,d.cod))}">${esc(d.cod)}${
        textoDesc(comp,d.cod)?" · "+esc(textoDesc(comp,d.cod).slice(0,34)):""}</span>
      <span class="t"><span class="f ${d.pct<50?"baixo":d.pct<75?"medio":""}"
        style="width:${d.pct.toFixed(0)}%"></span></span>
      <span class="p">${Math.round(d.pct)}%</span></div>`).join("");
    h+=`<div class="diag"><b>Atenção urgente em ${esc(c.nome)}</b>${
      fracos.length ? fracos.slice(0,5).map(d=>esc(d.cod)+" ("+Math.round(d.pct)+"%)").join(", ")+
        (fracos.length>5?" e mais "+(fracos.length-5):"")+" — abaixo de 50% de acerto."
      : "Nenhum descritor abaixo de 50%. O mais frágil é "+esc(A.descritores[0].cod)+
        " ("+Math.round(A.descritores[0].pct)+"%)."}</div>`;
  }
  return h;
}

function analiseTurma(){
  const sel=$("#desSel"), corpo=$("#desCorpo");
  const comSim=E.turmas.filter(t=>simuladosDa(t.id).length);
  if(anTurma && !turmaDe(anTurma)) anTurma=null;
  if(!comSim.length){
    $("#desSub").textContent="";
    sel.innerHTML=""; corpo.innerHTML='<div class="vazio"><b>Nenhum simulado ainda</b>Crie um simulado na aba Turmas.</div>';
    return;
  }
  if(!anTurma){
    $("#desSub").textContent="Escolha a turma.";
    sel.innerHTML="";
    corpo.innerHTML=comSim.map(t=>{
      const n=simuladosDa(t.id).length, e=escolaDe(t.escola)||{curto:""};
      return `<button class="item" data-t="${t.id}"><div class="cor">
        <div class="t1">${esc(t.nome)}</div>
        <div class="t2">${esc(e.curto)} · ${n} simulado${n===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("");
    corpo.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
      anTurma=b.dataset.t; anSim=null; pintarDesempenho(); });
    return;
  }
  const t=turmaDe(anTurma), sims=simuladosDa(t.id);
  if(anSim && !simuladoDe(anSim)) anSim=null;
  if(!anSim){
    $("#desSub").textContent=t.nome+" · escolha o simulado.";
    sel.innerHTML=`<div class="migalha"><button id="anVolta">‹ Turmas</button></div>`;
    corpo.innerHTML=sims.map(sm=>{
      const pr=provaDoSim(sm), n=pr?resDa(pr.id).length:0;
      return `<button class="item" data-s="${sm.id}"><div class="cor">
        <div class="t1">${esc(sm.titulo)}</div>
        <div class="t2">${sm.ano} · ${n} corrigido${n===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("");
    $("#anVolta").onclick=()=>{anTurma=null;pintarDesempenho();};
    corpo.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      anSim=b.dataset.s; pintarDesempenho(); });
    return;
  }
  const sm=simuladoDe(anSim), et=etapaDe(sm.etapa);
  $("#desSub").textContent=`${t.nome} · ${sm.titulo} · ${et.nome}`;
  sel.innerHTML=`<div class="migalha"><button id="anVolta">‹ ${esc(t.nome)}</button></div>`;
  /* as duas disciplinas, sempre juntas */
  corpo.innerHTML=COMPONENTES.map(c=>blocoComponente(apurarConjunto([sm],c.id),c.id)).join("")
    +`<button class="btn sec" id="anCsv" style="margin-top:14px">Baixar CSV desta análise</button>`;
  $("#anVolta").onclick=()=>{anSim=null;pintarDesempenho();};
  $("#anCsv").onclick=()=>baixarAnalise("turma",t.nome,sm.titulo,
    COMPONENTES.map(c=>({comp:c.id, A:apurarConjunto([sm],c.id)})));
}

function analiseSerie(){

  if(!series.length){
    $("#desSub").textContent="";
    sel.innerHTML=""; corpo.innerHTML='<div class="vazio"><b>Nenhum simulado ainda</b>Crie um simulado na aba Turmas.</div>';

  }
  const serie=anSerie?series.find(x=>x.chave===anSerie):null;
  if(!serie){
    anSerie=null;
    $("#desSub").textContent="Escolha a série. Ela reúne todas as turmas daquela etapa.";
    sel.innerHTML="";
    corpo.innerHTML=series.map(x=>`<button class="item" data-se="${esc(x.chave)}"><div class="cor">
      <div class="t1">${esc(x.nome)}</div>
      <div class="t2">${x.turmas.length} turma${x.turmas.length===1?"":"s"}:
        ${x.turmas.map(t=>esc(t.nome)).join(", ")}</div>
      </div><span class="ch">›</span></button>`).join("");
    corpo.querySelectorAll("[data-se]").forEach(b=>b.onclick=()=>{
      anSerie=b.dataset.se; anSimSerie=null; pintarDesempenho(); });
    return;
  }
  const grupos=simuladosDaSerie(serie);
  const grupo=anSimSerie?grupos.find(g=>g.chave===anSimSerie):null;
  if(!grupo){
    anSimSerie=null;
    $("#desSub").textContent=serie.nome+" · escolha o simulado.";
    sel.innerHTML=`<div class="migalha"><button id="anVolta">‹ Séries</button></div>`;
    corpo.innerHTML=grupos.map(g=>{
      const n=g.sims.reduce((x,sm)=>{const pr=provaDoSim(sm);return x+(pr?resDa(pr.id).length:0);},0);
      return `<button class="item" data-g="${esc(g.chave)}"><div class="cor">
        <div class="t1">${esc(g.titulo)}</div>
        <div class="t2">${g.ano} · ${g.sims.length} turma${g.sims.length===1?"":"s"} ·
          ${n} corrigido${n===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("");

    corpo.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      anSimSerie=b.dataset.g; pintarDesempenho(); });
    return;
  }
  const turmas=grupo.sims.map(sm=>{const t=turmaDe(sm.turma);return t?t.nome:"";}).filter(Boolean);
  $("#desSub").textContent=`${serie.nome} · ${grupo.titulo} · ${turmas.join(", ")}`;
  sel.innerHTML=`<div class="migalha"><button id="anVolta">‹ ${esc(serie.nome)}</button></div>`;
  corpo.innerHTML=COMPONENTES.map(c=>
      blocoComponente(apurarConjunto(grupo.sims,c.id),c.id,{turmas:true})).join("")
    +`<button class="btn sec" id="anCsv" style="margin-top:14px">Baixar CSV desta análise</button>`;
  $("#anVolta").onclick=()=>{anSimSerie=null;pintarDesempenho();};
  $("#anCsv").onclick=()=>baixarAnalise("série",serie.nome,grupo.titulo,
    COMPONENTES.map(c=>({comp:c.id, A:apurarConjunto(grupo.sims,c.id)})));
}

function baixarAnalise(nivel,recorte,titulo,blocos){
  const vg=x=>x==null?"":Number(x).toFixed(2).replace(".",",");
  const lin=[];
  blocos.forEach(({comp,A})=>{
    if(!A) return;
    lin.push([nivel,recorte,titulo,nomeComp(comp),"PROFICIÊNCIA",vg(A.media),
      A.padraoMedio.nome,A.alunos+" estudantes",A.metodo==="tri"?"TRI conjunta":"percentual"].join(";"));
    PADROES.forEach((pd,i)=>lin.push([nivel,recorte,titulo,nomeComp(comp),"PADRÃO",
      pd.nome,A.dist[i],vg(100*A.dist[i]/A.alunos)+"%",""].join(";")));
    A.turmas.forEach(x=>lin.push([nivel,recorte,titulo,nomeComp(comp),"TURMA",
      x.turma.nome,vg(x.media),x.padrao.nome,x.n+" estudantes"].join(";")));
    A.descritores.forEach(d=>lin.push([nivel,recorte,titulo,nomeComp(comp),"DESCRITOR",
      d.cod,vg(d.pct)+"%",d.itens+" itens",
      `"${String(textoDesc(comp,d.cod)).replace(/"/g,'""')}"`].join(";")));
  });
  const cab=["nivel","recorte","simulado","componente","tipo","item","valor","detalhe","obs"];
  baixar([cab.join(";"),...lin].join("\r\n"),
    "analise_"+nivel+"_"+recorte+".csv","text/csv");
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORTAÇÃO PARA EXCEL
   Três abas: resultados individuais, descritores e a análise do recorte.
   O gerador de .xlsx é próprio (`planilha.js`) — o app precisa abrir sem
   internet, e uma biblioteca de planilha custaria mais do que todo o
   resto junto. Números vão como número, não como texto: quem recebe a
   planilha precisa poder somar e ordenar sem converter coluna nenhuma.
   ═══════════════════════════════════════════════════════════════════ */
const num2=x=>x==null?null:Math.round(Number(x)*100)/100;

function abasDoSimulado(sm){
  const t=turmaDe(sm.turma), e=t?escolaDe(t.escola):null, et=etapaDe(sm.etapa);
  const apuros={};
  COMPONENTES.forEach(c=>{ apuros[c.id]=apurarComp(sm,c.id); });
  const part=participacaoDe(sm);

  /* 1 — resultados individuais: uma linha por estudante */
  const ind=[["nº","Estudante","Turma","Escola",
    "Proficiência L. Port.","Padrão L. Port.","Acertos L. Port.","Itens L. Port.",
    "Proficiência Mat.","Padrão Mat.","Acertos Mat.","Itens Mat.",
    "Participação","Origem da participação","Acertos no caderno","Itens do caderno"]];
  part.forEach(L=>{
    const linha=[String(L.aluno.numero), L.aluno.nome, t?t.nome:"", e?(e.curto||e.nome):""];
    COMPONENTES.forEach(c=>{
      const A=apuros[c.id];
      const D=A?A.linhas.find(x=>x.aluno.numero===L.aluno.numero):null;
      linha.push(num2(D&&D.prof), (D&&D.padrao)?D.padrao.nome:"",
                 D&&D.acertos!=null?D.acertos:null, A?A.total:null);
    });
    linha.push(num2(L.nota), L.manual!=null?"lançada":(L.calculada!=null?"acertos":""),
               L.acertos!=null?L.acertos:null, L.total);
    ind.push(linha);
  });

  /* 2 — descritores, com a descrição por extenso */
  const desc=[["Componente","Descritor","Descrição","Acerto médio (%)","Itens","Estudantes"]];
  COMPONENTES.forEach(c=>{
    const A=apuros[c.id]; if(!A) return;
    A.descritores.forEach(d=>desc.push([nomeComp(c.id), d.cod,
      textoDesc(c.id,d.cod), num2(d.pct), d.itens, A.feitos.length]));
  });

  /* 3 — a análise do recorte, com os descritores críticos */
  const an=[["Recorte","Componente","Proficiência média","Padrão médio","Método",
             "Estudantes","Itens","Descritores críticos (abaixo de 50%)"]];
  COMPONENTES.forEach(c=>{
    const A=apuros[c.id]; if(!A||!A.feitos.length) return;
    const criticos=A.descritores.filter(d=>d.pct!=null&&d.pct<50).map(d=>d.cod).join(", ");
    an.push([(t?t.nome:"")+" · "+(sm.titulo||""), nomeComp(c.id), num2(A.media),
      A.padraoMedio?A.padraoMedio.nome:"", A.metodo==="tri"?"TRI 3 parâmetros":"percentual",
      A.feitos.length, A.total, criticos]);
  });

  return [
    {nome:"Resultados individuais", linhas:ind,
     larguras:[6,30,10,14,15,15,13,12,15,15,13,12,13,20,16,14]},
    {nome:"Descritores", linhas:desc, larguras:[18,11,52,16,8,12]},
    {nome:"Análise "+(t?t.nome:""), linhas:an, larguras:[30,18,17,15,20,12,8,34]}
  ];
}

/* Gabarito de cada estudante, para conferir o papel.
   Cada caderno é embaralhado: a questão 1 do estudante 01 não é a questão
   1 do estudante 02, e as alternativas também trocam de lugar. Não existe
   "o gabarito" do simulado que sirva para todos — o que existe é o
   gabarito canônico (a ordem do documento de origem, que não é a ordem de
   nenhum caderno impresso) e um gabarito por estudante. Marcar o canônico
   num cartão qualquer acerta só por acaso. Esta planilha traz, lado a
   lado, o canônico e o de cada estudante. */
function abasGabaritoPorEstudante(pr, t){
  const letras=["A","B","C","D","E"].slice(0,pr.no);
  const cab=["nº","Estudante","Componente da questão 1..."+pr.nq];
  const linhas=[["nº","Estudante"].concat(
    Array.from({length:pr.nq},(_,i)=>"Q"+(i+1)))];

  /* a linha do canônico: a ordem do documento, que NÃO é a de ninguém */
  linhas.push(["—","GABARITO CANÔNICO (ordem do documento — não vale para nenhum cartão)"]
    .concat(String(pr.gabC||"").split("")));

  /* que componente cai em cada posição, para cada estudante, muda junto */
  alunosDaProva(t,pr).forEach(a=>{
    const g=gabaritoDe(t.nome,a.numero)||"";
    linhas.push([String(a.numero), a.nome].concat(g.split("")));
  });

  const comps=[["nº","Estudante"].concat(Array.from({length:pr.nq},(_,i)=>"Q"+(i+1)))];
  alunosDaProva(t,pr).forEach(a=>{
    const {oq}=ordemDe(pr,t.nome,a.numero);
    comps.push([String(a.numero), a.nome].concat(
      oq.map(q=>(pr.comps||[])[q]||"")));
  });

  return [
    {nome:"Gabarito por estudante", linhas,
     larguras:[6,30].concat(Array.from({length:pr.nq},()=>4))},
    {nome:"Componente por posição", linhas:comps,
     larguras:[6,30].concat(Array.from({length:pr.nq},()=>6))}
  ];
}

function abasDaEvolucao(hist){
  const L1=[["nº","Estudante","Turma","Componente","Descritor","Descrição",
    "Acerto atual (%)","Acerto anterior (%)","Diferença (p.p.)","Situação",
    "Avaliações","Simulado atual","Simulado anterior","Dificuldade persistente"]];
  hist.linhas.forEach(L=>L1.push([String(L.numero), L.nome, L.turma,
    nomeComp(L.comp), L.cod, L.texto,
    num2(L.atual.pct), L.anterior?num2(L.anterior.pct):null, num2(L.delta),
    L.rotuloClasse, L.vezes, L.atual.simulado.titulo,
    L.anterior?L.anterior.simulado.titulo:"", L.persistente?"sim":""]));

  const R=resumoLongitudinal(hist);
  const L2=[["Componente","Descritor","Descrição","Acerto médio atual (%)",
    "Estudantes","Melhoraram","Mantiveram","Pioraram","1ª avaliação","Dificuldade persistente"]];
  R.forEach(x=>L2.push([nomeComp(x.comp), x.cod, x.texto, num2(x.mediaAtual),
    x.estudantes, x.melhorou, x.manteve, x.piorou, x.primeira, x.persistentes]));

  const L3=[["Simulado","Turma","Ano","Etapa"]];
  hist.avaliacoes.forEach(a=>L3.push([a.titulo, a.turma, a.ano, etapaDe(a.etapa).nome]));

  return [
    {nome:"Evolução por estudante", linhas:L1,
     larguras:[6,28,10,18,11,46,15,17,15,18,11,20,20,20]},
    {nome:"Resumo por descritor", linhas:L2, larguras:[18,11,46,19,11,12,12,11,12,20]},
    {nome:"Simulados considerados", linhas:L3, larguras:[28,12,8,30]}
  ];
}

  /* ── nota de participação ─────────────────────────────────────── */

  }else{
    h+=part.map(L=>`<div class="aluno" style="cursor:default">
      <div style="flex:1;min-width:0">
        <div class="nm"><span style="color:var(--mute);font-family:var(--mono);font-size:12px">${esc(L.aluno.numero)} </span>${esc(L.aluno.nome)}</div>
        <div class="rs">${L.res
          ? L.acertos+" de "+L.total+" · "+COMPONENTES.filter(c=>L.porComp[c.id].total)
              .map(c=>esc(c.curto)+" "+L.porComp[c.id].acertos+"/"+L.porComp[c.id].total).join(" · ")
          : "não fez o simulado"}${L.manual!=null?" · lançada à mão":""}</div></div>
      <input data-part="${esc(L.aluno.numero)}" type="number" inputmode="decimal"

    h+=`<p class="hint">O número em cinza é o que sai dos acertos. Escreva por cima para
      lançar outro valor — apague para voltar ao calculado. O máximo é ${vg(valor)}.</p>`;
    const somaP=feitosP.reduce((x,L)=>x+L.nota,0);
    h+=`<div class="kpi" style="margin-top:12px">
      <div><div class="v">${vg(somaP/feitosP.length)}</div><div class="l">Média da turma</div></div>
      <div><div class="v">${feitosP.length}<span style="font-size:13px;color:var(--mute)">/${part.length}</span></div>
        <div class="l">Fizeram</div></div>
      <div><div class="v">${feitosP.filter(L=>L.nota>=valor*0.6).length}</div>

    <button class="btn sec" id="partCsv" style="margin-top:12px">Baixar notas de participação</button>`;

  h+=`<div class="rot">Exportar</div>

  box.innerHTML=h;
  if(irParticipacao){

    const alvo=$("#secaoPart");

      "acertos","percentual","theta","proficiencia_estimada","padrao","metodo"];

    apuros.forEach(A=>A.linhas.forEach(L=>lin.push([e.curto,t.nome,et.nome,sm.titulo,

      L.padrao?L.padrao.nome:"", A.metodo==="tri"?"TRI 3 parâmetros":"percentual"].join(";"))));
    baixar([cab.join(";"),...lin].join("\r\n"),
      "saepe_"+t.nome+"_"+sm.ano+".csv","text/csv");
  };
}

function telaProvas(box){
  const t=turmaDe(casaTurma);
  if(!t){ casaNivel="turmas"; return montarCasa(); }
  if(!casaDisc || !discDe(t,casaDisc)) casaDisc=primeiraDisc(t);
  if(!casaDisc){ casaNivel="disciplinas"; return montarCasa(); }
  const e=escolaDe(t.escola)||{curto:""}, ps=provasDe(t.id,casaDisc);
  let h=`<div class="migalha"><button id="mVolta">‹ ${esc(t.nome)}</button><span>·</span><span>${esc(e.curto||"")}</span></div>
    <h2>${esc(t.nome)} · ${esc(nomeDisc(t,casaDisc))}</h2>
    <p class="sub">${esc(t.serie||"")}${t.serie?" · ":""}${t.alunos.length} estudante${t.alunos.length===1?"":"s"} ·
      ${calendario(t).qtd} ${calendario(t).tipo==="trimestre"?"trimestres":"bimestres"} no ano</p>
    <button class="item" id="bAlunos"><div class="cor"><div class="t1">Estudantes da turma</div>
      <div class="t2">${t.alunos.length?"Ver, editar ou substituir a lista":"Nenhum estudante ainda — toque para cadastrar"}</div>
      </div><span class="ch">›</span></button>
    <div class="rot">Provas de ${esc(nomeDisc(t,casaDisc))}</div>`;
  const cartaoProva=p=>{
    const n=resDa(p.id).length, tot=t.alunos.length;
    const tag=!n?'<span class="tag">0 corrigidos</span>'
      :(tot&&n>=tot?`<span class="tag ok">${n} de ${tot}</span>`
                   :`<span class="tag par">${n}${tot?" de "+tot:" corrigidos"}</span>`);
    return `<button class="item ${p.id===E.ativa?"sel":""}" data-p="${p.id}"><div class="cor">
      <div class="t1">${esc(p.titulo||p.codigo)}</div>
      <div class="t2">${esc(p.codigo)} · ${p.nq} questões · A–${LETRAS_ATE(p.no)}</div>
      </div>${tag}<span class="ch">›</span></button>`;
  };
  if(!ps.length){
    h+='<div class="vazio" style="padding:28px 16px"><b>Nenhuma prova ainda</b>Crie a primeira abaixo.</div>';
  }else{
    periodosDe(t).forEach(n=>{
      const doPeriodo=provasDoPeriodo(t.id,n,casaDisc);
      h+=`<div class="grupo"><div class="esc"><span class="nm">${esc(nomePeriodo(t,n))}</span>
        <span class="ln"></span>
        ${doPeriodo.length?`<button class="tag" data-fech="${n}">fechamento</button>`:""}</div>`;
      h+=doPeriodo.length?doPeriodo.map(cartaoProva).join("")
        :'<p class="hint" style="margin:0 0 4px">Nenhuma prova neste período.</p>';
      h+="</div>";
    });
    const soltas=ps.filter(p=>!periodosDe(t).includes(p.periodo||1));
    if(soltas.length) h+=`<div class="grupo"><div class="esc"><span class="nm">Fora do calendário</span>
      <span class="ln"></span></div>`+soltas.map(cartaoProva).join("")+"</div>";
  }
  h+=`<button class="btn" id="bSubir" style="margin-top:14px">Subir prova pronta</button>
      <p class="hint">Foto, PDF ou Word — o app lê as questões e já preenche o cadastro.</p>
      <button class="btn gho" id="bNova" style="margin-top:10px">Criar prova em branco</button>`;
  box.innerHTML=h;
  $("#mVolta").onclick=()=>{casaNivel="disciplinas";montarCasa();};
  $("#bAlunos").onclick=()=>{casaNivel="alunos";montarCasa();};
  $("#bNova").onclick=()=>{casaForm=null;casaNivel="nova";montarCasa();};
  $("#bSubir").onclick=()=>{substituindo=null;casaProva=null;casaForm=null;
    iaArquivo=null;iaTextoDoc=null;iaImagens=[];casaNivel="ler";montarCasa();};
  box.querySelectorAll("[data-fech]").forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation(); casaPeriodo=+b.dataset.fech; casaNivel="fechamento"; montarCasa(); });
  box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    voltaPara.prova="provas";
    casaProva=b.dataset.p; ativar(casaProva); casaNivel="prova"; montarCasa(); });
}

function textoDeArquivo(txt,nome,nomeTurma){
  if(/\.json$/i.test(nome)){
    try{ const d=JSON.parse(txt);
      let al=Array.isArray(d)?d:(d.alunos||[]);
      const desta=al.filter(a=>String(a.turma||"").toUpperCase()===nomeTurma.toUpperCase());
      if(desta.length) al=desta;
      return al.map(a=>(a.numero||"")+" "+(a.nome||"")).join("\n");
    }catch(e){ return txt; }
  }
  return txt;
}
/* Listas de chamada vêm com cabeçalho, rodapé e colunas extras.
   Fica só o que parece nome de estudante. */
function limparListaBruta(txt){
  const fora=new RegExp("(rela[çc][ãa]o|lista|escola|turma|s[ée]rie|disciplina|professor"+
    "|ano letivo|p[áa]gina|total de|n[ºo°]?\\s*ordem|nome do aluno|matr[íi]cula"+
    "|assinatura|data)","i");
  return String(txt).split(/\r?\n/).filter(l=>{
    const t=l.trim();
    if(!t) return false;
    if(t.length<4) return false;
    if(fora.test(t) && !/^\d{1,3}[\s;,.\-]/.test(t)) return false;   // cabeçalho
    if(!/[A-Za-zÀ-ÿ]{3}/.test(t)) return false;                        // sem palavra
    return true;
  }).join("\n");
}
function lerListaAlunos(txt){
  const out=[]; let auto=0;
  String(txt).split(/\r?\n/).forEach(l=>{
    l=l.trim(); if(!l) return;
    let num="",nome=l;
    const m=/^(\d{1,3})\s*[;,\t.\-]?\s+(.+)$/.exec(l);
    if(m){ num=m[1]; nome=m[2]; }
    else { const c=l.split(/[;,\t]/); if(c.length>1&&/^\d{1,3}$/.test(c[0].trim())){
      num=c[0].trim(); nome=c.slice(1).join(" "); } }
    nome=nome.replace(/[;,\t]+/g," ").replace(/\s{2,}/g," ").trim();
    if(!nome||/^\d+$/.test(nome)) return;
    if(!num) num=String(++auto).padStart(2,"0"); else num=num.padStart(2,"0");
    if(out.some(a=>a.numero===num)) num=String(out.length+1).padStart(2,"0");
    out.push({numero:num,nome:nome.toUpperCase(),desde:1,ate:null});
  });
  return out.sort((a,b)=>ordNum(a.numero,b.numero));
}

/* ═══════════════════════════════════════════════════════════════════
   6. CÂMERA
   ═══════════════════════════════════════════════════════════════════ */
const video=$("#video"), over=$("#over"), ctx=over.getContext("2d");
const tmp=document.createElement("canvas"), tctx=tmp.getContext("2d",{willReadFrequently:true});
let stream=null, rodando=false, hist=[], travado=null, ultimoQuad=null, alunoQR=null, semQR=0;
let semCartao=0, giroLayout=0, giroQR=0;

async function iniciar(){
  if(!provaAtiva()){ irPara("casa"); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},
    width:{ideal:1920},height:{ideal:1440}},audio:false});
  }catch(e){ faixa("Câmera indisponível","Use “Usar foto” ou a aba Manual",true);
    $("#acoes2").style.display="flex"; return; }
  video.srcObject=stream; await video.play();
  rodando=true; hist=[]; travado=null; alunoQR=null; semQR=0; semCartao=0;
  $("#acoes").innerHTML=""; $("#acoes2").style.display="flex"; $("#grade").hidden=false;
  desenhaGrade(null,false); laco();
}
function parar(){
  rodando=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  video.srcObject=null; ctx.clearRect(0,0,over.width,over.height);
  $("#grade").hidden=true; $("#acoes2").style.display="none";
  $("#acoes").innerHTML='<button class="btn" id="bIniciar">Iniciar câmera</button>';
  $("#bIniciar").onclick=iniciar;
  const p=provaAtiva();
  faixa("Câmera parada", p?resDa(p.id).length+" cartões salvos":"Escolha uma prova");
}
function faixa(t,s,al){ $("#ftit").textContent=t; $("#fsub").textContent=s;
  $("#dot").style.background=al?"var(--coral)":(travado?"var(--mint)":"var(--amber)"); }
let falhas=0;
function laco(){
  if(!rodando) return;
  try{
    if(video.readyState>=2 && !travado) processar();
    falhas=0;
  }catch(err){
    console.error("quadro descartado:",err);
    if(++falhas===8) faixa("Erro na leitura","Recarregue a página; confira se todos os arquivos subiram",true);
  }
  setTimeout(()=>requestAnimationFrame(laco),70);
}
function processar(){
  const vw=video.videoWidth, vh=video.videoHeight; if(!vw) return;
  const alvo=Math.min(1100,vw);
  tmp.width=alvo; tmp.height=Math.round(vh*alvo/vw);
  tctx.drawImage(video,0,0,tmp.width,tmp.height);
  analisar(tctx.getImageData(0,0,tmp.width,tmp.height),true);
}
/* se o cartão some por muito tempo, testa os outros formatos cadastrados —
   resolve o caso de apontar a câmera para a prova errada */
function formatosConhecidos(){
  const fmts=[];
  E.provas.forEach(p=>{ const k=p.nq+"x"+p.no;
    if(p.nq>=MIN_Q_CARTAO && !fmts.some(f=>f.k===k)) fmts.push({k,nq:p.nq,no:p.no}); });
  return fmts;
}
function formatoAtual(){ return LAY.n_questions+"x"+LAY.n_options; }
/* Os formatos a tentar, começando pelo que está ativo. Se o layout ativo
   não for de nenhuma prova cadastrada (prova nenhuma escolhida, por
   exemplo), ele entra na lista assim mesmo — senão, com um único formato
   conhecido, o giro nunca acontecia e o app ficava presoo para sempre. */
function candidatosDeLayout(){
  const fmts=formatosConhecidos(), atual=formatoAtual();
  const lista=fmts.filter(f=>f.k===atual);
  if(!lista.length) lista.push({k:atual,nq:LAY.n_questions,no:LAY.n_options});
  return lista.concat(fmts.filter(f=>f.k!==atual));
}
function tentarOutroLayout(){
  const fmts=candidatosDeLayout();
  if(fmts.length<2) return false;
  /* pula o formato ativo: girar para ele mesmo gastava mais 8 quadros
     sem mudar nada na tela */
  for(let i=0;i<fmts.length;i++){
    giroLayout=(giroLayout+1)%fmts.length;
    const f=fmts[giroLayout];
    if(f.k!==formatoAtual()) return aplicarLayout(f.nq,f.no);
  }
  return false;
}
/* O QR mora numa janela calculada a partir do layout ATIVO. Quando o
   cartão na frente da câmera é de outro tamanho, essa janela cai no lugar
   errado e o QR NUNCA é lido — os marcadores, esses, são encontrados. Era
   o caso do cartão de simulado com uma prova comum ativa: "Cartão
   localizado / aproxime um pouco", para sempre, sem capturar resposta
   nenhuma. Em vez de esperar o giro de formato (um a cada 8 quadros),
   tentamos os outros formatos JÁ NESTE QUADRO, poucos por vez para não
   derrubar a taxa de leitura. O formato que decodificar fica valendo. */
const FORMATOS_POR_QUADRO=2;
function lerQRDeQualquerFormato(src,quad){
  const cands=candidatosDeLayout();
  const p=lerQR(src,quad);                     // o ativo, sempre
  if(p||cands.length<2) return p;
  const antes={nq:LAY.n_questions,no:LAY.n_options};
  const outros=cands.filter(f=>f.k!==formatoAtual());
  for(let i=0;i<Math.min(FORMATOS_POR_QUADRO,outros.length);i++){
    giroQR=(giroQR+1)%outros.length;
    const f=outros[giroQR];
    aplicarLayout(f.nq,f.no);
    const q=lerQR(src,quad);
    if(q) return q;                            // deixa o formato que leu
  }
  aplicarLayout(antes.nq,antes.no);            // nada leu: volta ao de antes
  return null;
}
function analisar(imgData,aoVivo){
  const src=cinza(imgData), quad=fiduciais(reduzir(src,620));
  ultimoQuad=quad;
  if(aoVivo) pintar(quad,imgData.width,imgData.height);
  if(!quad){ hist=[]; desenhaGrade(null,false);
    if(aoVivo && ++semCartao%28===0 && tentarOutroLayout())
      faixa("Ajustando o formato…","Testando outro tamanho de cartão");
    else faixa("Procurando o cartão","Enquadre a moldura tracejada inteira");
    return false; }
  semCartao=0;
  if(!alunoQR){ const p=lerQRDeQualquerFormato(src,quad);
    if(p){ const r=aplicarQR(p);
      if(r==="trocou"){ hist=[]; faixa("Formato ajustado","Mantenha o cartão enquadrado"); return false; }
      if(r) semQR=0; else semQR++;
    } else semQR++;
    /* O QR é lido numa janela calculada a partir do layout ATIVO. Se o
       cartão na frente da câmera é de outro tamanho — um simulado de 16
       itens com uma prova de 10 ativa —, a janela cai no lugar errado e
       o QR nunca é lido. Os marcadores, esses, são encontrados: por isso
       o app ficava preso em "aproxime um pouco" para sempre. Aqui ele
       passa a girar os formatos também quando o cartão foi achado. */
    if(!alunoQR && semQR>0 && semQR%8===0 && tentarOutroLayout()){
      hist=[]; faixa("Ajustando o formato…","Testando outro tamanho de cartão");
      return false;
    } }
  const L=lerBolhas(src,quad); if(!L) return false;
  desenhaGrade(L.R,false);
  if(!alunoQR && semQR<=40){
    faixa("Cartão localizado", semQR>14
      ? "Gire o celular na horizontal e encha a tela com o cartão"
      : "Aproxime um pouco para o QR entrar em foco"); return false; }
  if(!alunoQR){ faixa("QR ilegível","Toque em “Usar foto” — a foto tem mais nitidez",true);
    return false; }
  const ch=L.R.join("|"); hist.push(ch); if(hist.length>3) hist.shift();
  if(hist.length===3 && hist[0]===hist[1] && hist[1]===hist[2]){ travar(L); return true; }
  faixa("Lendo "+primeiroNome(alunoQR.nome)+"…",
        alunoQR.turma+" · nº "+alunoQR.numero+" · "+L.R.filter(Boolean).length+"/"+NQ);
  return false;
}
/* DBM2/DBM3 = 10 questões, 5 alternativas.  DBM4 traz a assinatura do layout. */
function aplicarQR(p){
  const t=String(p).split("|");
  if(!/^DBM[234]$/.test(t[0]||"")||t.length<3) return false;
  const g=(t[2]||"").toUpperCase();
  if(!/^[A-E]{5,30}$/.test(g)) return false;
  let nq=g.length, no=5;
  if(t[0]==="DBM4"){ const a=lerAssinatura(t[6]);
    if(a){ nq=a.nq; no=a.no; } }
  if(nq!==g.length) return false;
  const codigo=(t[1]||"").trim();
  const turma=(t[3]||"").trim(), numero=(t[4]||"").trim(), nome=(t[5]||"").trim();
  if(!nome) return false;

  // achar (ou criar) a prova correspondente a este cartão
  let pr=E.provas.find(x=>x.codigo===codigo&&x.nq===nq&&x.no===no)
      || E.provas.find(x=>x.codigo===codigo);
  if(!pr){
    /* o QR traz o nome da turma em ASCII (ver `soAscii`, no gerador):
       "3º Ano A" chega como "3o Ano A". A comparação ignora acentos. */
    const semAcento=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[ºª]/g,m=>m==="º"?"o":"a").toUpperCase().trim();
    let tu=E.turmas.find(x=>semAcento(x.nome)===semAcento(turma));
    if(!tu){
      if(!E.escolas.length)
        E.escolas.push({id:uid("e"),nome:"Minha escola",curto:"Minha escola",ativa:true});
      tu={id:uid("t"),escola:E.escolas[0].id,nome:turma,serie:"",
        disciplina:"Disciplina",
        disciplinas:[{id:uid("d"),nome:"Disciplina",ativa:true}],
        alunos:[],periodo:{tipo:"bimestre",qtd:4},ativa:true};
      E.turmas.push(tu); }
    pr={id:uid("p"),turma:tu.id,disciplina:primeiraDisc(tu),
        codigo:codigo||"PROVA",titulo:"",nq,no,
        gabC:inferirCanonico(g,turma,numero,nq,no),habs:[],criada:Date.now()};
    E.provas.push(pr);
  }
  const trocou=(pr.id!==E.ativa);
  if(trocou){ E.ativa=pr.id; refletirBarra(); }
  const mudouLayout=aplicarLayout(pr.nq,pr.no);

  const tu=turmaDe(pr.turma);
  if(tu&&numero&&!tu.alunos.some(a=>a.numero===numero)){
    tu.alunos.push({numero,nome,desde:1,ate:null}); tu.alunos.sort((a,b)=>ordNum(a.numero,b.numero)); }

  /* O QR carrega o nome abreviado (ver `nomeCurtoQR`, no gerador): quem
     identifica o estudante é turma + número. Se ele já está na lista da
     turma, é o nome de lá que vale — inteiro, do jeito que o professor
     digitou. */
  const naLista=tu?(tu.alunos||[]).find(a=>a.numero===numero):null;
  alunoQR={turma:tu?tu.nome:turma,numero,nome:(naLista&&naLista.nome)||nome,gab:g};
  salvar(); montarManual();
  return mudouLayout?"trocou":true;
}
function inferirCanonico(gabAluno,turma,numero,nq,no){
  const {oq,oa}=embaralharProva(nq,no,turma,numero);
  const letras=["A","B","C","D","E"].slice(0,no);
  const out=new Array(nq).fill(letras[0]);
  for(let i=0;i<nq;i++){
    const k=letras.indexOf(gabAluno[i]);
    if(k>=0) out[oq[i]]=letras[oa[i][k]];
  }
  return out.join("");
}
function pintar(quad,w,h){
  const r=video.getBoundingClientRect(), dpr=devicePixelRatio||1;
  over.width=r.width*dpr; over.height=r.height*dpr;
  over.style.width=r.width+"px"; over.style.height=r.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  if(!quad) return;
  const e=Math.max(r.width/w,r.height/h), ox=(r.width-w*e)/2, oy=(r.height-h*e)/2;
  ctx.beginPath(); quad.forEach(([x,y],i)=>ctx[i?"lineTo":"moveTo"](x*e+ox,y*e+oy));
  ctx.closePath(); ctx.strokeStyle=travado?"#34D399":"#F97316"; ctx.lineWidth=3.5;
  ctx.setLineDash(travado?[]:[13,9]); ctx.stroke(); ctx.setLineDash([]);
  quad.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x*e+ox,y*e+oy,6,0,6.2832);
    ctx.fillStyle=travado?"#34D399":"#F97316"; ctx.fill(); });
}
function desenhaGrade(R,lk){
  const g=$("#grade");
  if(!g.dataset.pronto){ let h='<span></span>'+LAY.options.map(o=>`<span class="h">${o}</span>`).join("");
    for(let q=1;q<=NQ;q++){ h+=`<span class="q">${q}</span>`;
      for(let k=0;k<NO;k++) h+=`<i data-q="${q}" data-k="${k}"></i>`; }
    g.innerHTML=h; g.dataset.pronto="1";
    g.style.gridTemplateColumns="auto repeat("+NO+",14px)"; }
  g.querySelectorAll("i").forEach(el=>{
    const on=R && R[+el.dataset.q-1]===LAY.options[+el.dataset.k];
    el.className=on?(lk?"lk":"on"):""; });
}

/* ═════════ 7. CONFERÊNCIA ═════════ */
let atual=null;
function travar(L){
  travado=true; atual={R:L.R.slice(),mark:L.mark.slice()};
  desenhaGrade(L.R,true); pintar(ultimoQuad,tmp.width,tmp.height);
  if(navigator.vibrate) try{navigator.vibrate(55);}catch(e){}
  montarPainel();
}
let notaDiscAtual=0;
function atualizarNotaTopo(){
  const p=provaAtiva(), gab=alunoQR.gab;
  const n=atual.R.reduce((s,r,i)=>s+(r&&r===gab[i]?1:0),0);
  const nf=notaFinal(p,{acertos:n,notaDisc:notaDiscAtual}), max=notaMaxima(p);
  const rel=max?10*nf/max:0;
  $("#ntv").textContent=n;
  $("#ntv").style.color=rel>=6?"var(--mint)":(rel>=4?"var(--amber)":"var(--coral)");
  $("#ntd").textContent=`de ${p.nq}  ·  ${pct(n,p.nq)}%  ·  nota `+
    nf.toFixed(1).replace(".",",")+(pontosDisc(p)?" de "+max.toFixed(1).replace(".",","):"");
}
function montarPainel(){
  const gab=alunoQR.gab, p=provaAtiva();
  const n=atual.R.reduce((s,r,i)=>s+(r&&r===gab[i]?1:0),0);
  atualizarNotaTopo();
  const rep=E.res.find(a=>a.prova===p.id&&a.numero===alunoQR.numero);
  $("#boxAluno").innerHTML=`<div class="card" style="margin:0">
      <h3>${esc(alunoQR.nome)}</h3><p>${esc(alunoQR.turma)} · nº ${esc(alunoQR.numero)}</p></div>`+
    (rep?`<div class="aviso" style="margin-top:9px">Já corrigido (${rep.acertos} acertos). Salvar substitui o registro, sem duplicar.</div>`:"");
  if(pontosDisc(p)>0){
    $("#boxAluno").innerHTML+=`<div class="card" style="margin-top:9px">
      <h3>Parte escrita</h3><p style="margin-bottom:8px">Vale até ${pontosDisc(p)} pontos.</p>
      <input id="ndAuto" type="number" min="0" max="${pontosDisc(p)}" step="0.25"
        inputmode="decimal" placeholder="0" value="${notaDiscAtual||""}"></div>`;
    $("#ndAuto").oninput=()=>{ notaDiscAtual=Math.max(0,Math.min(pontosDisc(p),
      parseFloat($("#ndAuto").value)||0)); atualizarNotaTopo(); };
  }
  const amb=atual.mark.map((m,i)=>m!=="OK"?i+1:0).filter(Boolean);
  $("#avAmb").hidden=!amb.length;
  if(amb.length) $("#avAmb").textContent=`Questão ${amb.join(", ")}: sem marcação clara. Confira no papel.`;
  $("#conf").innerHTML=atual.R.map((r,i)=>{
    const cls=r===null?"vz":(r===gab[i]?"ok":"no");
    return `<button class="qc ${cls}" data-i="${i}"><div class="n">${String(i+1).padStart(2,"0")}</div>
      <div class="a">${r||"—"}</div><div class="g">gab ${gab[i]}</div></button>`;}).join("");
  $("#conf").querySelectorAll(".qc").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, o=[...LAY.options,null];
    atual.R[i]=o[(o.indexOf(atual.R[i])+1)%o.length]; montarPainel(); });
  $("#painel").classList.add("on");
}
$("#bDescartar").onclick=()=>fecharPainel();
$("#bSalvar").onclick=()=>{
  registrar({numero:alunoQR.numero,nome:alunoQR.nome,gab:alunoQR.gab,
             R:atual.R,origem:"auto",notaDisc:notaDiscAtual});
  fecharPainel(); };
function fecharPainel(){
  $("#painel").classList.remove("on");
  atual=null; travado=null; hist=[]; alunoQR=null; semQR=0; notaDiscAtual=0;
  desenhaGrade(null,false);
  const p=provaAtiva();
  faixa("Pronto para o próximo", (p?resDa(p.id).length:0)+" cartões salvos");
}

let manAluno=null, manR=[], manDisc=0;
function montarManual(){
  const box=$("#manPasso"), p=provaAtiva(), t=turmaAtiva();
  if(!p||!t){ box.innerHTML='<div class="vazio"><b>Nenhuma prova selecionada</b>Escolha a turma e a prova na aba Turmas.</div>'; return; }
  if(!t.alunos.length){ box.innerHTML=`<div class="vazio"><b>Turma ${esc(t.nome)} sem estudantes</b>Cadastre a lista em Turmas › ${esc(t.nome)} › Estudantes.</div>`; return; }
  const daVez=alunosDaProva(t,p);
  if(!daVez.length){ box.innerHTML=`<div class="vazio"><b>Ninguém matriculado neste período</b>

  if(!manAluno){
    box.innerHTML=`<div class="rot">Escolha o estudante — ${esc(t.nome)} · ${esc(p.codigo)}</div>`+
      daVez.map(a=>{
        const j=E.res.find(x=>x.prova===p.id&&x.numero===a.numero);

          <div class="nm">${esc(a.nome)}</div>

          <div class="nt" style="color:${j?"var(--mint)":"var(--mute)"}">${j?j.acertos:"›"}</div></button>`;
      }).join("");
    box.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
      manAluno=b.dataset.n;
      const j=E.res.find(x=>x.prova===p.id&&x.numero===manAluno);
      manR=j?j.R.slice():new Array(p.nq).fill(null);
      manDisc=j?(j.notaDisc||0):0;
      montarManual(); });
    return; }
  const al=t.alunos.find(a=>a.numero===manAluno)||{nome:"—",numero:manAluno};

  box.innerHTML=`<button class="btn gho" id="bVolta2" style="margin-bottom:12px">‹ Trocar estudante</button>
    <div class="card"><h3>${esc(al.nome)}</h3><p>${esc(t.nome)} · nº ${esc(manAluno)} · ${esc(p.codigo)}</p></div>
    <div class="rot">Toque nas alternativas marcadas pelo aluno</div>
    <div id="manGridBox"></div>
    ${pontosDisc(p)>0?`<div class="rot">Parte escrita — até ${pontosDisc(p)} pontos</div>
      <input id="manDisc" type="number" min="0" max="${pontosDisc(p)}" step="0.25"
        inputmode="decimal" placeholder="0" value="${manDisc||""}">`:""}
    <div class="linha" style="margin-top:18px">
      <button class="btn gho" id="bLimpaMan">Limpar</button>
      <button class="btn" id="bEnviaMan">Enviar</button></div>`;
  const gb=$("#manGridBox");
  gb.style.setProperty("--no",p.no);
  gb.innerHTML=`<div class="opt" style="grid-template-columns:auto repeat(${p.no},1fr)"><span class="qn"></span>${
      LAY.options.map(o=>`<span style="text-align:center;color:var(--mute);font-size:10px">${o}</span>`).join("")}</div>`+
    Array.from({length:p.nq},(_,q)=>`<div class="opt" style="grid-template-columns:auto repeat(${p.no},1fr)">
      <span class="qn">${String(q+1).padStart(2,"0")}</span>`+
      LAY.options.map(o=>`<button data-q="${q}" data-o="${o}"${manR[q]===o?' class="sel"':''}>${o}</button>`).join("")+
      `</div>`).join("");
  gb.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q, o=b.dataset.o;
    manR[q]=(manR[q]===o)?null:o;
    gb.querySelectorAll(`[data-q="${q}"]`).forEach(x=>
      x.classList.toggle("sel",manR[q]===x.dataset.o)); });
  $("#bVolta2").onclick=()=>{manAluno=null;montarManual();};
  $("#bLimpaMan").onclick=()=>{manR=new Array(p.nq).fill(null);montarManual();};
  if($("#manDisc")) $("#manDisc").oninput=()=>{
    manDisc=Math.max(0,Math.min(pontosDisc(p),parseFloat($("#manDisc").value)||0)); };
  $("#bEnviaMan").onclick=()=>{
    const r=registrar({numero:manAluno,nome:al.nome,R:manR,origem:"manual",notaDisc:manDisc});
    if(!r){ alert("Não foi possível calcular o gabarito desta prova."); return; }
    alert(`${al.nome}\n${r.acertos} acertos de ${p.nq}`+
      (pontosDisc(p)?`\nParte escrita: ${r.notaDisc}`:"")+
      `\nNota final: ${r.nota.toFixed(1).replace(".",",")} de ${notaMaxima(p).toFixed(1).replace(".",",")}`);
    manDisc=0;
    manAluno=null; montarManual(); irPara("res"); };
}

/* Escolher a prova sem sair da aba. A lista respeita a hierarquia do
   cadastro: escola › turma › disciplina › período. */
const seletorAberto={};

        esc(atual.titulo||nomePeriodo(tAtual,atual.periodo||1)):"Nenhuma prova selecionada"}</div>
    </div><span class="ch">${aberto?"⌃":"⌄"}</span></button>`;

            style="padding:10px 12px;margin-bottom:5px">

            <div class="t2">${esc(rotuloProva(pr))} · ${ehCaderno(pr)
              ?(simuladoDe(pr.simulado)||{ano:""}).ano
              :esc(nomePeriodo(t,pr.periodo||1))} ·
              ${n}${tot?" de "+tot:""} corrigidos</div></div>
            <span class="ch">›</span></button>`;

/* As abas Ler e Manual trabalham com a prova ATIVA, e até aqui só havia
   um caminho para tornar ativo um caderno de simulado: o botão da etapa 6.
   Quem já tinha impresso o simulado e voltava depois para corrigir não
   tinha por onde escolhê-lo — a lista de provas da turma exclui cadernos
   de propósito (`provasDe`). O resultado eram os dois sintomas juntos: a
   aba Manual mostrava a prova comum, e a câmera, com o layout da prova
   comum ativo, achava os marcadores e nunca lia o QR do cartão maior.
