<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#071324">
<link rel="manifest" href="manifest.webmanifest">
<title>Correção de Provas · Desbugando a Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071324; --navy:#0E2145; --slate:#17294A; --line:#243B64;
  --orange:#F97316; --amber:#FBBF24; --mint:#34D399; --coral:#FB5A5A; --sky:#60A5FA;
  --paper:#F2F4F8; --mute:#7E93B8;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;
  line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--paper);background:var(--navy);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:1px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100dvh}
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.view.on{display:block}
#v-ler{padding:0;overflow:hidden}

nav{display:flex;background:var(--navy);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
nav button{flex:1;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--mute);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;border-top:2px solid transparent;margin-top:-1px;position:relative}
nav button.on{color:var(--orange);border-top-color:var(--orange)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav .pill{position:absolute;top:5px;left:56%;background:var(--orange);color:var(--ink);
  font-family:var(--mono);font-size:9px;font-weight:700;min-width:15px;padding:0 4px;
  border-radius:8px;line-height:1.5}

#palco{position:absolute;inset:0;background:#000;overflow:hidden}
#video,#over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%}
#video{object-fit:cover}
#faixa{position:absolute;top:0;left:0;right:0;
  padding:calc(10px + env(safe-area-inset-top)) 14px 22px;
  background:linear-gradient(#071324f2,#07132400);display:flex;gap:11px;align-items:flex-start}
#faixa .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);margin-top:6px;
  flex:0 0 auto;animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 #fbbf2466}70%{box-shadow:0 0 0 9px #fbbf2400}100%{box-shadow:0 0 0 0 #fbbf2400}}
#faixa .t{font-weight:600;font-size:14.5px;line-height:1.3}
#faixa .s{color:var(--mute);font-size:12px;font-family:var(--mono);margin-top:2px}
#grade{position:absolute;right:11px;bottom:96px;background:#071324e0;border:1px solid var(--line);
  border-radius:13px;padding:9px 8px;backdrop-filter:blur(7px);display:grid;
  grid-template-columns:auto repeat(5,14px);gap:3px;font-family:var(--mono);font-size:9.5px;
  align-items:center}
#grade .h{color:var(--mute);text-align:center;font-size:8.5px}
#grade .q{color:var(--mute);font-size:9px;padding-right:3px;text-align:right}
#grade i{width:14px;height:11px;border-radius:3px;background:#1b3055;display:block}
#grade i.on{background:var(--orange)} #grade i.lk{background:var(--mint)}
#rodape{position:absolute;left:0;right:0;bottom:0;padding:14px;
  background:linear-gradient(#07132400,#071324f2 40%)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border-radius:13px;font-weight:600;font-size:15.5px;background:var(--orange);color:#231000;
  transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--slate);color:var(--paper);border:1px solid var(--line)}
.btn.gho{background:none;color:var(--mute);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.linha{display:flex;gap:9px}

#painel{position:absolute;inset:0;background:var(--ink);z-index:20;display:none;
  flex-direction:column;padding:0 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
#painel.on{display:flex}
#nota{display:flex;align-items:baseline;gap:11px;padding:20px 0 4px}
#nota b{font-family:var(--mono);font-size:54px;font-weight:600;line-height:.9;letter-spacing:-.04em}
#nota span{color:var(--mute);font-family:var(--mono);font-size:13px}
.rot{color:var(--mute);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;margin:22px 0 9px}
#conf,#manGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.qc{background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:8px 5px 9px;
  text-align:center}
.qc .n{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.qc .a{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.15}
.qc .g{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.qc.ok{border-color:#34d39955} .qc.ok .a{color:var(--mint)}
.qc.no{border-color:#fb5a5a55} .qc.no .a{color:var(--coral)}
.qc.vz .a{color:var(--mute)}

.card{background:var(--navy);border:1px solid var(--line);border-radius:15px;padding:14px;
  margin-bottom:11px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--mute);font-size:12.5px}
label{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;margin:13px 0 6px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
h2{font-size:20px;font-weight:600;margin:6px 0 3px}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 16px}

.aluno{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--navy);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;width:100%;text-align:left}
.aluno .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.aluno .rs{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.aluno .nt{font-family:var(--mono);font-size:19px;font-weight:600}

.barra{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.barra .q{font-family:var(--mono);font-size:10.5px;color:var(--mute);width:26px;flex:0 0 auto}
.barra .lb{font-size:11.5px;color:var(--paper);flex:0 0 118px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.barra .t{flex:1;height:18px;background:var(--slate);border-radius:5px;overflow:hidden}
.barra .f{height:100%;background:var(--mint);border-radius:5px;transition:width .5s}
.barra .f.baixo{background:var(--coral)} .barra .f.medio{background:var(--amber)}
.barra .p{font-family:var(--mono);font-size:11px;width:36px;text-align:right;flex:0 0 auto}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.kpi div{background:var(--navy);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--mute);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;margin-top:2px}

.vazio{text-align:center;padding:52px 22px;color:var(--mute)}
.vazio b{display:block;color:var(--paper);font-size:16px;font-weight:600;margin-bottom:5px}
.aviso{background:#f9731618;border:1px solid #f9731644;color:#FDBA74;border-radius:11px;
  padding:10px 12px;font-size:12.5px;margin-bottom:11px}
.diag{background:var(--navy);border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:11px;padding:12px 13px;margin-bottom:9px;font-size:13px}
.diag b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--orange);margin-bottom:5px}
.diag ul{margin:5px 0 0;padding-left:17px} .diag li{margin-bottom:3px}
.diag strong{display:inline;font-weight:600;color:var(--orange);
  font-size:inherit;letter-spacing:normal;text-transform:none;margin:0}

.opt{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;align-items:center;
  margin-bottom:5px}
.opt .qn{font-family:var(--mono);font-size:11px;color:var(--mute);width:24px}
.opt button{border:1px solid var(--line);background:var(--navy);border-radius:9px;padding:9px 0;
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mute)}
.opt button.sel{background:var(--orange);border-color:var(--orange);color:#231000}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── acréscimos da versão universal ───────────────────────────── */
#barra{flex:0 0 auto;background:var(--navy);border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:10px}
#barra .ctx{flex:1;min-width:0}
#barra .l1{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#barra .l2{color:var(--mute);font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
#barra .tr{background:var(--slate);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:11.5px;color:var(--paper);font-weight:600;flex:0 0 auto}
#barra.off .l1{color:var(--mute);font-weight:500}

.grupo{margin-bottom:20px}
.grupo>.esc{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.grupo>.esc .nm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--orange)}
.grupo>.esc .ln{flex:1;height:1px;background:var(--line)}

.item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--navy);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;width:100%;text-align:left}
.item.sel{border-color:var(--orange);background:#f973160f}
.item .cor{flex:1;min-width:0}
.item .t1{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{color:var(--mute);font-size:11.5px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ch{color:var(--mute);font-size:19px;flex:0 0 auto}
.item .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:3px 7px;
  border-radius:7px;background:var(--slate);color:var(--mute);flex:0 0 auto}
.item .tag.ok{background:#34d39922;color:var(--mint)}
.item .tag.par{background:#fbbf2422;color:var(--amber)}

.migalha{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:11.5px;
  margin-bottom:12px;flex-wrap:wrap}
.migalha button{color:var(--orange);font-weight:600;font-size:11.5px}
.hint{color:var(--mute);font-size:12px;margin:9px 0 0;line-height:1.5}
textarea{min-height:132px;resize:vertical;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.02em;line-height:1.6}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--slate);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;
  margin:0 6px 6px 0;font-family:var(--mono)}
.chip b{color:var(--orange);font-weight:600}
/* etiqueta solta (fora de .item) — chips de período, atalhos */
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;padding:6px 10px;border-radius:8px;background:var(--slate);
  color:var(--mute);border:1px solid var(--line)}
.tag.ok{background:#f9731622;color:var(--orange);border-color:#f9731655}

/* assistente de configuração inicial */
.passos{display:flex;gap:5px;margin:2px 0 15px}
.passos i{flex:1;height:3px;border-radius:2px;background:var(--slate)}
.passos i.on{background:var(--orange)}
.esco{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.esco button{padding:14px 11px;border:1px solid var(--line);background:var(--navy);
  border-radius:12px;text-align:left}
.esco button.sel{border-color:var(--orange);background:#f973160f}
.esco .t{font-size:14.5px;font-weight:600}
.esco .s{color:var(--mute);font-size:11px;margin-top:2px;line-height:1.35}
.cont{display:flex;align-items:center;gap:10px;margin-top:4px}
.cont button{width:48px;height:48px;border:1px solid var(--line);background:var(--navy);
  border-radius:12px;font-size:23px;line-height:1;color:var(--orange);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cont input{width:76px;text-align:center;font-family:var(--mono);font-size:19px;flex:0 0 auto}
.lin{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.lin .nu{font-family:var(--mono);font-size:11px;color:var(--mute);flex:0 0 16px}
.lin input{flex:1;min-width:0}
.lin button{flex:0 0 auto;color:var(--mute);font-size:20px;padding:0 7px}
.arq{opacity:.6}
#gabGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.gq{background:var(--navy);border:1px solid var(--line);border-radius:10px;
  padding:6px 4px 7px;text-align:center}
.gq .n{font-family:var(--mono);font-size:9px;color:var(--mute)}
.gq .a{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--orange);line-height:1.2}
</style>
</head>

<div id="barra" class="off">
  <div class="ctx"><div class="l1" id="bCtx1">Nenhuma prova selecionada</div>

</div>

<div id="views">

<!-- ══════════ LER ══════════ -->

    <canvas id="over"></canvas>
    <div id="faixa"><span class="dot" id="dot"></span><div style="flex:1">
      <div class="t" id="ftit">Toque em iniciar câmera</div>
      <div class="s" id="fsub">O QR do cartão traz aluno e gabarito</div></div></div>

    <div id="rodape">
      <div id="lerSel" style="margin-bottom:9px"></div>
      <div class="linha" id="acoes"><button class="btn" id="bIniciar">Iniciar câmera</button></div>
      <div class="linha" id="acoes2" style="margin-top:9px;display:none">

        <button class="btn gho" id="bParar">Parar</button></div>

    </div>

  <div id="painel">
    <div id="nota"><b id="ntv">0</b><span id="ntd"></span></div>

<!-- ══════════ MANUAL ══════════ -->

  <p class="sub" id="resSub"></p>
  <div id="resSel"></div>
  <div id="resLista"></div>
  <div class="linha" style="margin-top:18px" id="resAcoes" hidden>
    <button class="btn sec" id="bCsv">Baixar CSV</button>
    <button class="btn gho" id="bZerar">Apagar notas</button></div>
</section>

<!-- ══════════ DESEMPENHO ══════════ -->
<section id="v-des" class="view">
  <h2 id="desTit">Análise</h2>
  <p class="sub" id="desSub"></p>
  <div id="desAbas" class="esco" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
    <button data-aba="prova" class="sel"><div class="t">Avaliações</div></button>
    <button data-aba="turma"><div class="t">Simulados<br>por turma</div></button>
    <button data-aba="serie"><div class="t">Simulados<br>por série</div></button>
  </div>
  <div id="desSel"></div>
  <div id="desCorpo"></div>
</section>

</div>
<nav>
  <button data-v="casa" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>Turmas</button>
  <button data-v="ler"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>Ler</button>
  <button data-v="man"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Manual</button>
  <button data-v="res"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Notas<span class="pill" id="pill" hidden>0</span></button>
  <button data-v="des"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análise</button>
</nav></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   1. LAYOUT ATIVO — agora é variável: cada prova traz o seu.
      Preenchido por aplicarLayout(); o núcleo de visão abaixo só lê.
   ═══════════════════════════════════════════════════════════════════ */
let LAY = layoutNormalizado(10, 5);      // padrão até haver prova ativa
let NQ = 10, NO = 5;
let IDX = [0,1,2,3,4];

function aplicarLayout(nq, no){
  if(LAY && LAY.n_questions === nq && LAY.n_options === no) return false;
  LAY = layoutNormalizado(nq, no);
  NQ = nq; NO = no;
  IDX = Array.from({length:no}, (_,i)=>i);
  const g = document.getElementById("grade");
  if(g){ g.dataset.pronto = ""; g.innerHTML = "";
    g.style.gridTemplateColumns = "auto repeat(" + no + ",14px)"; }
  return true;
}

/* ═══════════════════════════════════════════════════════════════════
   2. VISÃO COMPUTACIONAL — idêntica à versão validada em sala.
   ═══════════════════════════════════════════════════════════════════ */
function cinza(img){                       // ImageData -> {g,w,h}
  const {data,width:w,height:h}=img, g=new Uint8ClampedArray(w*h);
  for(let i=0,p=0;i<g.length;i++,p+=4)
    g[i]=(data[p]*77+data[p+1]*151+data[p+2]*28)>>8;
  return {g,w,h};
}
function reduzir(s,alvo){                  // subamostragem por caixa
  if(s.w<=alvo) return s;
  const e=Math.ceil(s.w/alvo), w=(s.w/e)|0, h=(s.h/e)|0, g=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let t=0; const y0=y*e,x0=x*e;
    for(let j=0;j<e;j++){const r=(y0+j)*s.w; for(let i=0;i<e;i++) t+=s.g[r+x0+i];}
    g[y*w+x]=t/(e*e);
  }
  return {g,w,h,esc:e};
}
function planificar(s){                    // corrige gradiente de luz
  const {g,w,h}=s, I=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){let lin=0;
    for(let x=0;x<w;x++){lin+=g[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+lin;}}
  const r=Math.max(2,Math.round(w*0.055)), o=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const som=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0];
      const bg=som/((y1-y0)*(x1-x0))+1;
      o[y*w+x]=Math.min(255,g[y*w+x]/bg*200);
    }}
  return {g:o,w,h};
}
function otsu(g){
  const H=new Float64Array(256); for(let i=0;i<g.length;i++)H[g[i]]++;
  let sm=0; for(let t=0;t<256;t++) sm+=t*H[t];
  let wB=0,sB=0,best=-1,th=128;
  for(let t=0;t<256;t++){ wB+=H[t]; if(!wB)continue;
    const wF=g.length-wB; if(wF<=0)break; sB+=t*H[t];
    const v=wF*wB*Math.pow(sB/wB-(sm-sB)/wF,2); if(v>best){best=v;th=t;} }
  return th;
}
/* blobs escuros que são quadrados sólidos, com testes invariantes à rotação */
function fiduciais(s){
  const F=planificar(s), th=otsu(F.g)*0.92, {w,h}=F, N=w*h;
  const vis=new Uint8Array(N), pil=new Int32Array(N), cands=[];
  for(let p=0;p<N;p++){
    if(vis[p]||F.g[p]>=th) continue;
    let top=0; pil[top++]=p; vis[p]=1;
    let n=0,sx=0,sy=0,sxx=0,sxy=0,syy=0;
    while(top){
      const q=pil[--top], x=q%w, y=(q/w)|0;
      n++; sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; syy+=y*y;
      if(x>0   && !vis[q-1] && F.g[q-1]<th){vis[q-1]=1;pil[top++]=q-1;}
      if(x<w-1 && !vis[q+1] && F.g[q+1]<th){vis[q+1]=1;pil[top++]=q+1;}
      if(y>0   && !vis[q-w] && F.g[q-w]<th){vis[q-w]=1;pil[top++]=q-w;}
      if(y<h-1 && !vis[q+w] && F.g[q+w]<th){vis[q+w]=1;pil[top++]=q+w;}
    }
    if(n<N*5e-4 || n>N*0.05) continue;   // 5e-4: acha o cartão mesmo com muita margem branca em volta
    const mx=sx/n, my=sy/n;
    const u20=sxx/n-mx*mx, u02=syy/n-my*my, u11=sxy/n-mx*my;
    const tr=u20+u02, di=Math.hypot(u20-u02,2*u11);
    const l1=(tr+di)/2, l2=(tr-di)/2;
    if(l2<=1e-6) continue;
    if(!(Math.sqrt(l1/l2)>0.72 && Math.sqrt(l1/l2)<1.38)) continue;   // isotrópico
    const cheio=n/(12*Math.sqrt(l1*l2));                              // sólido ≈ 1
    if(!(cheio>0.84 && cheio<1.22)) continue;
    cands.push({x:mx,y:my,a:n});
  }
  if(cands.length<4) return null;
  const amax=Math.max(...cands.map(c=>c.a));
  let C=cands.filter(c=>c.a>=0.40*amax).sort((x,y)=>y.a-x.a).slice(0,8)
             .map(c=>[c.x,c.y]);
  if(C.length<4) return null;
  if(C.length>4) C=melhorQuatro(C);
  const q=orientar(C,F,th);
  if(!q) return null;
  const k=s.esc||1;
  return q.map(p=>[p[0]*k,p[1]*k]);
}
const areaPoli=P=>{ let A=0;
  for(let i=0;i<P.length;i++){const j=(i+1)%P.length; A+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}
  return Math.abs(A/2); };
function ciclico(P){                      // ordem cíclica em volta do centroide
  const cx=P.reduce((s,p)=>s+p[0],0)/P.length, cy=P.reduce((s,p)=>s+p[1],0)/P.length;
  return P.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
}
function melhorQuatro(P){                 // os 4 que formam o maior quadrilátero
  let best=null,ba=-1;
  for(let a=0;a<P.length-3;a++) for(let b=a+1;b<P.length-2;b++)
    for(let c=b+1;c<P.length-1;c++) for(let d=c+1;d<P.length;d++){
      const q=ciclico([P[a],P[b],P[c],P[d]]), ar=areaPoli(q);
      if(ar>ba){ba=ar;best=q;}
    }
  return best;
}
function convexo(q){
  let sg=0;
  for(let i=0;i<4;i++){
    const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(z===0) continue; const g=Math.sign(z);
    if(sg && g!==sg) return false; sg=g;
  }
  return true;
}
/* fração de pixels escuros na janela do QR, medida na imagem planificada:
   ~0,45 na orientação correta e ~0,05 nas outras sete */
function massaQR(F,th,q){
  const W=600, H=W/LAY.aspect, Hm=homografia(q,W,H); if(!Hm) return 0;
  const {g,w,h}=F; let esc=0,n=0;
  for(let i=0;i<20;i++) for(let j=0;j<20;j++){
    const u=(LAY.qr.x0+(LAY.qr.x1-LAY.qr.x0)*(i+0.5)/20)*W;
    const v=(LAY.qr.y0+(LAY.qr.y1-LAY.qr.y0)*(j+0.5)/20)*H;
    const p=proj(Hm,u,v), xi=Math.round(p[0]), yi=Math.round(p[1]); n++;
    if(xi>=0&&yi>=0&&xi<w&&yi<h&&g[yi*w+xi]<th) esc++;
  }
  return esc/n;
}
/* testa as 8 orientações possíveis: filtra pela proporção, desempata pelo QR.
   Não usa extremos — por isso tolera rotação forte sem inverter o cartão. */
function orientar(P,F,th){
  const ciclo=ciclico(P), dirs=[ciclo,ciclo.slice().reverse()];
  let melhor=null, best=1e9;
  for(const dir of dirs) for(let r=0;r<4;r++){
    const q=[0,1,2,3].map(i=>dir[(i+r)%4]);
    const d=(a,b)=>Math.hypot(q[a][0]-q[b][0],q[a][1]-q[b][1]);
    const lg=(d(0,1)+d(3,2))/2, at=(d(0,3)+d(1,2))/2;
    if(at<1e-6) continue;
    const razao=(lg/at)/LAY.aspect;
    if(!(razao>0.55 && razao<1.80)) continue;
    if(!convexo(q)) continue;
    const fr=massaQR(F,th,q);
    if(fr<0.22) continue;
    const custo=-fr*100+Math.abs(Math.log(razao))*40;
    if(custo<best){ best=custo; melhor=q; }
  }
  if(!melhor) return null;
  return areaPoli(melhor)>F.w*F.h*0.02 ? melhor : null;
}
/* homografia: retângulo (0,0)-(W,H) -> quadrilátero da foto */
function homografia(q,W,H){
  const s=[[0,0],[W,0],[W,H],[0,H]], A=[], b=[];
  for(let i=0;i<4;i++){
    const [u,v]=s[i], [x,y]=q[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); b.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); b.push(y);
  }
  for(let c=0;c<8;c++){                                 // eliminação de Gauss
    let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    if(Math.abs(A[c][c])<1e-12) return null;
    for(let r=0;r<8;r++){ if(r===c) continue;
      const f=A[r][c]/A[c][c];
      for(let k=c;k<8;k++) A[r][k]-=f*A[c][k];
      b[r]-=f*b[c];
    }
  }
  const h=b.map((v,i)=>v/A[i][i]);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}
const proj=(H,u,v)=>{ const d=H[6]*u+H[7]*v+1;
  return [(H[0]*u+H[1]*v+H[2])/d,(H[3]*u+H[4]*v+H[5])/d]; };

let DISCO=null, ANEL=null, RB=0;
function amostras(rb){
  if(RB===rb) return; RB=rb;
  const ri=rb*0.60; DISCO=[];
  for(let dy=-ri;dy<=ri;dy+=1.3) for(let dx=-ri;dx<=ri;dx+=1.3)
    if(dx*dx+dy*dy<=ri*ri) DISCO.push([dx,dy]);
  ANEL=[];
  for(let i=0;i<32;i++){ const a=i/32*6.2832;
    ANEL.push([Math.cos(a)*rb*1.30,Math.sin(a)*rb*1.30]);
    ANEL.push([Math.cos(a)*rb*1.62,Math.sin(a)*rb*1.62]); }
}
function lerBolhas(src,quad){
  const W=1000, H=W/LAY.aspect, Hm=homografia(quad,W,H);
  if(!Hm) return null;
  amostras(LAY.bubble_r*W);
  const {g,w,h}=src;
  const px=(x,y)=>{ const xi=Math.round(x),yi=Math.round(y);
    return (xi<0||yi<0||xi>=w||yi>=h)?255:g[yi*w+xi]; };
  const R=[], mark=[];
  for(let q=1;q<=NQ;q++){
    const fi=LAY.bubbles[q].map(([nx,ny])=>{
      const u=nx*W, v=ny*H, an=[];
      for(const [dx,dy] of ANEL){const p=proj(Hm,u+dx,v+dy); an.push(px(p[0],p[1]));}
      an.sort((a,b)=>a-b);
      const branco=an[an.length>>1], lim=Math.max(40,branco*0.66);
      let d=0; for(const [dx,dy] of DISCO){const p=proj(Hm,u+dx,v+dy); if(px(p[0],p[1])<lim)d++;}
      return d/DISCO.length;
    });
    const or=IDX.slice().sort((a,b)=>fi[b]-fi[a]);
    const b1=fi[or[0]], b2=fi[or[1]];
    if(b1<0.38){ R.push(null); mark.push("BRANCO"); }
    else if(b2>0.55*b1 && b2>0.34){ R.push(null); mark.push("DUPLA"); }
    else { R.push(LAY.options[or[0]]); mark.push("OK"); }
  }
  return {R,mark};
}
function lerQR(src,quad){
  if(typeof jsQR!=="function") return null;
  const W=1500, H=W/LAY.aspect, Hm=homografia(quad,W,H); if(!Hm) return null;
  const pad=0.02, L=560;
  const u0=(LAY.qr.x0-pad)*W, v0=(LAY.qr.y0-pad)*H;
  const u1=(LAY.qr.x1+pad)*W, v1=(LAY.qr.y1+pad)*H;
  const {g,w,h}=src, gr=new Uint8ClampedArray(L*L);
  /* amostragem bilinear: com o cartão girado ou pequeno na foto, o vizinho
     mais próximo serrilha as bordas dos módulos e o QR deixa de decodificar */
  const bilinear=(x,y)=>{
    if(x<0||y<0||x>w-1||y>h-1) return 255;
    const x0=x|0, y0=y|0, x1=x0+1<w?x0+1:x0, y1=y0+1<h?y0+1:y0;
    const fx=x-x0, fy=y-y0;
    const a=g[y0*w+x0], b=g[y0*w+x1], c=g[y1*w+x0], d=g[y1*w+x1];
    return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
  };
  for(let j=0;j<L;j++){
    const v=v0+(v1-v0)*j/(L-1);
    for(let i=0;i<L;i++){
      const p=proj(Hm,u0+(u1-u0)*i/(L-1),v);
      gr[j*L+i]=bilinear(p[0],p[1]);
    }}
  let mn=255,mx=0;                                   // realce de contraste
  for(const t of gr){ if(t<mn)mn=t; if(t>mx)mx=t; }
  const dv=Math.max(1,mx-mn);
  const out=new Uint8ClampedArray(L*L*4);
  for(let i=0;i<L*L;i++){
    const t=Math.max(0,Math.min(255,(gr[i]-mn)*255/dv)), o=i*4;
    out[o]=out[o+1]=out[o+2]=t; out[o+3]=255;
  }
  try{ const r=jsQR(out,L,L,{inversionAttempts:"dontInvert"}); return r?r.data:null; }
  catch(e){ return null; }
}

   3. ESTADO — escolas › turmas › provas › resultados

const guarda=(()=>{ let mem={},ok=false;
  try{localStorage.setItem("_t","1");localStorage.removeItem("_t");ok=true;}catch(e){}
  return {ler:k=>{try{return ok?localStorage.getItem(k):mem[k];}catch(e){return mem[k];}},
          esc:(k,v)=>{try{ok?localStorage.setItem(k,v):(mem[k]=v);}catch(e){mem[k]=v;}}};})();

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const primeiroNome=n=>String(n).split(" ").slice(0,2).join(" ");
const uid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ordNum=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});

/* ── estado inicial: vazio ──────────────────────────────────────────
   Quem instala pelo aparelho novo passa pelo assistente (nome do
   professor → escolas → turmas → disciplinas → bimestral/trimestral).
   Nada de turma embutida no código: o app serve a qualquer professor. */
function semear(){
  return {v:8, escolas:[], turmas:[], provas:[], simulados:[],
          descritores:{LP:{},MAT:{}}, ativa:null, res:[]};
}

/* ── modelo v6 ──────────────────────────────────────────────────────
   A disciplina deixou de ser um campo de texto da turma e virou lista:
   uma mesma turma pode ter várias, e cada prova aponta para uma delas.
   Escola, turma e disciplina ganham `ativa` — nada é apagado quando o
   professor deixa de lecionar; fica encerrado e o histórico continua. */
const QTD_PADRAO={bimestre:4, trimestre:3};

function migrarV6(d){
  if(!d) return d;
  (d.escolas||[]).forEach(e=>{ if(e.ativa===undefined) e.ativa=true; });
  (d.turmas||[]).forEach(t=>{
    if(t.ativa===undefined) t.ativa=true;
    if(!Array.isArray(t.disciplinas)||!t.disciplinas.length)
      t.disciplinas=[{id:uid("d"),nome:t.disciplina||"Matemática",ativa:true}];
    t.disciplinas.forEach(x=>{ if(x.ativa===undefined) x.ativa=true; });
    if(!t.periodo) t.periodo={tipo:"bimestre",qtd:4};
    if(t.periodo.tipo!=="bimestre" && t.periodo.tipo!=="trimestre")
      t.periodo={tipo:"bimestre",qtd:4};     // semestral não existe mais
    if(!t.periodo.qtd) t.periodo.qtd=QTD_PADRAO[t.periodo.tipo];
  });
  (d.provas||[]).forEach(p=>{
    if(p.disciplina) return;
    const t=(d.turmas||[]).find(x=>x.id===p.turma);
    p.disciplina=(t&&t.disciplinas[0])?t.disciplinas[0].id:null;
  });
  if(!Array.isArray(d.simulados)) d.simulados=[];      // v7: simulados SAEPE
  if(!d.descritores) d.descritores={LP:{},MAT:{}};

  /* v8: o simulado passou de dois cadernos para um caderno só, com cada
     item marcado como LP ou MAT. Cada caderno antigo vira um simulado. */
  const novos=[];
  d.simulados.forEach(sm=>{
    if(!sm.cadernos) return;
    const pares=Object.entries(sm.cadernos)
      .map(([comp,pid])=>[comp,(d.provas||[]).find(p=>p.id===pid)])
      .filter(([,p])=>p);
    pares.forEach(([comp,pr],k)=>{
      pr.comps=new Array(pr.nq).fill(comp);
      pr.desc=pr.desc||new Array(pr.nq).fill("");
      const alvo=k===0?sm:{id:sm.id+"-"+comp,turma:sm.turma,etapa:sm.etapa,
        ano:sm.ano,criado:sm.criado,metodo:"tri"};
      alvo.titulo=(sm.titulo||"Simulado")+(pares.length>1?" · "+comp:"");
      alvo.prova=pr.id; alvo.metodo=alvo.metodo||"tri";
      pr.titulo=alvo.titulo; pr.simulado=alvo.id;
      delete alvo.cadernos; delete pr.comp;
      if(k>0) novos.push(alvo);
    });
    if(!pares.length) sm.morto=true;
  });
  d.simulados=d.simulados.filter(sm=>!sm.morto && sm.prova).concat(novos);
  d.v=8;
  return d;
}

/* ── carga, com resgate do que existia na versão anterior ───────── */
let E=(()=>{
  const novo=guarda.ler("dbm_omr_v8")||guarda.ler("dbm_omr_v7")||guarda.ler("dbm_omr_v6")||
             guarda.ler("dbm_omr_v5")||guarda.ler("dbm_omr_v4");
  if(novo){ try{ const d=JSON.parse(novo);
    if(d&&d.v>=4&&d.v<=8){
      if(d.v===4){                       // acrescenta o calendário às turmas
        d.turmas.forEach(t=>{ if(!t.periodo) t.periodo={tipo:"bimestre",qtd:4}; });
        (d.provas||[]).forEach(pr=>{ if(!pr.periodo) pr.periodo=1; });
        d.v=5;
      }
      return migrarV6(d);                // v5 → v6: disciplinas em lista
    } }catch(e){} }
  const base=semear();
  try{
    const velho=JSON.parse(guarda.ler("dbm_omr_v3")||"null");
    if(velho&&velho.gabC&&velho.gabC.length>=5){
      // reconstrói a prova antiga e devolve os alunos às turmas
      if(!base.escolas.length)
        base.escolas.push({id:"esc-1",nome:"Minha escola",curto:"Minha escola",ativa:true});
      const idEscola=base.escolas[0].id;
      Object.entries(velho.turmas||{}).forEach(([nm,mapa])=>{
        let t=base.turmas.find(x=>x.nome===nm);
        if(!t){ t={id:"t-"+nm,escola:idEscola,nome:nm,serie:"—",disciplina:"Matemática",
          alunos:[],periodo:{tipo:"bimestre",qtd:4}};
          base.turmas.push(t); }
        Object.entries(mapa).forEach(([num,nome])=>{
          if(!t.alunos.some(a=>a.numero===num)) t.alunos.push({numero:num,nome,desde:1,ate:null}); });
        t.alunos.sort((a,b)=>ordNum(a.numero,b.numero));
      });
      const alvo=base.turmas.filter(t=>(velho.turmas||{})[t.nome]);
      alvo.forEach(t=>{
        const p={id:uid("p"),turma:t.id,codigo:velho.id||"PROVA",
          titulo:"Prova importada da versão anterior",
          nq:velho.gabC.length,no:5,gabC:velho.gabC,
          habs:(velho.habs||[]).slice(),criada:Date.now()};
        base.provas.push(p);
        (velho.alunos||[]).filter(a=>a.turma===t.nome).forEach(a=>{
          base.res.push(Object.assign({},a,{prova:p.id,turma:t.id})); });
      });
      if(base.provas.length) base.ativa=base.provas[0].id;
    }
  }catch(e){ console.warn("nada a migrar",e); }
  return migrarV6(base);
})();

/* ── acessos ────────────────────────────────────────────────────── */
const provaDe=id=>E.provas.find(p=>p.id===id)||null;
const turmaDe=id=>E.turmas.find(t=>t.id===id)||null;
const escolaDe=id=>E.escolas.find(x=>x.id===id)||null;
const provaAtiva=()=>provaDe(E.ativa);
const turmaAtiva=()=>{const p=provaAtiva();return p?turmaDe(p.turma):null;};
const provasDaTurma=id=>E.provas.filter(p=>p.turma===id).sort((a,b)=>b.criada-a.criada);
const resDa=pid=>E.res.filter(r=>r.prova===pid);
const chave=r=>r.prova+"|"+r.turma+"#"+r.numero;

/* ── escola › turma › disciplina ────────────────────────────────────
   `ativa:false` é encerramento, não exclusão: o cadastro some das
   listas de trabalho mas continua existindo para as notas antigas. */
const viva=x=>!x||x.ativa!==false;
const turmasDa=id=>E.turmas.filter(t=>t.escola===id);
const disciplinasDe=t=>(t&&t.disciplinas)||[];
const discDe=(t,id)=>disciplinasDe(t).find(d=>d.id===id)||null;
const nomeDisc=(t,id)=>{const d=discDe(t,id);
  return d?d.nome:((t&&t.disciplina)||"Sem disciplina");};
/* Cadernos de simulado moram em E.provas (para reusar geração, leitura e
   correção), mas nunca aparecem nas listas de prova nem entram na média
   do período — eles vivem na área de Simulados SAEPE. */
const ehCaderno=p=>!!(p&&p.simulado);
const provasDe=(tid,did)=>provasDaTurma(tid)
  .filter(p=>!ehCaderno(p) && (!did||p.disciplina===did));
const temHistorico=(tid,did)=>provasDe(tid,did).length>0;
/* o que aparece nas listas: o que está ativo, mais o que tem histórico */
const discVisiveis=t=>disciplinasDe(t).filter(d=>viva(d)||temHistorico(t.id,d.id));
const turmasVisiveis=id=>turmasDa(id).filter(t=>viva(t)||provasDaTurma(t.id).length);
const escolasVisiveis=()=>E.escolas.filter(e=>viva(e)||turmasDa(e.id).length);
const primeiraDisc=t=>{const d=disciplinasDe(t).filter(viva)[0]||disciplinasDe(t)[0];
  return d?d.id:null;};

/* ═══════════════════════════════════════════════════════════════════
   SIMULADO SAEPE
   Um caderno único, com os itens de Língua Portuguesa e os de
   Matemática marcados um a um. O caderno é uma prova comum marcada com
   `simulado` — geração, cartão, leitura e correção seguem sendo os que
   já existiam. O que muda é a apuração: resultado, padrão de desempenho
   e acerto por descritor saem SEPARADOS por componente.
   ═══════════════════════════════════════════════════════════════════ */
const SAEPE_NO=5, SAEPE_MIN=5, SAEPE_MAX=30;
const COMPONENTES=[{id:"LP", nome:"Língua Portuguesa", curto:"L. Port."},
                   {id:"MAT",nome:"Matemática",        curto:"Mat."}];
const nomeComp=c=>(COMPONENTES.find(x=>x.id===c)||{nome:c}).nome;
const curtoComp=c=>(COMPONENTES.find(x=>x.id===c)||{curto:c}).curto;

/* Etapas e pontos de corte dos padrões de desempenho do SAEPE, na escala
   do Saeb (0 a 500). Fonte: Revista do Professor SAEPE 2018.
   `faixa` é o intervalo em que a proficiência estimada é projetada. */
const ETAPAS=[
  {id:"5EF", nome:"5º ano do ensino fundamental", faixa:[100,300],
   cortes:{LP:[125,175,210], MAT:[150,185,220]}},
  {id:"9EF", nome:"9º ano do ensino fundamental", faixa:[150,350],
   cortes:{LP:[200,235,270], MAT:[225,245,280]}},
  {id:"3EM", nome:"3º ano do ensino médio", faixa:[175,400],
   cortes:{LP:[225,270,305], MAT:[250,290,325]}}
];
const PADROES=[
  {nome:"Elementar I",  cor:"var(--coral)", acao:"recuperação"},
  {nome:"Elementar II", cor:"var(--amber)", acao:"reforço"},
  {nome:"Básico",       cor:"var(--sky)",   acao:"aprofundamento"},
  {nome:"Desejável",    cor:"var(--mint)",  acao:"novos desafios"}
];
const etapaDe=id=>ETAPAS.find(e=>e.id===id)||ETAPAS[2];

const simuladosDa=tid=>(E.simulados||[]).filter(s=>s.turma===tid)
  .sort((a,b)=>b.criado-a.criado);
const simuladoDe=id=>(E.simulados||[]).find(s=>s.id===id)||null;
const provaDoSim=sm=>sm?provaDe(sm.prova):null;

/* índices dos itens de um componente, na ordem canônica do caderno */
function itensDe(p,comp){
  const out=[]; (p&&p.comps||[]).forEach((c,i)=>{ if(c===comp) out.push(i); });
  return out;
}
const temComp=(p,comp)=>itensDe(p,comp).length>0;
/* acertos de um estudante DENTRO de um componente */
function acertosComp(p,reg,comp){
  const g=String(p.gabC||"").toUpperCase();
  return itensDe(p,comp).filter(i=>reg.Rc && reg.Rc[i]===g[i]).length;
}

function rotuloProva(p){
  if(!p) return "";
  if(ehCaderno(p)) return "Simulado SAEPE";
  const t=turmaDe(p.turma);
  return t?nomeDisc(t,p.disciplina):"";
}
/* No simulado não há período: entram todos os estudantes ativos. */
const alunosDaProva=(t,p)=>ehCaderno(p)?(t.alunos||[]).filter(ativo)
                                       :alunosEm(t,p.periodo||1);

/* ── escala ────────────────────────────────────────────────────────
   O percentual de acerto é sempre PROPORCIONAL ao número de itens
   daquele componente: 9 de 13 e 18 de 26 dão o mesmo resultado. */
const acertoCorrigido=(acertos,total,no)=>{
  if(!total) return null;
  const chute=1/(no||5);
  return Math.max(0,((acertos/total)-chute)/(1-chute));
};
function faixaDe(sm){
  const et=etapaDe(sm?sm.etapa:"3EM");
  return (sm&&sm.faixa)||et.faixa;
}
function padraoDe(prof,etapaId,comp){
  if(prof==null) return null;
  const c=etapaDe(etapaId).cortes[comp]||etapaDe(etapaId).cortes.MAT;
  const i=prof<=c[0]?0:prof<=c[1]?1:prof<=c[2]?2:3;
  return Object.assign({indice:i},PADROES[i]);
}
/* percentual → escala, linear dentro da faixa da etapa */
function profPorPercentual(sm,acertos,total,no){
  const corr=acertoCorrigido(acertos,total,no);
  if(corr==null) return null;
  const [piso,teto]=faixaDe(sm);
  return piso+(teto-piso)*corr;
}

/* ── TRI: modelo logístico de 3 parâmetros ─────────────────────────
   É o modelo do Saeb/SAEPE. Cada item tem três parâmetros:

     a  discriminação — o quanto o item separa quem sabe de quem não sabe
     b  dificuldade   — o ponto da escala em que o item começa a ser acertado
     c  acerto casual — a chance de acertar no chute (fixado em 1/5)

     P(acertar | θ) = c + (1 − c) / (1 + e^(−1,7·a·(θ − b)))

   Consequências, que é o que o professor sente na prática:
   • Item que poucos acertaram tem b alto: acertá-lo puxa a proficiência
     para cima muito mais do que acertar um item fácil.
   • Acertar o difícil e errar o fácil é um padrão improvável para quem
     domina o conteúdo — a verossimilhança atribui o acerto ao chute e a
     proficiência sai ABAIXO do que o número cru de acertos sugeriria.
   • Item que não discrimina (a baixo) quase não mexe na nota de ninguém.

   Calibrar a, b e c de verdade exige milhares de respondentes. Com uma
   turma, o caminho honesto é a conversão clássica (Lord): a dificuldade
   sai da proporção de acerto e a discriminação, da correlação do item com
   o desempenho no resto da prova. */

/* Φ⁻¹ — inversa da normal padrão (aproximação de Acklam) */
function probit(pr){
  if(pr<=0) return -6; if(pr>=1) return 6;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,
           1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,
           6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,
           -2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,
           3.754408661907416e+00];
  const pb=0.02425;
  let q,r;
  if(pr<pb){ q=Math.sqrt(-2*Math.log(pr));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(pr>1-pb){ q=Math.sqrt(-2*Math.log(1-pr));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=pr-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
const D_TRI=1.7;
const p3pl=(th,it)=>it.c+(1-it.c)/(1+Math.exp(-D_TRI*it.a*(th-it.b)));

/* correlação de Pearson */
function correl(x,y){
  const n=x.length; if(!n) return 0;
  const mx=x.reduce((a,b)=>a+b,0)/n, my=y.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){ const dx=x[i]-mx, dy=y[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  return (sxx<1e-12||syy<1e-12)?0:sxy/Math.sqrt(sxx*syy);
}

/* parâmetros dos itens a partir das respostas da turma */
/* `null` na matriz = item que aquele estudante não respondeu. Acontece
   ao juntar turmas cujos cadernos sortearam itens diferentes: cada item
   é calibrado só com quem o respondeu, e cada θ sai só dos itens que a
   pessoa fez. Sem nenhum `null`, o resultado é idêntico ao de antes. */
function calibrar(matriz,no){
  const S=matriz.length, I=S?matriz[0].length:0;
  if(!S||!I) return null;
  const c=1/(no||5);
  const escore=matriz.map(l=>l.reduce((a,b)=>a+(b==null?0:b),0));
  const feitos=matriz.map(l=>l.reduce((a,b)=>a+(b==null?0:1),0));
  const itens=[];
  for(let i=0;i<I;i++){
    let acertos=0, quantos=0;
    for(let s=0;s<S;s++){ if(matriz[s][i]==null) continue; acertos+=matriz[s][i]; quantos++; }
    if(!quantos){ itens.push({a:1,b:0,c,pr:0.5,r:0.3,acertos:0,respondentes:0}); continue; }
    /* proporção de acerto, sem deixar chegar a 0 ou 1 */
    const pr=Math.min(1-0.5/quantos,Math.max(0.5/quantos,acertos/quantos));
    /* correlação do item com o desempenho no RESTO da prova, entre quem
       respondeu — comparando proporções, já que o total varia */
    const x=[], y=[];
    for(let s=0;s<S;s++){
      if(matriz[s][i]==null) continue;
      x.push(matriz[s][i]);
      const outros=Math.max(1,feitos[s]-1);
      y.push((escore[s]-matriz[s][i])/outros);
    }
    let r=correl(x,y);
    if(!isFinite(r)) r=0.3;
    r=Math.max(0.10,Math.min(0.85,r));
    /* tira o chute antes de transformar em dificuldade */
    const pEfetivo=Math.min(0.99,Math.max(0.01,(pr-c)/(1-c)));
    const z=probit(1-pEfetivo);                  // z alto = item difícil
    const a=Math.max(0.4,Math.min(2.5,r/Math.sqrt(1-r*r)));
    const b=Math.max(-3,Math.min(3,z/r));
    itens.push({a,b,c,pr,r,acertos,respondentes:quantos});
  }
  return itens;
}

/* θ de cada estudante: máximo a posteriori, com prior N(0,1).
   A busca é em grade — não trava, não diverge com acerto total ou zero. */
function estimarTheta(respostas,itens){
  let melhor=-4, top=-Infinity;
  for(let th=-4; th<=4.0001; th+=0.02){
    let L=-0.5*th*th;                            // log do prior
    for(let i=0;i<itens.length;i++){
      if(respostas[i]==null) continue;           // item que não respondeu
      const P=Math.min(0.9999,Math.max(0.0001,p3pl(th,itens[i])));
      L+=respostas[i]?Math.log(P):Math.log(1-P);
    }
    if(L>top){ top=L; melhor=th; }
  }
  return melhor;
}

/* ── da TRI para a escala ──────────────────────────────────────────
   O Saeb usa 50 pontos por desvio-padrão de θ, e é essa unidade que
   adotamos. O que NÃO dá para fazer sem itens âncora da rede é fixar
   onde o zero da escala cai: se padronizássemos θ na própria turma,
   toda turma sairia com a mesma média e uma turma fraca pareceria
   mediana. Por isso o NÍVEL da turma vem do acerto absoluto (o método
   percentual) e a TRI distribui os estudantes em torno dele. */
const PONTOS_POR_DP=50;
function escalaTRI(sm,theta,thetaMedio,centro){
  return Math.max(0,Math.min(500,centro+PONTOS_POR_DP*(theta-thetaMedio)));
}

const TRI_MIN_ALUNOS=8, TRI_MIN_ITENS=5;
/* itens em comum que dois cadernos precisam ter para que a calibração
   conjunta possa comparar os estudantes deles na mesma escala */
const ANCORA_MIN=5;

const MIN_Q_CARTAO=5;

/* D01, d1, D 1 → D1. Assim o que veio do arquivo e o que foi digitado
   à mão são o mesmo descritor. */
function codDesc(x){
  const m=/^\s*D?\s*0*(\d{1,3})\s*$/i.exec(String(x||"").replace(/[^\dDd]/g,""));
  return m?("D"+m[1]):String(x||"").trim().toUpperCase();
}

/* ── leitura do arquivo do simulado ────────────────────────────────
   O documento traz, nesta ordem: as questões, um bloco GABARITO e um
   bloco DESCRITORES no formato

     D01 — texto da habilidade — Questões: 1, 5

   As questões em si são lidas pelo MESMO parser das provas comuns. */
function lerSimuladoDoc(txt){
  const linhas=String(txt).split(/\r?\n/);
  const limpo=l=>String(l).replace(/[*_#]/g,"").trim();
  const acha=re=>linhas.findIndex(l=>re.test(limpo(l)));
  const iGab=acha(/^gabaritos?\s*:?$/i);
  const iDes=acha(/^descritor(es)?\s*:?$/i);
  const cortes=[iGab,iDes].filter(x=>x>=0).sort((a,b)=>a-b);
  const corpo=linhas.slice(0, cortes.length?cortes[0]:linhas.length).join("\n");
  const blocoGab=iGab<0?[]:linhas.slice(iGab+1, (iDes>iGab)?iDes:linhas.length);
  const blocoDes=iDes<0?[]:linhas.slice(iDes+1, (iGab>iDes)?iGab:linhas.length);

  const chave={};
  blocoGab.forEach(l=>{
    const m=/^(\d{1,2})\s*[).:\-–—]?\s*([A-Ea-e])(?![A-Za-zÀ-ÿ0-9])/.exec(limpo(l));
    if(m) chave[+m[1]]=m[2].toUpperCase();
  });

  /* Um descritor pode ocupar VÁRIAS linhas: o código e o texto numa, a
     lista de questões na seguinte, e o texto ainda pode quebrar no meio.
     Por isso o bloco é acumulado até aparecer o próximo código. */
  const descritores=[], mapa={};
  const numerosDe=txt=>{
    const m=/quest(?:ões|oes|ão|ao)s?\s*[:\-–—]?\s*([\d\s,;.eE]+)/i.exec(txt);
    if(!m) return {qs:[], corte:-1};
    return {qs:(m[1].match(/\d{1,2}/g)||[]).map(Number), corte:m.index};
  };
  const fechar=bloco=>{
    if(!bloco) return;
    const junto=bloco.linhas.join(" ").replace(/\s+/g," ").trim();
    const {qs,corte}=numerosDe(junto);
    let texto=(corte>=0?junto.slice(0,corte):junto)
      .replace(/^\s*[—–\-:.]\s*/,"").replace(/\s*[—–\-]\s*$/,"").trim();
    descritores.push({cod:bloco.cod, texto, questoes:qs});
    qs.forEach(n=>{ if(!mapa[n]) mapa[n]=bloco.cod; });
  };
  let bloco=null;
  blocoDes.forEach(l=>{
    const t=limpo(l); if(!t) return;
    const m=/^(D\s*\d{1,3})\b\s*(.*)$/i.exec(t);
    if(m){ fechar(bloco); bloco={cod:codDesc(m[1]), linhas:[m[2]]}; }
    else if(bloco) bloco.linhas.push(t);
  });
  fechar(bloco);

  const lidas=lerQuestoes(corpo);
  const itens=(lidas.questoes||[]).map((q,i)=>{
    const letra=chave[i+1]||"";
    const k="ABCDE".indexOf(letra);
    if(k>=0) q.correta=k;
    return {questao:q, gab:letra, desc:mapa[i+1]||""};
  });
  return {itens, descritores, chave,
          semGab:itens.filter(x=>!x.gab).length,
          semDesc:itens.filter(x=>!x.desc).length,
          curtas:itens.filter(x=>(x.questao.alternativas||[]).filter(Boolean).length<5).length};
}

/* ── o caderno, item a item ────────────────────────────────────────
   `questoes` fica SEMPRE do tamanho de `nq`, com um item em branco onde
   ainda não há questão, e `gabItens` guarda letra por letra (vazio =
   ainda não definida). Foi por não manter esse alinhamento que importar
   o segundo componente apagava as questões do primeiro. */
const itemVazio=()=>({enunciado:"",alternativas:["","","","",""],correta:null});
const temQuestao=q=>!!(q&&String(q.enunciado||"").trim());

/* ── identidade do item ────────────────────────────────────────────
   Até aqui, o único jeito de reconhecer "a mesma questão" em cadernos
   diferentes era comparar o TEXTO do enunciado. Um espaço a mais, um
   acento corrigido, e a mesma questão virava duas colunas na matriz da
   TRI — que é justamente onde os itens âncora precisam se encontrar.
   Agora cada item carrega um `qid` estável. Nos cadernos antigos ele é
   derivado do próprio enunciado, para que a identificação que existia
   continue valendo, só que imune a espaço e acento. */
function qidDoTexto(txt){
  const base=String(txt||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(!base) return "";
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<base.length;i++){
    h1=(h1^base.charCodeAt(i))>>>0; h1=(h1*16777619)>>>0;
    h2=(h2+base.charCodeAt(i)*(i+7))>>>0;
  }
  return "t"+h1.toString(36)+h2.toString(36);
}
function qidDoItem(pr,i){
  const q=(pr.qids||[])[i];
  if(q) return q;
  const t=((pr.questoes||[])[i]||{}).enunciado;
  return qidDoTexto(t) || ("p"+pr.id+"#"+i);
}

function itensDoCaderno(pr){
  const gabs=pr.gabItens||String(pr.gabC||"").split("");
  return Array.from({length:pr.nq},(_,i)=>({
    comp:(pr.comps||[])[i]||"LP",
    questao:(pr.questoes||[])[i]||null,
    gab:gabs[i]||"",
    desc:(pr.desc||[])[i]||"",
    qid:qidDoItem(pr,i),
    orig:(pr.orig||[])[i]||null      // número que a questão tinha no arquivo
  }));
}
function gravarCaderno(pr,lista){
  pr.nq=lista.length;
  pr.no=SAEPE_NO;
  pr.comps=lista.map(x=>x.comp);
  pr.desc=lista.map(x=>x.desc?codDesc(x.desc):"");
  pr.orig=lista.map(x=>x.orig||null);
  pr.gabItens=lista.map(x=>(x.gab||"").toUpperCase());
  pr.gabC=pr.gabItens.map(x=>x||"A").join("");   // o QR precisa de nq letras
  pr.habs=pr.desc.map((cod,i)=>cod?curtoComp(pr.comps[i])+" "+rotuloDesc(pr.comps[i],cod):"");
  pr.questoes=lista.map(x=>x.questao||itemVazio());
  pr.qids=lista.map((x,i)=>x.qid || qidDoTexto((x.questao||{}).enunciado) ||
    ("p"+pr.id+"#"+i));
  propagarNaSerie(pr);
  return pr;
}

/* ── o mesmo caderno para a série inteira ──────────────────────────
   Cada turma continua tendo o SEU registro de simulado (é o que as
   telas, as notas e a participação usam), mas os cadernos das turmas de
   uma mesma matriz carregam exatamente os mesmos itens, na mesma ordem
   canônica e com os mesmos `qid`. O embaralhamento continua por
   estudante — semente turma + número —, então nada muda quanto à cola.
   Sem isso não existe proficiência de série: sem itens em comum, a
   calibração conjunta não distingue turma melhor de caderno mais fácil
   (ver `ANCORA_MIN` e o teste 31). */
const simuladoDaProva=pr=>pr&&pr.simulado?simuladoDe(pr.simulado):null;
function irmaosDaMatriz(sm){
  if(!sm||!sm.matriz) return [];
  return (E.simulados||[]).filter(x=>x.matriz===sm.matriz && x.id!==sm.id);
}
let propagando=false;
function propagarNaSerie(pr){
  if(propagando) return;
  const sm=simuladoDaProva(pr);
  if(!sm||!sm.matriz) return;
  propagando=true;
  try{
    irmaosDaMatriz(sm).forEach(outro=>{
      const alvo=provaDoSim(outro);
      if(!alvo||alvo.id===pr.id) return;
      alvo.nq=pr.nq; alvo.no=pr.no;
      alvo.comps=(pr.comps||[]).slice();
      alvo.desc=(pr.desc||[]).slice();
      alvo.orig=(pr.orig||[]).slice();
      alvo.gabItens=(pr.gabItens||[]).slice();
      alvo.gabC=pr.gabC;
      alvo.habs=(pr.habs||[]).slice();
      alvo.qids=(pr.qids||[]).slice();
      alvo.questoes=JSON.parse(JSON.stringify(pr.questoes||[]));
      outro.qtd=Object.assign({}, sm.qtd);
      outro.alternarBlocos=sm.alternarBlocos;
      outro.tipos=sm.tipos;
    });
  }finally{ propagando=false; }
}
/* o que ainda falta, por componente — é o que a tela precisa dizer */
function faltasDoCaderno(pr){
  const f={gab:0, questoes:{}};
  COMPONENTES.forEach(c=>f.questoes[c.id]=0);
  itensDoCaderno(pr).forEach(x=>{
    if(!x.gab) f.gab++;
    if(!temQuestao(x.questao)) f.questoes[x.comp]=(f.questoes[x.comp]||0)+1;
  });
  f.totalQuestoes=COMPONENTES.reduce((n,c)=>n+f.questoes[c.id],0);
  f.completo=!f.gab && !f.totalQuestoes && pr.nq>=MIN_Q_CARTAO;
  return f;
}

/* ── caber em quatro páginas ───────────────────────────────────────
   Ordem: primeiro a maior letra que couber (o gerador desce 10,5 → 9);
   só depois, se nem com 9 pt couber, tira questões — sempre a mesma
   quantidade de cada componente, para não desequilibrar o simulado.
   Como o item carrega enunciado, gabarito, descritor e o número
   original juntos, cortar o fim de um bloco não desfaz relação nenhuma. */
const MAX_PAG_SIMULADO=4;

function medirCaderno(sm,pr,t,lista){
  if(typeof gerarProvas!=="function" || !window.jspdf) return null;
  const falso=Object.assign({},pr,{
    nq:lista.length, comps:lista.map(x=>x.comp),
    gabC:lista.map(x=>x.gab||"A").join(""),
    questoes:lista.map(x=>x.questao||itemVazio())});
  /* mede com a TURMA INTEIRA: cada estudante recebe as questões em outra
     ordem, e o encaixe nas colunas muda com ela — medir por um aluno só
     fazia o colega do lado receber uma página a mais */
  const turma=(t.alunos||[]).filter(ativo);
  const alunos=turma.length?turma:[{numero:"01",nome:"ESTUDANTE"}];
  try{
    const doc=gerarProvas(cfgDoCaderno(sm,falso,t),alunos,window.jspdf.jsPDF);
    /* sem medida confiável, devolve nada: melhor gerar sem ajustar do que
       travar a geração por causa de uma conta que não deu certo */
    if(!doc || !doc.paginasPorAluno) return null;
    return {paginas:doc.paginasPorAluno, corpo:doc.corpoUsado};
  }catch(e){ return null; }
}

/* Maior quantidade por componente que cabe no teto de páginas. */
function melhorAjuste(sm){
  const pr=provaDoSim(sm), t=turmaDe(sm.turma);
  if(!pr||!t||!pr.nq) return null;
  const base=itensDoCaderno(pr);
  const porComp={};
  COMPONENTES.forEach(c=>porComp[c.id]=base.filter(x=>x.comp===c.id));
  const maior=Math.max(...COMPONENTES.map(c=>porComp[c.id].length));
  const monta=corte=>{
    const partes=COMPONENTES.map(c=>porComp[c.id].slice(0,Math.max(0,porComp[c.id].length-corte)));
    return [].concat.apply([],partes);
  };
  let ultimo=null;
  for(let corte=0; corte<maior; corte++){
    const lista=monta(corte);
    if(lista.length<MIN_Q_CARTAO) break;
    const m=medirCaderno(sm,pr,t,lista);
    if(!m) return null;                 // não deu para medir: gera como está
    ultimo={corte, lista, paginas:m.paginas, corpo:m.corpo,
      qtd:COMPONENTES.reduce((o,c)=>{o[c.id]=Math.max(0,porComp[c.id].length-corte);return o;},{})};
    if(m.paginas<=MAX_PAG_SIMULADO) return ultimo;
  }
  return ultimo;                      // nem o mínimo coube: devolve o último medido
}

/* Aplica o corte, preservando tudo o que cada item carrega. */
function aplicarAjuste(sm,aj){
  const pr=provaDoSim(sm);
  gravarCaderno(pr,aj.lista);
  sm.qtd=Object.assign({},sm.qtd,aj.qtd);
  salvar();
  if(E.ativa===pr.id) ativar(pr.id);
  return pr;
}

/* ── quantidade pedida pelo professor ──────────────────────────────
   É ela que manda, não a quantidade que veio no arquivo. */
const qtdPedida=(sm,comp)=>{
  const q=(sm&&sm.qtd)||{};
  const v=parseInt(q[comp],10);
  return isNaN(v)?0:Math.max(0,v);
};

/* Sorteio sem viés (Fisher-Yates), para não pegar sempre as primeiras. */
function sortear(lista,quantos){
  const p=lista.slice();
  for(let i=p.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=p[i]; p[i]=p[j]; p[j]=t;
  }
  return p.slice(0,quantos);
}

/* Escolhe os itens que vão entrar, respeitando a quantidade pedida.
   O item viaja INTEIRO — enunciado, alternativas, gabarito, descritor e o
   número que tinha no arquivo. Separar qualquer um deles do resto faria a
   correção e a análise por descritor apontarem para a questão errada. */
function selecionarItens(sm,comp,itens){
  const pedido=qtdPedida(sm,comp);
  if(!pedido) return {erro:"Defina quantas questões de "+nomeComp(comp)+
    " o simulado terá antes de subir o arquivo."};
  if(itens.length<pedido) return {erro:"O arquivo enviado tem apenas "+itens.length+
    " questões de "+nomeComp(comp)+", mas você pediu "+pedido+
    ". Envie um arquivo com mais questões ou reduza a quantidade pedida."};
  const escolhidos=(itens.length===pedido)
    ? itens.map((x,i)=>Object.assign({},x,{orig:i+1}))
    : sortear(itens.map((x,i)=>Object.assign({},x,{orig:i+1})),pedido)
        .sort((a,b)=>a.orig-b.orig);
  return {itens:escolhidos, encontradas:itens.length, usadas:escolhidos.length,
          sorteadas:itens.length>pedido};
}

/* Substitui os itens de UM componente, preservando os do outro.
   A ordem do caderno é sempre Língua Portuguesa e depois Matemática. */
function aplicarImportacao(sm,comp,itens){
  const pr=provaDoSim(sm); if(!pr) return null;
  const outros=itensDoCaderno(pr).filter(x=>x.comp!==comp);
  const novos=itens.map(x=>({comp, questao:x.questao, gab:x.gab,
    desc:x.desc, orig:x.orig||null}));
  const lista=(comp==="LP")?novos.concat(outros):outros.concat(novos);
  return gravarCaderno(pr,lista);
}

/* Ajusta o caderno quando o professor muda a quantidade pedida: sobra
   vira item em branco no fim do bloco, falta corta do fim. Nunca mexe no
   outro componente. */
function ajustarQuantidade(sm,comp){
  const pr=provaDoSim(sm); if(!pr) return;
  const pedido=qtdPedida(sm,comp);
  const doComp=itensDoCaderno(pr).filter(x=>x.comp===comp);
  const outros=itensDoCaderno(pr).filter(x=>x.comp!==comp);
  const novos=doComp.slice(0,pedido);
  while(novos.length<pedido) novos.push({comp,questao:null,gab:"",desc:"",orig:null});
  const lista=(comp==="LP")?novos.concat(outros):outros.concat(novos);
  gravarCaderno(pr,lista);
}

/* ── nota de participação ──────────────────────────────────────────
   Proporcional aos acertos: quem acertou tudo leva o valor cheio, quem
   acertou metade leva metade. Fica FORA da média do período — é um apoio
   para o professor lançar a pontuação onde quiser. */
/* ── plano de participação ─────────────────────────────────────────
   O ano inteiro distribui um total de pontos (10, por padrão) entre os
   simulados previstos. Previsto ≠ criado: o professor planeja oito, tem
   dois prontos, e o valor de cada um já sai de 10 ÷ 8. Mudou a previsão,
   os valores se refazem — mas só quando ele pedir, porque mexer nos
   valores de simulados já corrigidos mudaria nota lançada. */
const PART_TOTAL_PADRAO=10, PART_PREVISTOS_PADRAO=8;
function planoParticipacao(){
  E.saepe=E.saepe||{};
  if(E.saepe.totalParticipacao==null) E.saepe.totalParticipacao=PART_TOTAL_PADRAO;
  if(E.saepe.previstos==null) E.saepe.previstos=PART_PREVISTOS_PADRAO;
  return E.saepe;
}
const arred2=x=>Math.round(Number(x)*100)/100;
const valorSugerido=()=>{
  const P=planoParticipacao();
  return P.previstos>0?arred2(P.totalParticipacao/P.previstos):0;
};
const VALOR_PART_PADRAO=1;
const valorParticipacao=sm=>{
  const v=sm&&sm.valorParticipacao;
  return (v==null||isNaN(v))?valorSugerido():Number(v);
};
/* quanto já foi distribuído entre os simulados de uma turma */
const participacaoDistribuida=tid=>
  arred2(simuladosDa(tid).reduce((n,sm)=>n+valorParticipacao(sm),0));
function distribuirParticipacao(tid){
  const v=valorSugerido();
  simuladosDa(tid).forEach(sm=>{ sm.valorParticipacao=v; });
  salvar();
  return v;
}

function notaParticipacao(sm,acertos,total){
  if(!total||acertos==null) return null;
  return arred2(valorParticipacao(sm)*(acertos/total));
}
/* nota lançada à mão pelo professor, se houver — sempre dentro do teto */
function participacaoManual(sm,numero){
  const m=(sm&&sm.partAluno)||{};
  const v=m[String(numero)];
  if(v==null||isNaN(v)) return null;
  return Math.max(0,Math.min(valorParticipacao(sm),Number(v)));
}
function gravarParticipacao(sm,numero,valor){
  sm.partAluno=sm.partAluno||{};
  if(valor==null||valor===""||isNaN(valor)) delete sm.partAluno[String(numero)];
  else sm.partAluno[String(numero)]=Math.max(0,Math.min(valorParticipacao(sm),Number(valor)));
  salvar();
}
/* uma linha por estudante, com o total e a quebra por componente */
function participacaoDe(sm){
  const pr=provaDoSim(sm), t=turmaDe(sm.turma);
  if(!pr||!t) return [];
  const linhas=alunosDaProva(t,pr).map(a=>({aluno:a,
    res:E.res.find(x=>x.prova===pr.id && x.numero===a.numero)||null}));
  E.res.filter(r=>r.prova===pr.id).forEach(r=>{
    if(!linhas.some(L=>L.aluno.numero===r.numero))
      linhas.push({aluno:{numero:r.numero,nome:r.nome},res:r,fora:true});
  });
  return linhas.map(L=>{
    const porComp={};
    COMPONENTES.forEach(c=>{
      const n=itensDe(pr,c.id).length;
      porComp[c.id]={total:n, acertos:L.res?acertosComp(pr,L.res,c.id):null,
        nota:L.res?notaParticipacao(sm,acertosComp(pr,L.res,c.id),n):null};
    });
    const calculada=L.res?notaParticipacao(sm,L.res.acertos,pr.nq):null;
    const manual=participacaoManual(sm,L.aluno.numero);
    return Object.assign(L,{total:pr.nq, acertos:L.res?L.res.acertos:null,
      calculada, manual, nota:(manual!=null?manual:calculada), porComp});
  }).sort((x,y)=>ordNum(x.aluno.numero,y.aluno.numero));
}

/* banco de descritores: código → texto, reaproveitado entre simulados */
const bancoDesc=comp=>((E.descritores||{})[comp]||{});
function textoDesc(comp,cod){ return bancoDesc(comp)[codDesc(cod)]||""; }
function rotuloDesc(comp,cod){
  const t=textoDesc(comp,cod);
  return cod?(cod+(t?" — "+t:"")):"";
}

function ativar(pid){
  const p=provaDe(pid); if(!p) return;
  E.ativa=pid;
  if(p.nq>=MIN_Q_CARTAO) aplicarLayout(p.nq,p.no);   // caderno ainda vazio não tem cartão
  salvar(); refletirBarra();
  const tp=turmaDe(p.turma);           // a aba Notas segue a prova escolhida
  if(tp && !ehCaderno(p) && typeof notaNav!=="undefined") notaNav={escola:tp.escola,
    turma:tp.id, disc:p.disciplina||primeiraDisc(tp), per:p.periodo||1, prova:p.id};
  manAluno=null; pintarResultados(); pintarDesempenho(); montarManual();
  if(typeof pintarSeletores==="function") pintarSeletores();
}
function refletirBarra(){
  const p=provaAtiva(), t=turmaAtiva(), b=$("#barra");
  if(!p||!t){ b.classList.add("off");
    $("#bCtx1").textContent="Nenhuma prova selecionada";
    $("#bCtx2").textContent="Comece pela aba Turmas"; return; }
  b.classList.remove("off");
  $("#bCtx1").textContent=(p.titulo||p.codigo)+" · "+t.nome;
  const e=escolaDe(t.escola);
  $("#bCtx2").textContent=[p.codigo,rotuloProva(p),p.nq+" questões",
    "A–"+LETRAS_ATE(p.no),e?e.curto:""].filter(Boolean).join(" · ");
}
const LETRAS_ATE=n=>["A","B","C","D","E"][n-1];
const calendario=t=>(t&&t.periodo)||{tipo:"bimestre",qtd:4};
/* Um estudante pertence à turma de um período de entrada até um de saída.
   Quem se transfere NÃO é apagado: as notas dos períodos que ele cursou
   continuam valendo, e ele some das listas dos períodos seguintes. */
const entrou=a=>a.desde||1;
const saiu=a=>(a.ate==null?null:a.ate);
const naTurmaEm=(a,per)=>entrou(a)<=per && (saiu(a)==null || saiu(a)>=per);
const ativo=a=>saiu(a)==null;
function alunosEm(t,per){ return (t.alunos||[]).filter(a=>naTurmaEm(a,per)); }
function temNotas(t,a){ return E.res.some(r=>r.turma===t.id && r.numero===a.numero); }
/* A nomenclatura vem da turma: turma bimestral nunca mostra “trimestre”. */
const nomePeriodo=(t,n)=>n+"º "+(calendario(t).tipo==="trimestre"?"Trimestre":"Bimestre");
const nomeCalendario=t=>calendario(t).tipo==="trimestre"?"Trimestral":"Bimestral";
const periodosDe=t=>Array.from({length:calendario(t).qtd},(_,i)=>i+1);
const provasDoPeriodo=(tid,n,did)=>provasDe(tid,did).filter(p=>(p.periodo||1)===n);

/* ── gabarito individual, a partir do canônico + turma/número ─────
   `ordemDe()` tem de devolver exatamente o que o gerador imprimiu: no
   caderno de simulado as questões saem agrupadas por componente, e é
   `comps` que reconstrói esse agrupamento. Divergir aqui faz a turma
   inteira sair com nota errada sem nenhum erro aparente. */
const alternaBlocos=p=>{
  const sm=p&&p.simulado?simuladoDe(p.simulado):null;
  return !!(sm && sm.alternarBlocos!==false);
};
const tiposDe=p=>{
  const sm=p&&p.simulado?simuladoDe(p.simulado):null;
  return sm?(sm.tipos||0):0;
};
const ordemDe=(p,turma,numero)=>{
  const chave=chaveDeOrdem(numero,tiposDe(p));   // com tipos, o tipo é a semente
  return (p && p.comps && p.comps.length===p.nq)
    ? embaralharEmBlocos(p.nq,p.no,turma,chave,p.comps,alternaBlocos(p))
    : embaralharProva(p.nq,p.no,turma,chave);
};

function gabaritoDe(nomeTurma,numero){
  const p=provaAtiva(); if(!p||!p.gabC) return null;
  const {oq,oa}=ordemDe(p,nomeTurma,numero);
  let g="";
  for(let i=0;i<p.nq;i++){
    const certa=LAY.options.indexOf(p.gabC[oq[i]]);
    g+=LAY.options[oa[i].indexOf(certa)];
  }
  return g;
}
function canonizar(R,nomeTurma,numero){
  const p=provaAtiva(); if(!p) return R.slice();
  const {oq,oa}=ordemDe(p,nomeTurma,numero);
  const out=new Array(p.nq).fill(null);
  for(let i=0;i<p.nq;i++){
    if(!R[i]) continue;
    const k=LAY.options.indexOf(R[i]);
    if(k>=0) out[oq[i]]=LAY.options[oa[i][k]];
  }
  return out;
}

/* Refaz as contas de todos os registros de uma prova a partir das
   respostas já lidas. Serve para quando o gabarito estava errado: as
   marcações do papel continuam válidas, só a conferência muda. */
function recalcular(pr){
  const t=turmaDe(pr.turma); if(!t) return 0;
  const letras=["A","B","C","D","E"].slice(0,pr.no);
  let n=0;
  E.res.filter(r=>r.prova===pr.id).forEach(r=>{
    const {oq,oa}=ordemDe(pr,t.nome,r.numero);
    let gab="";
    for(let i=0;i<pr.nq;i++){
      const certa=letras.indexOf(pr.gabC[oq[i]]);
      gab+=letras[oa[i].indexOf(certa)];
    }
    const Rc=new Array(pr.nq).fill(null);
    for(let i=0;i<pr.nq;i++){
      if(!r.R[i]) continue;
      const k=letras.indexOf(r.R[i]);
      if(k>=0) Rc[oq[i]]=letras[oa[i][k]];
    }
    let acertos=0; const certas=[],erradas=[];
    for(let i=0;i<pr.nq;i++){
      if(r.R[i]&&r.R[i]===gab[i]){acertos++;certas.push(i+1);} else erradas.push(i+1);
    }
    r.gab=gab; r.Rc=Rc; r.acertos=acertos; r.erros=pr.nq-acertos;
    r.certas=certas; r.erradas=erradas;
    r.notaDisc=Math.max(0,Math.min(pontosDisc(pr),r.notaDisc||0));
    r.nota=notaFinal(pr,r); n++;
  });
  return n;
}

/* ═════════ 4. REGISTRO ═════════ */
function registrar(d){
  const p=provaAtiva(); if(!p) return null;
  const t=turmaDe(p.turma);
  const gab=d.gab||gabaritoDe(t.nome,d.numero);
  if(!gab) return null;
  let acertos=0; const certas=[],erradas=[];
  for(let i=0;i<p.nq;i++){
    if(d.R[i]&&d.R[i]===gab[i]){acertos++;certas.push(i+1);} else erradas.push(i+1);
  }
  const reg={prova:p.id,turma:p.turma,numero:d.numero||"",nome:d.nome,
    R:d.R.slice(),Rc:canonizar(d.R,t.nome,d.numero),gab,
    acertos,erros:p.nq-acertos,certas,erradas,
    notaDisc:Math.max(0,Math.min(pontosDisc(p),d.notaDisc||0)),
    origem:d.origem,t:Date.now()};
  reg.nota=notaFinal(p,reg);
  const k=chave(reg), i=E.res.findIndex(x=>chave(x)===k);
  if(i>=0) E.res[i]=reg; else E.res.push(reg);
  salvar(); pintarResultados(); pintarDesempenho();
  return reg;
}
const pct=(a,b)=>b?Math.round(100*a/b):0;
const pontosObj=p=>(p&&p.pontosObj!=null)?p.pontosObj:10;
const pontosDisc=p=>(p&&p.pontosDisc)?p.pontosDisc:0;
/* nota final = parte objetiva proporcional aos acertos + nota digitada da parte escrita */
function notaFinal(p,reg){
  const obj=p.nq?pontosObj(p)*reg.acertos/p.nq:0;
  return obj+(reg.notaDisc||0);
}
const notaMaxima=p=>pontosObj(p)+pontosDisc(p);

/* ═══════════════════════════════════════════════════════════════════
   5. TELA TURMAS / PROVAS
