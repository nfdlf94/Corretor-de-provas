/* ── ABA NOTAS ──────────────────────────────────────────────────────
   Escola → Turma → Disciplina → Período → notas. O período mostrado é
   sempre o da turma escolhida: quatro bimestres ou três trimestres. */
let notaNav={escola:null,turma:null,disc:null,per:null,prova:null};

function irNotas(campo,valor){
  const ordem=["escola","turma","disc","per","prova"];
  const i=ordem.indexOf(campo);
  ordem.forEach((c,j)=>{ if(j>i) notaNav[c]=null; });
  notaNav[campo]=valor;
  pintarResultados();
}

function migalhaNotas(){
  const t=notaNav.turma?turmaDe(notaNav.turma):null;
  const e=notaNav.escola?escolaDe(notaNav.escola):null;
  const partes=[];
  if(e) partes.push(`<button data-volta="escola">${esc(e.curto||e.nome)}</button>`);
  if(t) partes.push(`<button data-volta="turma">${esc(t.nome)}</button>`);
  if(t&&notaNav.disc) partes.push(`<button data-volta="disc">${esc(nomeDisc(t,notaNav.disc))}</button>`);
  if(t&&notaNav.per) partes.push(`<button data-volta="per">${esc(nomePeriodo(t,notaNav.per))}</button>`);
  if(!partes.length) return "";
  return `<div class="migalha">${partes.join('<span>›</span>')}</div>`;
}

function ligarMigalha(){
  document.querySelectorAll("#resSel [data-volta]").forEach(b=>b.onclick=()=>{
    const alvo=b.dataset.volta;
    const ordem=["escola","turma","disc","per","prova"];
    ordem.slice(ordem.indexOf(alvo)+1).forEach(c=>notaNav[c]=null);
    pintarResultados(); });
}

function fechamentoDe(t,did,per){
  const ps=provasDoPeriodo(t.id,per,did).slice().reverse();   // ordem cronológica
  const comNota=ps.filter(p=>resDa(p.id).length);
  const linhas=alunosEm(t,per).map(a=>{
    const notas=comNota.map(p=>{
      const r=E.res.find(x=>x.prova===p.id&&x.numero===a.numero);
      if(!r) return null;
      const nf=(r.nota!=null?r.nota:notaFinal(p,r));
      return 10*nf/notaMaxima(p);            // tudo na mesma escala de 0 a 10
    });
    const val=notas.filter(x=>x!=null);
    return {aluno:a, notas,
      media:val.length?val.reduce((s,x)=>s+x,0)/val.length:null,
      faltam:notas.filter(x=>x==null).length};
  });
  return {ps,comNota,linhas};
}

function pintarResultados(){
  const sel=$("#resSel"), lista=$("#resLista");
  if(!sel||!lista) return;
  $("#resAcoes").hidden=true;

  const pa=provaAtiva();
  const nAtiva=pa?resDa(pa.id).length:0;
  $("#pill").hidden=!nAtiva; $("#pill").textContent=nAtiva;

  /* o caminho pode ter ficado velho: cadastro apagado, prova excluída */
  const N=notaNav;
  if(N.escola && !escolaDe(N.escola)){ N.escola=null; N.turma=null; }
  let t=N.turma?turmaDe(N.turma):null;
  if(!t){ N.turma=null; N.disc=null; N.per=null; N.prova=null; }
  else if(N.escola && t.escola!==N.escola){ N.turma=null; t=null; N.disc=null; N.per=null; N.prova=null; }
  if(t && N.disc && !discDe(t,N.disc)){ N.disc=null; N.per=null; N.prova=null; }
  if(N.prova && !provaDe(N.prova)) N.prova=null;

  const cor=v=>v>=6?"var(--mint)":v>=4?"var(--amber)":"var(--coral)";

  /* 1 — escola */
  if(!N.escola){
    const es=escolasVisiveis().filter(e=>turmasVisiveis(e.id).length);
    $("#resSub").textContent="Escolha a escola.";
    sel.innerHTML="";
    lista.innerHTML=es.length?es.map(e=>{
      const ts=turmasVisiveis(e.id);
      return `<button class="item" data-e="${e.id}"><div class="cor">
        <div class="t1">${esc(e.nome)}</div>
        <div class="t2">${ts.length} turma${ts.length===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("")
      :'<div class="vazio"><b>Nenhuma turma cadastrada</b>Faça o cadastro inicial na aba Turmas.</div>';
    lista.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>irNotas("escola",b.dataset.e));
    return;
  }

  /* 2 — turma */
  if(!N.turma){
    const ts=turmasVisiveis(N.escola);
    $("#resSub").textContent="Escolha a turma.";
    sel.innerHTML=migalhaNotas(); ligarMigalha();
    lista.innerHTML=ts.length?ts.map(x=>{
      const ds=discVisiveis(x);
      return `<button class="item ${viva(x)?"":"arq"}" data-t="${x.id}"><div class="cor">
        <div class="t1">${esc(x.nome)}${viva(x)?"":" · encerrada"}</div>
        <div class="t2">${ds.map(d=>esc(d.nome)).join(" · ")||"sem disciplina"} ·
          ${esc(nomeCalendario(x))}</div></div><span class="ch">›</span></button>`;}).join("")
      :'<div class="vazio"><b>Nenhuma turma nesta escola</b></div>';
    lista.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>irNotas("turma",b.dataset.t));
    return;
  }

  /* 3 — disciplina */
  if(!N.disc){
    const ds=discVisiveis(t);
    $("#resSub").textContent="Escolha a disciplina.";
    sel.innerHTML=migalhaNotas(); ligarMigalha();
    lista.innerHTML=ds.length?ds.map(d=>{
      const np=provasDe(t.id,d.id).length;
      return `<button class="item ${viva(d)?"":"arq"}" data-d="${d.id}"><div class="cor">
        <div class="t1">${esc(d.nome)}${viva(d)?"":" · encerrada"}</div>
        <div class="t2">${np} prova${np===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("")
      :'<div class="vazio"><b>Nenhuma disciplina</b>Cadastre em Turmas › Editar turma.</div>';
    lista.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>irNotas("disc",b.dataset.d));
    return;
  }

  /* 4 — período (nomenclatura da turma) */
  if(!N.per){
    $("#resSub").textContent=nomeCalendario(t)==="Trimestral"
      ? "Turma trimestral — escolha o trimestre."
      : "Turma bimestral — escolha o bimestre.";
    sel.innerHTML=migalhaNotas(); ligarMigalha();
    let h=periodosDe(t).map(n=>{
      const ps=provasDoPeriodo(t.id,n,N.disc);
      const corr=ps.reduce((s,x)=>s+resDa(x.id).length,0);
      return `<button class="item" data-per="${n}"><div class="cor">
        <div class="t1">${esc(nomePeriodo(t,n))}</div>
        <div class="t2">${ps.length} prova${ps.length===1?"":"s"} ·
          ${corr} nota${corr===1?"":"s"} lançada${corr===1?"":"s"}</div>
        </div><span class="ch">›</span></button>`;}).join("");
    const fora=provasDe(t.id,N.disc).filter(x=>!periodosDe(t).includes(x.periodo||1));
    if(fora.length) h+=`<div class="diag" style="margin-top:10px"><b>Fora do calendário</b>
      ${fora.length} prova(s) desta disciplina estão em períodos que a turma não usa mais.
      Elas continuam guardadas — abra a turma na aba Turmas para vê-las.</div>`;
    const sims=simuladosDa(t.id);
    if(sims.length){
      const corr=sims.reduce((n,sm)=>{const pr=provaDoSim(sm);return n+(pr?resDa(pr.id).length:0);},0);
      h+=`<button class="item" id="irSim" style="margin-top:12px"><div class="cor">
        <div class="t1">Simulados SAEPE desta turma</div>
        <div class="t2">${sims.length} simulado${sims.length===1?"":"s"} ·
          ${corr} cartão${corr===1?"":"ões"} corrigido${corr===1?"":"s"} — não entram na
          média do período; os resultados ficam na área do simulado</div>
        </div><span class="ch">›</span></button>`;
    }
    lista.innerHTML=h;
    if($("#irSim")) $("#irSim").onclick=()=>{
      casaTurma=t.id; casaNivel="simulados"; montarCasa(); irPara("casa"); };
    lista.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>irNotas("per",+b.dataset.per));
    return;
  }

  const F=fechamentoDe(t,N.disc,N.per);

  /* 5 — o período inteiro: média por estudante e as provas que a compõem */
  if(!N.prova){
    $("#resSub").textContent=`${esc(t.nome)} · ${nomeDisc(t,N.disc)} · ${nomePeriodo(t,N.per)}`;
    sel.innerHTML=migalhaNotas(); ligarMigalha();
    let h="";
    h+=`<div class="rot" style="margin-top:4px">Provas do período</div>`;
    h+=F.ps.length?F.ps.map(pr=>{
      const n=resDa(pr.id).length, tot=alunosDaProva(t,pr).length;
      const tag=!n?'<span class="tag">0 corrigidos</span>'
        :(tot&&n>=tot?`<span class="tag ok">${n} de ${tot}</span>`
                     :`<span class="tag par">${n}${tot?" de "+tot:""}</span>`);
      return `<button class="item ${pr.id===E.ativa?"sel":""}" data-pr="${pr.id}"><div class="cor">
        <div class="t1">${esc(pr.titulo||pr.codigo)}</div>
        <div class="t2">${esc(pr.codigo)} · ${pr.nq} questões</div>
        </div>${tag}<span class="ch">›</span></button>`;}).join("")
      :'<p class="hint" style="margin:0 0 6px">Nenhuma prova cadastrada neste período.</p>';

    if(F.comNota.length){
      h+=`<div class="rot">Média do período — ${F.comNota.map(x=>esc(x.codigo)).join(" · ")}</div>`;
      h+=F.linhas.map(L=>`<div class="aluno" style="cursor:default">
        <div style="flex:1;min-width:0">
          <div class="nm"><span style="color:var(--mute);font-family:var(--mono);font-size:12px">${esc(L.aluno.numero)} </span>${esc(L.aluno.nome)}</div>
          <div class="rs">${L.notas.map((n,i)=>esc(F.comNota[i].codigo)+": "+
            (n==null?"—":n.toFixed(1).replace(".",","))).join("  ·  ")}${
            L.faltam?` · <span style="color:var(--amber)">${L.faltam} sem nota</span>`:""}</div></div>
        <div class="nt" style="color:${L.media==null?"var(--mute)":cor(L.media)}">${
          L.media==null?"—":L.media.toFixed(1).replace(".",",")}</div></div>`).join("");
      const medias=F.linhas.map(L=>L.media).filter(x=>x!=null);
      if(medias.length){
        const m=medias.reduce((s,x)=>s+x,0)/medias.length;
        h+=`<div class="kpi" style="margin-top:14px">
          <div><div class="v">${m.toFixed(1).replace(".",",")}</div><div class="l">Média da turma</div></div>
          <div><div class="v">${medias.filter(x=>x>=6).length}<span style="font-size:13px;color:var(--mute)">/${medias.length}</span></div><div class="l">≥ 6,0</div></div>
          <div><div class="v">${F.linhas.filter(L=>L.faltam).length}</div><div class="l">Com pendência</div></div>
        </div>`;
      }
      h+=`<button class="btn sec" id="bCsvPer" style="margin-top:14px">Baixar CSV do período</button>
        <p class="hint">Cada prova entra na média convertida para a escala de 0 a 10, mesmo
          valendo pontuação diferente. Provas sem correção não contam.</p>`;
    }else if(F.ps.length){
      h+='<div class="vazio" style="padding:30px 16px"><b>Nada corrigido ainda</b>As médias aparecem depois do primeiro cartão lido.</div>';
    }
    lista.innerHTML=h;
    lista.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{
      ativar(b.dataset.pr); irNotas("prova",b.dataset.pr); });
    if($("#bCsvPer")) $("#bCsvPer").onclick=()=>{
      const e=escolaDe(t.escola)||{curto:""};
      const cab=["escola","turma","disciplina","periodo","numero","aluno",
        ...F.comNota.map(x=>x.codigo),"media"];
      const vg=x=>x==null?"":Number(x).toFixed(2).replace(".",",");
      const lin=F.linhas.map(L=>[e.curto,t.nome,nomeDisc(t,N.disc),nomePeriodo(t,N.per),
        L.aluno.numero,`"${String(L.aluno.nome).replace(/"/g,'""')}"`,
        ...L.notas.map(vg),vg(L.media)].join(";"));
      baixar([cab.join(";"),...lin].join("\r\n"),
        `notas_${t.nome}_${nomeDisc(t,N.disc)}_${N.per}o_periodo.csv`,"text/csv");
    };
    return;
  }

  /* 6 — uma prova: quem já foi corrigido e quem falta */
  const p=provaDe(N.prova);
  /* A aba Notas segue a prova aberta aqui — mas o caderno de simulado
     NUNCA entra em `notaNav` (não tem período nem disciplina, invariante 7).
     Sem a guarda abaixo esta linha DESFAZIA, em silêncio, a escolha de um
     caderno feita nas abas Ler e Manual: `ativar(caderno)` chama
     `pintarResultados()`, que reativava a última prova comum aberta em
     Notas. Era por isso que a correção manual “só funcionava para as
     avaliações normais” e que a câmera ficava com o layout errado. */
  if(E.ativa!==p.id && !ehCaderno(provaAtiva())) ativar(p.id);
  sel.innerHTML=migalhaNotas()+
    `<button class="item" id="resVoltaPer" style="margin-bottom:10px"><div class="cor">
      <div class="t1">${esc(p.titulo||p.codigo)}</div>
      <div class="t2">${esc(p.codigo)} · ${esc(nomePeriodo(t,p.periodo||1))} — toque para ver o período inteiro</div>
      </div><span class="ch">⌃</span></button>`;
  ligarMigalha();
  $("#resVoltaPer").onclick=()=>irNotas("per",N.per);

  const matriculados=alunosDaProva(t,p);
  const notas=resDa(p.id);
  const porNumero={}; notas.forEach(r=>porNumero[r.numero]=r);

  const linhas=matriculados.map(a=>({aluno:a, res:porNumero[a.numero]||null}));
  notas.forEach(r=>{ if(!matriculados.some(a=>a.numero===r.numero))
    linhas.push({aluno:{numero:r.numero,nome:r.nome}, res:r, fora:true}); });
  linhas.sort((x,y)=>ordNum(x.aluno.numero,y.aluno.numero));

  const feitos=notas.length, total=matriculados.length;
  $("#pill").hidden=!feitos; $("#pill").textContent=feitos;
  $("#resAcoes").hidden=!feitos;
  $("#resSub").textContent = total
    ? `${feitos} de ${total} corrigidos · ${p.codigo} · ${t.nome} · ${nomeDisc(t,p.disciplina)}`
    : (feitos?`${feitos} corrigidos · ${p.codigo} · ${t.nome}`
             :"Cadastre os estudantes da turma para ver a lista completa.");

  if(!linhas.length){
    lista.innerHTML='<div class="vazio"><b>Sem estudantes</b>Cadastre a turma em Turmas.</div>';
    return; }

  const max=notaMaxima(p);
  lista.innerHTML=linhas.map((L,i)=>{
    const a=L.res;
    if(!a) return `<button class="aluno" data-p="${esc(L.aluno.numero)}" style="opacity:.62">
      <div style="flex:1;min-width:0">
        <div class="nm"><span style="color:var(--mute);font-family:var(--mono);font-size:12px">${esc(L.aluno.numero)} </span>${esc(L.aluno.nome)}</div>
        <div class="rs">ainda não corrigido · toque para lançar</div></div>
      <div class="nt" style="color:var(--mute);font-size:19px">—</div></button>`;
    const nf=(a.nota!=null?a.nota:notaFinal(p,a)), rel=max?10*nf/max:0;
    return `<button class="aluno" data-x="${i}"><div style="flex:1;min-width:0">
      <div class="nm"><span style="color:var(--mute);font-family:var(--mono);font-size:12px">${esc(L.aluno.numero)} </span>${esc(L.aluno.nome)}</div>
      <div class="rs">${a.acertos}/${p.nq} acertos${a.notaDisc?" · escrita "+a.notaDisc:""}${
        a.origem==="manual"?" · manual":""}${L.fora?" · transferido":""}</div></div>
      <div class="nt" style="color:${cor(rel)}">${nf.toFixed(1).replace(".",",")}</div>
    </button><div id="det${i}"></div>`;}).join("");

  // pendente: abre direto a correção manual daquele estudante
  lista.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    manAluno=b.dataset.p;
    manR=new Array(p.nq).fill(null); manDisc=0;
    montarManual(); irPara("man"); });

  lista.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.x, d=$("#det"+i);
    if(d.innerHTML){ d.innerHTML=""; return; }
    const a=linhas[i].res;
    d.innerHTML=`<div class="card" style="margin:-3px 0 9px">
      <p style="margin-bottom:8px"><b style="color:var(--mint)">Acertou:</b> ${a.certas.length?a.certas.join(", "):"—"}<br>
      <b style="color:var(--coral)">Errou:</b> ${a.erradas.length?a.erradas.join(", "):"—"}</p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">${
        a.R.map((r,q)=>`<div style="text-align:center;background:var(--slate);border-radius:8px;padding:5px 2px">
          <div style="font-family:var(--mono);font-size:9px;color:var(--mute)">Q${q+1}</div>
          <div style="font-family:var(--mono);font-size:14px;font-weight:600;color:${r===a.gab[q]?"var(--mint)":"var(--coral)"}">${r||"—"}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--mute)">${a.gab[q]}</div></div>`).join("")}</div>
      <div class="linha" style="margin-top:11px">
        <button class="btn gho" style="padding:9px" data-ed="${i}">Corrigir de novo</button>
        <button class="btn gho" style="padding:9px" data-rm="${i}">Remover</button></div></div>`;
    d.querySelector("[data-ed]").onclick=()=>{
      manAluno=a.numero; manR=a.R.slice(); manDisc=a.notaDisc||0;
      montarManual(); irPara("man"); };
    d.querySelector("[data-rm]").onclick=()=>{
      if(!confirm("Remover a nota de "+a.nome+"?")) return;
      E.res=E.res.filter(x=>chave(x)!==chave(a)); salvar();
      pintarResultados(); pintarDesempenho(); };
  });
}

/* ═════════ 10. ANÁLISE DA TURMA ═════════ */
function estat(A){
  const p=provaAtiva(); if(!A.length||!p) return null;
  const n=A.length, notas=A.map(a=>10*a.acertos/p.nq);     // objetiva, base da análise
  const med=notas.reduce((s,x)=>s+x,0)/n;
  const max=notaMaxima(p);
  const finais=A.map(a=>a.nota!=null?a.nota:notaFinal(p,a));
  const medFinal=finais.reduce((s,x)=>s+x,0)/n;
  const temDisc=pontosDisc(p)>0;
  const item=[], hab={};
  for(let q=0;q<p.nq;q++){
    const ac=A.filter(a=>a.Rc[q]&&a.Rc[q]===p.gabC[q]).length;
    const v=100*ac/n; item.push(v);
    const h=(p.habs[q]||("Questão "+(q+1)));
    (hab[h]=hab[h]||[]).push(v);
  }
  const habs=Object.entries(hab).map(([h,v])=>[h,v.reduce((s,x)=>s+x,0)/v.length])
    .sort((a,b)=>a[1]-b[1]);
  return {n,med,notas,item,habs,nq:p.nq,max,finais,medFinal,temDisc,
    mediaAc:A.reduce((s,a)=>s+a.acertos,0)/n,
    mediaEr:A.reduce((s,a)=>s+a.erros,0)/n,
    aprov:notas.filter(x=>x>=6).length};
}
function diagnostico(s){
  const fracas=s.habs.filter(([,v])=>v<50), fortes=s.habs.filter(([,v])=>v>=75);
  const piores=s.item.map((v,q)=>[q+1,v]).sort((a,b)=>a[1]-b[1]).slice(0,3);
  const melhores=s.item.map((v,q)=>[q+1,v]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const L=[];
  if(s.temDisc) L.push(`<div class="diag"><b>Sobre estes números</b>A análise por questão e por
    habilidade usa só a parte objetiva, que é onde a leitura é confiável. A parte escrita entra
    apenas na nota final de cada aluno.</div>`);
  L.push(`<div class="diag"><b>Leitura geral</b>Média ${s.med.toFixed(1)} de 10 (${(s.med*10).toFixed(0)}% de aproveitamento), com ${s.aprov} de ${s.n} acima de 6,0. Cada estudante acertou ${s.mediaAc.toFixed(1)} das ${s.nq} questões, em média.</div>`);
  if(fracas.length) L.push(`<div class="diag"><b>Precisa ser retomado</b><ul>${
    fracas.map(([h,v])=>`<li>${esc(h)} — ${Math.round(v)}% de acerto</li>`).join("")}</ul></div>`);
  else L.push(`<div class="diag"><b>Precisa ser retomado</b>Nenhuma habilidade ficou abaixo de 50%. A mais frágil foi ${esc(s.habs[0][0])}, com ${Math.round(s.habs[0][1])}%.</div>`);
  if(fortes.length) L.push(`<div class="diag"><b>Pontos fortes</b><ul>${
    fortes.map(([h,v])=>`<li>${esc(h)} — ${Math.round(v)}%</li>`).join("")}</ul></div>`);
  L.push(`<div class="diag"><b>Questões críticas</b>Menor acerto: ${
    piores.map(([q,v])=>`Q${q} (${Math.round(v)}%)`).join(", ")}. Maior acerto: ${
    melhores.map(([q,v])=>`Q${q} (${Math.round(v)}%)`).join(", ")}.</div>`);
  const rec=[];
  fracas.forEach(([h])=>rec.push(`Retomar <b>${esc(h)}</b> com exercícios dirigidos antes da próxima avaliação.`));
  if(piores[0][1]<40) rec.push(`Resolver a Q${piores[0][0]} passo a passo no quadro — menos de 40% da turma acertou.`);
  if(s.med<5) rec.push("Média abaixo de 5,0: considerar uma aula de revisão geral antes de avançar no conteúdo.");
  if(s.aprov/s.n>0.7) rec.push("Turma majoritariamente acima da média: dá para avançar, atendendo em separado quem ficou abaixo de 4,0.");
  const baixos=s.notas.filter(x=>x<4).length;
  if(baixos) rec.push(`${baixos} estudante(s) abaixo de 4,0 — vale acompanhamento individual.`);
  if(!rec.length) rec.push("Desempenho equilibrado. Seguir o planejamento.");
  L.push(`<div class="diag"><b>Recomendações</b><ul>${rec.map(r=>`<li>${r}</li>`).join("")}</ul></div>`);
  return L.join("");
}
let abaAnalise="prova", anTurma=null, anSim=null, anSerie=null, anSimSerie=null;

function pintarDesempenho(){
  const abas=$("#desAbas");
  if(abas) abas.querySelectorAll("[data-aba]").forEach(b=>{
    b.className=(b.dataset.aba===abaAnalise)?"sel":"";
    b.onclick=()=>{ abaAnalise=b.dataset.aba; pintarDesempenho(); };
  });
  $("#desTit").textContent = abaAnalise==="prova" ? "Análise da turma"
    : abaAnalise==="turma" ? "Simulados por turma" : "Simulados por série";
  if(abaAnalise==="turma") return analiseTurma();
  if(abaAnalise==="serie") return analiseSerie();

  const p=provaAtiva(), t=turmaAtiva();
  pintarSeletor("desSel", ()=>pintarDesempenho());
  if(!p){ $("#desSub").textContent="";
    $("#desCorpo").innerHTML='<div class="vazio"><b>Nenhuma prova selecionada</b>Escolha a turma e a prova na aba Turmas.</div>'; return; }
  const A=resDa(p.id), s=estat(A);
  if(!s){ $("#desSub").textContent="";
    $("#desCorpo").innerHTML='<div class="vazio"><b>Sem dados ainda</b>As estatísticas aparecem a partir do primeiro cartão corrigido.</div>'; return; }
  $("#desSub").textContent=`${s.n} de ${t.alunos.length||s.n} corrigidos · ${p.codigo} · turma ${t.nome}. Estatísticas parciais, atualizadas a cada correção.`;
  $("#desCorpo").innerHTML=`
    <div class="kpi">
      <div><div class="v">${s.medFinal.toFixed(1).replace(".",",")}</div>
        <div class="l">${s.temDisc?"Média final /"+s.max:"Média"}</div></div>
      <div><div class="v">${(s.med*10).toFixed(0)}%</div><div class="l">Aproveitam. objetiva</div></div>
      <div><div class="v">${s.aprov}<span style="font-size:13px;color:var(--mute)">/${s.n}</span></div><div class="l">≥ 6,0 objetiva</div></div>
      <div><div class="v">${s.mediaAc.toFixed(1)}</div><div class="l">Acertos méd.</div></div>
      <div><div class="v">${s.mediaEr.toFixed(1)}</div><div class="l">Erros méd.</div></div>
      <div><div class="v">${Math.min(...s.notas).toFixed(1)}–${Math.max(...s.notas).toFixed(1)}</div><div class="l">Menor–maior obj.</div></div>
    </div>
    <div class="rot">Acerto por questão</div>
    ${s.item.map((v,q)=>`<div class="barra"><span class="q">${String(q+1).padStart(2,"0")}</span>
      <span class="t"><span class="f ${v<50?"baixo":v<75?"medio":""}" style="width:${v}%"></span></span>
      <span class="p">${Math.round(v)}%</span></div>`).join("")}
    <div class="rot">Desempenho por habilidade</div>
    ${s.habs.map(([h,v])=>`<div class="barra"><span class="lb">${esc(h)}</span>
      <span class="t"><span class="f ${v<50?"baixo":v<75?"medio":""}" style="width:${v}%"></span></span>
      <span class="p">${Math.round(v)}%</span></div>`).join("")}
    <div class="rot">Parecer automático</div>
    ${diagnostico(s)}
    <button class="btn sec" id="bRel" style="margin-top:14px">Baixar relatório</button>`;
  $("#bRel").onclick=()=>baixarRelatorio(A,s);
}
function baixarRelatorio(A,s){
  const p=provaAtiva(), t=turmaAtiva(), e=escolaDe(t.escola);
  const lin=[], L=x=>lin.push(x);
  L("RELATÓRIO DE DESEMPENHO");
  L(e.nome); L("Turma "+t.nome+" · "+(t.serie||"")+" · "+rotuloProva(p));
  L("Prova: "+p.codigo+(p.titulo?" — "+p.titulo:"")+"   ("+p.nq+" questões, A–"+LETRAS_ATE(p.no)+")");
  L("Gerado em "+new Date().toLocaleString("pt-BR")); L("");
  L("ESTATÍSTICAS GERAIS");
  L("  Estudantes corrigidos ...... "+s.n+" de "+(t.alunos.length||s.n));
  L("  Média final ................ "+s.medFinal.toFixed(2)+" de "+s.max);
  L("  Média da parte objetiva .... "+s.med.toFixed(2)+" de 10");
  L("  Aproveitamento médio ....... "+(s.med*10).toFixed(1)+"%");
  L("  Média de acertos ........... "+s.mediaAc.toFixed(2)+" de "+p.nq);
  L("  Média de erros ............. "+s.mediaEr.toFixed(2));
  L("  Nota mínima / máxima ....... "+Math.min(...s.notas).toFixed(1)+" / "+Math.max(...s.notas).toFixed(1));
  L("  Com nota 6,0 ou mais ....... "+s.aprov+" ("+pct(s.aprov,s.n)+"%)"); L("");
  L("ANÁLISE DAS QUESTÕES");
  s.item.map((v,q)=>[q+1,v]).sort((a,b)=>b[1]-a[1]).forEach(([q,v])=>
    L("  Q"+String(q).padStart(2,"0")+"  acerto "+String(Math.round(v)).padStart(3)+"%   erro "+
      String(Math.round(100-v)).padStart(3)+"%   "+(p.habs[q-1]||"")));
  L("");
  L("ANÁLISE POR HABILIDADE  (da mais frágil para a mais dominada)");
  s.habs.forEach(([h,v])=>L("  "+String(Math.round(v)).padStart(3)+"%   "+h));
  L(""); L("PARECER");
  L(diagnostico(s).replace(/<li>/g,"\n  - ").replace(/<b>/g,"\n").replace(/<[^>]+>/g," ")
     .replace(/\n{3,}/g,"\n\n").replace(/[ \t]+/g," ").trim());
  L(""); L("NOTAS INDIVIDUAIS");
  A.slice().sort((a,b)=>ordNum(a.numero,b.numero)).forEach(a=>
    L("  "+String(a.numero).padEnd(4)+String(a.nome).padEnd(42)+
      "nota "+(a.nota!=null?a.nota:notaFinal(p,a)).toFixed(1).padStart(4)+"   acertos "+
      String(a.acertos).padStart(2)+"/"+p.nq+"   errou: "+(a.erradas.join(",")||"—")));
  baixar(lin.join("\r\n"),`relatorio_${t.nome}_${p.codigo}.txt`,"text/plain");
}
function baixar(txt,nome,tipo){
  const u=URL.createObjectURL(new Blob(["\uFEFF"+txt],{type:tipo+";charset=utf-8"}));
  const a=document.createElement("a"); a.href=u; a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
$("#bCsv").onclick=()=>{
  const p=provaAtiva(), t=turmaAtiva(); if(!p) return;
  const cab=["escola","turma","disciplina","numero","aluno","nota_final","nota_objetiva","nota_escrita","acertos","erros","aproveitamento",
    "questoes_erradas","origem","prova",...Array.from({length:p.nq},(_,i)=>"Q"+(i+1))];
  const feitos={}; resDa(p.id).forEach(r=>feitos[r.numero]=r);
  const A=alunosDaProva(t,p).map(al=>feitos[al.numero]||
      {numero:al.numero,nome:al.nome,acertos:null,erros:null,notaDisc:null,
       erradas:[],origem:"",R:[]})
    .concat(resDa(p.id).filter(r=>!alunosDaProva(t,p).some(al=>al.numero===r.numero)))
    .sort((a,b)=>ordNum(a.numero,b.numero));
  const e=escolaDe(t.escola);
  const vg=x=>(x==null?"":Number(x).toFixed(2).replace(".",","));
  const lin=A.map(a=>[e.curto,t.nome,rotuloProva(p),a.numero,`"${String(a.nome).replace(/"/g,'""')}"`,
    vg(a.acertos==null?null:(a.nota!=null?a.nota:notaFinal(p,a))),
    vg(a.acertos==null?null:pontosObj(p)*a.acertos/p.nq),
    vg(a.acertos==null?null:(a.notaDisc||0)),
    a.acertos==null?"":a.acertos, a.erros==null?"":a.erros,
    a.acertos==null?"":pct(a.acertos,p.nq)+"%",`"${(a.erradas||[]).join(", ")}"`,
    a.origem||"pendente",p.codigo,
    ...a.R.map(r=>r||"")].join(";"));
  baixar([cab.join(";"),...lin].join("\r\n"),
    `notas_${t.nome}_${p.codigo}_${new Date().toISOString().slice(0,10)}.csv`,"text/csv");
};

/* ═════════ 11. FOTO E NAVEGAÇÃO ═════════ */
$("#bFoto").onclick=()=>$("#arq").click();
$("#arq").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const im=new Image();
  im.onload=()=>{
    const alvo=Math.min(1400,im.width);
    tmp.width=alvo; tmp.height=Math.round(im.height*alvo/im.width);
    tctx.drawImage(im,0,0,tmp.width,tmp.height);
    const d=tctx.getImageData(0,0,tmp.width,tmp.height);
    let src=cinza(d), quad=fiduciais(reduzir(src,700));
    if(!quad && tentarOutroLayout()) quad=fiduciais(reduzir(src,700));
    if(!quad){ faixa("Cartão não encontrado na foto","Enquadre a moldura inteira",true); return; }
    const p=lerQR(src,quad);
    const r=p?aplicarQR(p):false;
    if(r==="trocou"){ quad=fiduciais(reduzir(src,700)); }
    if(!r){ faixa("QR ilegível nesta foto","Use a aba Manual",true); return; }
    if(!quad) return;
    const L=lerBolhas(src,quad); if(!L) return;
    ultimoQuad=quad; travar(L); };
  im.src=URL.createObjectURL(f); e.target.value=""; };

function irPara(v){
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  if(v!=="ler"&&rodando) parar();
  if(v==="casa") montarCasa();
  if(v==="ler") pintarSeletores();
  if(v==="man"){ pintarSeletores(); montarManual(); }
  if(v==="des") pintarDesempenho();
  if(v==="res") pintarResultados();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>irPara(b.dataset.v));

$("#bTrocar").onclick=()=>{

/* ═══════════════════════════════════════════════════════════════════
   FUNCIONAMENTO SEM INTERNET
   O Service Worker guarda os arquivos do app no aparelho. Os dados
   (turmas, provas, notas) já eram locais — não há servidor envolvido.
   ═══════════════════════════════════════════════════════════════════ */
function avisoFlutuante(texto, cls, segundos){
  const d=document.createElement("div");
  d.className=cls||"diag";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));"+
    "z-index:99;box-shadow:0 8px 24px #0009";
  d.innerHTML=texto;
  document.body.appendChild(d);
  if(segundos) setTimeout(()=>d.remove(), segundos*1000);
  return d;
}

(function ligarOffline(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const novo=reg.installing;
        if(!novo) return;
        novo.addEventListener("statechange", ()=>{
          if(novo.state==="installed" && navigator.serviceWorker.controller){
            const a=avisoFlutuante('<b>Atualização disponível</b>'+
              'Uma versão nova do app foi baixada. '+
              '<button class="btn" id="swAgora" style="margin-top:9px;padding:9px">Usar agora</button>');
            a.querySelector("#swAgora").onclick=()=>{
              novo.postMessage("assumir"); location.reload(); };
          }
        });
      });
    }).catch(e=>console.warn("service worker não registrou",e));
  });

  let jaTrocou=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(jaTrocou) return; jaTrocou=true;
    avisoFlutuante('<b>App atualizado</b>Guardando a versão nova no aparelho.',"diag",4);
  });

  const mostrarRede=()=>{
    if(navigator.onLine) return;
    avisoFlutuante('<b>Sem internet</b>O app funciona normalmente. '+
      'Só a leitura de prova pela Claude precisa de rede.', "aviso", 6);
  };
  window.addEventListener("offline", mostrarRede);
})();

(function conferirPecas(){
  const faltando=[];
  if(typeof jsQR!=="function") faltando.push("jsqr.js");
  if(typeof embaralharProva!=="function") faltando.push("embaralho.js");
  if(typeof montarLayout!=="function") faltando.push("layout.js");
  if(typeof fiduciais!=="function") faltando.push("núcleo de leitura");
  if(typeof window.jspdf==="undefined") faltando.push("jspdf.umd.min.js");
  if(typeof qrcode!=="function") faltando.push("qrcode.min.js");
  if(typeof gerarProvas!=="function") faltando.push("gerador.js");
  if(typeof montarXlsx!=="function") faltando.push("planilha.js");
  if(typeof registrarFontes!=="function") faltando.push("fonte.js");
  if(typeof mammoth==="undefined") faltando.push("mammoth.browser.min.js");
  if(typeof pdfjsLib==="undefined") faltando.push("pdf.min.js");
  if(faltando.length){
    const d=document.createElement("div");
    d.className="aviso";
    d.style.cssText="position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:99";
    d.textContent="Faltou carregar: "+faltando.join(", ")+". Envie todos os arquivos para o GitHub e recarregue.";
    document.body.appendChild(d);
  }
})();

/* ── conversão dos simulados já existentes ─────────────────────────
   Roda uma vez, ao abrir. Dá `qid` a cada item dos cadernos antigos,
   derivado do enunciado — a mesma identificação que existia, só que
   estável. NÃO funde simulados de turmas diferentes: cada turma sorteou
   o seu, e sem itens em comum não há informação que ligue as escalas.
   Eles ficam marcados como `legado` e continuam comparáveis por
   percentual e por descritor, como sempre foram. Nenhuma nota se move —
   a conversão não toca em `E.res`. */
function converterSimulados(){
  let mexeu=false;
  (E.provas||[]).filter(ehCaderno).forEach(pr=>{
    if(Array.isArray(pr.qids) && pr.qids.length===pr.nq) return;
    pr.qids=Array.from({length:pr.nq},(_,i)=>qidDoItem(pr,i));
    mexeu=true;
  });
  (E.simulados||[]).forEach(sm=>{
    if(sm.matriz===undefined){ sm.matriz=null; mexeu=true; }
    if(!sm.serie){ const t=turmaDe(sm.turma); if(t){ sm.serie=chaveSerie(t); mexeu=true; } }
    if(!sm.matriz && sm.legado===undefined){ sm.legado=true; mexeu=true; }
  });
  if(mexeu) salvar();
  return mexeu;
}
converterSimulados();
