/* ═══════════════════════════════════════════════════════════════════
   4b. ASSISTENTE DE CONFIGURAÇÃO INICIAL
   Nome do professor → escolas → turmas de cada escola → disciplinas de
   cada turma → bimestral ou trimestral daquela turma. O assistente só
   ACRESCENTA cadastros; nunca apaga o que já existe.
   ═══════════════════════════════════════════════════════════════════ */
const SETUP_FEITO="dbm_setup_v6";
let assist=null;
/* de onde o professor entrou no cadastro, para o “‹ Voltar” não mentir */
const voltaPara={cadastro:"config", turma:"escola", prova:"provas"};

const precisaAssistente=()=>!guarda.ler(SETUP_FEITO)&&!E.escolas.length&&!E.turmas.length;

function apelidoEscola(nome){
  const limpo=String(nome||"").trim();
  if(limpo.length<=24) return limpo;
  const semGenerico=limpo.replace(
    /^(escola\s+(municipal|estadual|de\s+refer[êe]ncia)?|col[ée]gio|centro|e\.?\s?m\.?|e\.?\s?e\.?|erem|ceja)\s+/i,"");
  const base=semGenerico||limpo;
  return base.length<=24?base:base.slice(0,23).trim()+"…";
}

function novaTurmaAssist(){ return {nome:"",serie:"",disciplinas:[""],tipo:"bimestre"}; }

function ajustar(lista, n, criar){
  while(lista.length<n) lista.push(criar());
  while(lista.length>n) lista.pop();
  return lista;
}

function telaAssistente(box){
  if(!assist) assist={passo:"prof",prof:lerProfessor(),escolas:[],iE:0,iT:0};
  const A=assist;
  const FASES=["prof","qtdEscolas","nomesEscolas","qtdTurmas","nomesTurmas","turma","resumo"];
  const barra=()=>`<div class="passos">${FASES.map(f=>
    `<i class="${FASES.indexOf(f)<=FASES.indexOf(A.passo)?"on":""}"></i>`).join("")}</div>`;
  const escolaAtual=()=>A.escolas[A.iE];
  const turmaAtual=()=>escolaAtual().turmas[A.iT];

  /* stepper de quantidade: −  N  + */
  const contador=(id,valor,min,max)=>`<div class="cont">
      <button data-menos="${id}">−</button>
      <input id="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${valor}">
      <button data-mais="${id}">+</button></div>`;

  const ligarContador=(id,ler,gravar)=>{
    const aplica=v=>{ gravar(Math.max(1,Math.min(30,v||1))); telaAssistente(box); };
    box.querySelectorAll(`[data-menos="${id}"]`).forEach(b=>b.onclick=()=>aplica(ler()-1));
    box.querySelectorAll(`[data-mais="${id}"]`).forEach(b=>b.onclick=()=>aplica(ler()+1));
    const el=$("#"+id); if(el) el.onchange=()=>aplica(parseInt(el.value,10));
  };

  let h=barra();

  if(A.passo==="prof"){
    h+=`<h2>Bem-vindo</h2>
      <p class="sub">Vamos montar o seu cadastro. Leva menos de dois minutos e
        pode ser corrigido depois, a qualquer momento.</p>
      <label>Como você se chama?</label>
      <input id="aProf" placeholder="Natanael Filho" value="${esc(A.prof)}">
      <p class="hint">Esse nome sai impresso no cabeçalho das provas.</p>
      <button class="btn" id="aSeg" style="margin-top:18px">Continuar</button>`;
    box.innerHTML=h;
    $("#aSeg").onclick=()=>{
      A.prof=$("#aProf").value.trim();
      if(!A.prof){ alert("Digite o seu nome para continuar."); return; }
      A.passo="qtdEscolas"; if(!A.escolas.length) A.escolas=[{nome:"",turmas:[novaTurmaAssist()]}];
      telaAssistente(box); };
    return;
  }

  if(A.passo==="qtdEscolas"){
    h+=`<h2>Escolas</h2>
      <p class="sub">Em quantas escolas você trabalha?</p>
      ${contador("aQE",A.escolas.length,1,20)}
      <p class="hint">Você cadastra o nome de cada uma na tela seguinte.</p>
      <div class="duo" style="margin-top:18px">
        <button class="btn gho" id="aVolta">Voltar</button>
        <button class="btn" id="aSeg">Continuar</button></div>`;
    box.innerHTML=h;
    ligarContador("aQE",()=>A.escolas.length,
      n=>ajustar(A.escolas,n,()=>({nome:"",turmas:[novaTurmaAssist()]})));
    $("#aVolta").onclick=()=>{A.passo="prof";telaAssistente(box);};
    $("#aSeg").onclick=()=>{A.passo="nomesEscolas";telaAssistente(box);};
    return;
  }

  if(A.passo==="nomesEscolas"){
    h+=`<h2>Nome das escolas</h2>
      <p class="sub">Escreva o nome como ele deve sair no cabeçalho da prova.</p>
      ${A.escolas.map((e,i)=>`<div class="lin"><span class="nu">${i+1}</span>
        <input data-esc="${i}" placeholder="Escola ${i+1}" value="${esc(e.nome)}"></div>`).join("")}
      <div class="duo" style="margin-top:18px">
        <button class="btn gho" id="aVolta">Voltar</button>
        <button class="btn" id="aSeg">Continuar</button></div>`;
    box.innerHTML=h;
    const sinc=()=>box.querySelectorAll("[data-esc]").forEach(el=>{
      A.escolas[+el.dataset.esc].nome=el.value.trim(); });
    box.querySelectorAll("[data-esc]").forEach(el=>el.oninput=sinc);
    $("#aVolta").onclick=()=>{sinc();A.passo="qtdEscolas";telaAssistente(box);};
    $("#aSeg").onclick=()=>{
      sinc();
      const vazia=A.escolas.findIndex(e=>!e.nome);
      if(vazia>=0){ alert("Falta o nome da escola "+(vazia+1)+"."); return; }
      A.iE=0; A.passo="qtdTurmas"; telaAssistente(box); };
    return;
  }

  if(A.passo==="qtdTurmas"){
    const e=escolaAtual();
    h+=`<div class="migalha"><span>Escola ${A.iE+1} de ${A.escolas.length}</span></div>
      <h2>${esc(e.nome)}</h2>
      <p class="sub">Quantas turmas você leciona nesta escola?</p>
      ${contador("aQT",e.turmas.length,1,30)}
      <p class="hint">Pode ser diferente em cada escola.</p>
      <div class="duo" style="margin-top:18px">
        <button class="btn gho" id="aVolta">Voltar</button>
        <button class="btn" id="aSeg">Continuar</button></div>`;
    box.innerHTML=h;
    ligarContador("aQT",()=>e.turmas.length,n=>ajustar(e.turmas,n,novaTurmaAssist));
    $("#aVolta").onclick=()=>{
      if(A.iE>0){ A.iE--; A.iT=escolaAtual().turmas.length-1; A.passo="turma"; }
      else A.passo="nomesEscolas";
      telaAssistente(box); };
    $("#aSeg").onclick=()=>{A.passo="nomesTurmas";telaAssistente(box);};
    return;
  }

  if(A.passo==="nomesTurmas"){
    const e=escolaAtual();
    h+=`<div class="migalha"><span>${esc(e.nome)}</span></div>
      <h2>Turmas desta escola</h2>
      <p class="sub">Use o nome que você usa no dia a dia — 6º Ano A, 3A, M3B.</p>
      ${e.turmas.map((t,i)=>`<div class="lin"><span class="nu">${i+1}</span>
        <input data-tur="${i}" placeholder="Turma ${i+1}" value="${esc(t.nome)}"></div>`).join("")}
      <div class="duo" style="margin-top:18px">
        <button class="btn gho" id="aVolta">Voltar</button>
        <button class="btn" id="aSeg">Continuar</button></div>`;
    box.innerHTML=h;
    const sinc=()=>box.querySelectorAll("[data-tur]").forEach(el=>{
      e.turmas[+el.dataset.tur].nome=el.value.trim(); });
    box.querySelectorAll("[data-tur]").forEach(el=>el.oninput=sinc);
    $("#aVolta").onclick=()=>{sinc();A.passo="qtdTurmas";telaAssistente(box);};
    $("#aSeg").onclick=()=>{
      sinc();
      const vazia=e.turmas.findIndex(t=>!t.nome);
      if(vazia>=0){ alert("Falta o nome da turma "+(vazia+1)+"."); return; }
      A.iT=0; A.passo="turma"; telaAssistente(box); };
    return;
  }

  if(A.passo==="turma"){
    const e=escolaAtual(), t=turmaAtual();
    h+=`<div class="migalha"><span>${esc(e.nome)}</span><span>·</span>
        <span>turma ${A.iT+1} de ${e.turmas.length}</span></div>
      <h2>${esc(t.nome)}</h2>
      <p class="sub">Quantas disciplinas você leciona nesta turma?</p>
      ${contador("aQD",t.disciplinas.length,1,10)}
      <div class="rot">Nome das disciplinas</div>
      ${t.disciplinas.map((d,i)=>`<div class="lin"><span class="nu">${i+1}</span>
        <input data-dis="${i}" placeholder="Disciplina ${i+1}" value="${esc(d)}"></div>`).join("")}
      <div class="rot">Como é organizado o período letivo desta turma?</div>
      <div class="esco">
        <button data-tipo="bimestre" class="${t.tipo==="bimestre"?"sel":""}">
          <div class="t">Bimestral</div><div class="s">4 bimestres no ano</div></button>
        <button data-tipo="trimestre" class="${t.tipo==="trimestre"?"sel":""}">
          <div class="t">Trimestral</div><div class="s">3 trimestres no ano</div></button>
      </div>
      <p class="hint">Vale só para esta turma. Outra turma, na mesma escola ou em
        outra, pode ter calendário diferente.</p>
      <label style="margin-top:16px">Série ou etapa (opcional)</label>
      <input id="aSerie" placeholder="6º ano, EJA Módulo 3…" value="${esc(t.serie)}">
      <div class="duo" style="margin-top:18px">
        <button class="btn gho" id="aVolta">Voltar</button>
        <button class="btn" id="aSeg">${
          (A.iT<e.turmas.length-1||A.iE<A.escolas.length-1)?"Próxima turma":"Ver o resumo"}</button></div>`;
    box.innerHTML=h;
    const sinc=()=>{
      box.querySelectorAll("[data-dis]").forEach(el=>{ t.disciplinas[+el.dataset.dis]=el.value.trim(); });
      const s=$("#aSerie"); if(s) t.serie=s.value.trim(); };
    box.querySelectorAll("[data-dis]").forEach(el=>el.oninput=sinc);
    $("#aSerie").oninput=sinc;
    ligarContador("aQD",()=>t.disciplinas.length,n=>{sinc();ajustar(t.disciplinas,n,()=>"");});
    box.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{
      sinc(); t.tipo=b.dataset.tipo; telaAssistente(box); });
    $("#aVolta").onclick=()=>{
      sinc();
      if(A.iT>0){ A.iT--; } else A.passo="nomesTurmas";
      telaAssistente(box); };
    $("#aSeg").onclick=()=>{
      sinc();
      const vazia=t.disciplinas.findIndex(d=>!d);
      if(vazia>=0){ alert("Falta o nome da disciplina "+(vazia+1)+"."); return; }
      if(A.iT<e.turmas.length-1){ A.iT++; }
      else if(A.iE<A.escolas.length-1){ A.iE++; A.iT=0; A.passo="qtdTurmas"; }
      else A.passo="resumo";
      telaAssistente(box); };
    return;
  }

  /* resumo */
  const nTurmas=A.escolas.reduce((n,e)=>n+e.turmas.length,0);
  h+=`<h2>Confira o cadastro</h2>
    <p class="sub">${A.escolas.length} escola${A.escolas.length===1?"":"s"} ·
      ${nTurmas} turma${nTurmas===1?"":"s"} · professor ${esc(A.prof)}</p>`;
  A.escolas.forEach((e,i)=>{
    h+=`<div class="grupo"><div class="esc"><span class="nm">${esc(e.nome)}</span>
      <span class="ln"></span></div>`;
    h+=e.turmas.map((t,j)=>`<button class="item" data-ir="${i}:${j}"><div class="cor">
      <div class="t1">${esc(t.nome)}</div>
      <div class="t2">${t.disciplinas.filter(Boolean).map(esc).join(" · ")} ·
        ${t.tipo==="trimestre"?"Trimestral":"Bimestral"}</div>
      </div><span class="ch">›</span></button>`).join("");
    h+="</div>";
  });
  h+=`<button class="btn" id="aFim" style="margin-top:8px">Concluir cadastro</button>
      <button class="btn gho" id="aVolta" style="margin-top:9px">Voltar</button>
      <p class="hint">Depois dá para acrescentar, renomear ou encerrar escolas,
        turmas e disciplinas em Configurações — sem perder nenhuma nota.</p>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{
    const [i,j]=b.dataset.ir.split(":").map(Number);
    A.iE=i; A.iT=j; A.passo="turma"; telaAssistente(box); });
  $("#aVolta").onclick=()=>{
    A.iE=A.escolas.length-1; A.iT=escolaAtual().turmas.length-1;
    A.passo="turma"; telaAssistente(box); };
  $("#aFim").onclick=()=>concluirAssistente();
}

function concluirAssistente(){
  const A=assist; if(!A) return;
  A.escolas.forEach(e=>{
    const idE=uid("e");
    E.escolas.push({id:idE,nome:e.nome,curto:apelidoEscola(e.nome),ativa:true});
    e.turmas.forEach(t=>{
      const discs=t.disciplinas.filter(Boolean).map(n=>({id:uid("d"),nome:n,ativa:true}));
      if(!discs.length) discs.push({id:uid("d"),nome:"Disciplina",ativa:true});
      E.turmas.push({id:uid("t"),escola:idE,nome:t.nome,serie:t.serie||"",
        disciplina:discs[0].nome, disciplinas:discs, alunos:[],
        periodo:{tipo:t.tipo,qtd:QTD_PADRAO[t.tipo]}, ativa:true});
    });
  });
  guarda.esc(NOME_PROF,A.prof);
  guarda.esc(SETUP_FEITO,"1");
  salvar();
  assist=null; casaNivel="turmas"; casaTurma=null; casaDisc=null;
  montarCasa(); pintarResultados(); pintarDesempenho();
  alert("Cadastro pronto. Agora escolha uma turma e cadastre os estudantes.");
}

/* ═══════════════════════════════════════════════════════════════════
   4c. CADASTRO EDITÁVEL — escolas, turmas, disciplinas, calendário
   Encerrar ≠ excluir. Excluir só é oferecido enquanto não houver
   nenhuma prova, nota ou estudante pendurado no cadastro.
   ═══════════════════════════════════════════════════════════════════ */
function telaCadastro(box){
  const escolas=escolasVisiveis();
  let h=`<div class="migalha"><button id="mVolta">‹ Voltar</button></div>
    <h2>Escolas, turmas e disciplinas</h2>
    <p class="sub">Mudou de escola, pegou uma turma nova, largou uma disciplina?
      Ajuste aqui. Nada do que já foi registrado se perde.</p>`;
  if(!escolas.length){
    h+='<div class="vazio"><b>Nenhuma escola cadastrada</b>Comece acrescentando a primeira.</div>';
  }else{
    h+=escolas.map(e=>{
      const ts=turmasVisiveis(e.id);
      const nd=ts.reduce((n,t)=>n+discVisiveis(t).length,0);
      return `<button class="item ${viva(e)?"":"arq"}" data-e="${e.id}"><div class="cor">
        <div class="t1">${esc(e.nome)}${viva(e)?"":" · encerrada"}</div>
        <div class="t2">${ts.length} turma${ts.length===1?"":"s"} ·
          ${nd} disciplina${nd===1?"":"s"}</div></div><span class="ch">›</span></button>`;
    }).join("");
  }
  h+=`<button class="btn sec" id="cAddE" style="margin-top:12px">Acrescentar escola</button>`;
  if(!E.turmas.length)
    h+=`<button class="btn gho" id="cAssist" style="margin-top:9px">Usar o assistente de cadastro</button>`;
  box.innerHTML=h;
  $("#mVolta").onclick=()=>{casaNivel=voltaPara.cadastro;montarCasa();};
  $("#cAddE").onclick=()=>{
    const nome=prompt("Nome da escola:"); if(!nome||!nome.trim()) return;
    const e={id:uid("e"),nome:nome.trim(),curto:apelidoEscola(nome),ativa:true};
    E.escolas.push(e); salvar(); casaEscola=e.id; casaNivel="escola"; montarCasa(); };
  if($("#cAssist")) $("#cAssist").onclick=()=>{assist=null;casaNivel="assistente";montarCasa();};
  box.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
    casaEscola=b.dataset.e; casaNivel="escola"; montarCasa(); });
}

function telaEscola(box){
  const e=escolaDe(casaEscola);
  if(!e){ casaNivel="cadastro"; return montarCasa(); }
  const ts=turmasVisiveis(e.id);
  const provas=ts.reduce((n,t)=>n+provasDaTurma(t.id).length,0);
  box.innerHTML=`<div class="migalha"><button id="mVolta">‹ Escolas</button></div>
    <h2>${esc(e.nome)}</h2>
    <p class="sub">${ts.length} turma${ts.length===1?"":"s"} ·
      ${provas} prova${provas===1?"":"s"} registrada${provas===1?"":"s"}</p>
    <label>Nome completo</label>
    <input id="eNome" value="${esc(e.nome)}">
    <label>Nome curto (aparece nas listas do app)</label>
    <input id="eCurto" value="${esc(e.curto||"")}" placeholder="${esc(apelidoEscola(e.nome))}">
    <button class="btn" id="eSalva" style="margin-top:14px">Salvar</button>
    <div class="rot">Turmas desta escola</div>
    ${ts.length?ts.map(t=>{
      const ds=discVisiveis(t);
      return `<button class="item ${viva(t)?"":"arq"}" data-t="${t.id}"><div class="cor">
        <div class="t1">${esc(t.nome)}${viva(t)?"":" · encerrada"}</div>
        <div class="t2">${ds.map(d=>esc(d.nome)).join(" · ")||"sem disciplina"} ·
          ${esc(nomeCalendario(t))}</div></div><span class="ch">›</span></button>`;
    }).join(""):'<p class="hint" style="margin:0 0 8px">Nenhuma turma ainda.</p>'}
    <button class="btn sec" id="eAddT">Acrescentar turma</button>
    <div class="rot">Situação</div>
    <button class="btn gho" id="eArq">${viva(e)?"Encerrar esta escola":"Reativar esta escola"}</button>
    <p class="hint">Encerrar tira a escola das listas de trabalho. As provas, notas e
      fechamentos continuam guardados e podem ser consultados a qualquer momento.</p>
    ${(!turmasDa(e.id).length)?'<button class="btn gho" id="eDel" style="margin-top:9px">Excluir escola</button>':""}`;
  $("#mVolta").onclick=()=>{casaNivel="cadastro";montarCasa();};
  $("#eSalva").onclick=()=>{
    const nome=$("#eNome").value.trim();
    if(!nome){ alert("A escola precisa de um nome."); return; }
    e.nome=nome; e.curto=$("#eCurto").value.trim()||apelidoEscola(nome);
    salvar(); refletirBarra(); montarCasa(); };
  $("#eAddT").onclick=()=>{
    const nome=prompt("Nome da turma (ex.: 6º Ano A):"); if(!nome||!nome.trim()) return;
    voltaPara.turma="escola";
    const t={id:uid("t"),escola:e.id,nome:nome.trim(),serie:"",
      disciplina:"",disciplinas:[],alunos:[],periodo:{tipo:"bimestre",qtd:4},ativa:true};
    E.turmas.push(t); salvar(); casaTurma=t.id; casaNivel="turma"; montarCasa(); };
  $("#eArq").onclick=()=>{
    e.ativa=!viva(e); salvar(); montarCasa(); };
  if($("#eDel")) $("#eDel").onclick=()=>{
    if(!confirm("Excluir a escola "+e.nome+"? Ela não tem nenhuma turma.")) return;
    E.escolas=E.escolas.filter(x=>x.id!==e.id); salvar();
    casaNivel="cadastro"; montarCasa(); };
  box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    voltaPara.turma="escola"; casaTurma=b.dataset.t; casaNivel="turma"; montarCasa(); });
}

function telaTurma(box){
  const t=turmaDe(casaTurma);
  if(!t){ casaNivel="cadastro"; return montarCasa(); }
  const e=escolaDe(t.escola)||{curto:"",id:null};
  const cal=calendario(t), ds=disciplinasDe(t);
  const nProvas=provasDaTurma(t.id).length;
  box.innerHTML=`<div class="migalha"><button id="mVolta">‹ ${esc(e.curto||"Escola")}</button></div>
    <h2>${esc(t.nome)}</h2>
    <p class="sub">${(t.alunos||[]).length} estudante${(t.alunos||[]).length===1?"":"s"} ·
      ${nProvas} prova${nProvas===1?"":"s"}</p>
    <label>Nome da turma</label>
    <input id="tNome" value="${esc(t.nome)}">
    <label>Série ou etapa</label>
    <input id="tSerie" value="${esc(t.serie||"")}" placeholder="6º ano, EJA Módulo 3…">
    <div class="rot">Organização do período letivo</div>
    <div class="esco">
      <button data-tipo="bimestre" class="${cal.tipo==="bimestre"?"sel":""}">
        <div class="t">Bimestral</div><div class="s">4 bimestres no ano</div></button>
      <button data-tipo="trimestre" class="${cal.tipo==="trimestre"?"sel":""}">
        <div class="t">Trimestral</div><div class="s">3 trimestres no ano</div></button>
    </div>
    <label style="margin-top:14px">Quantos períodos esta turma tem no ano</label>
    <select id="tQtd">${[2,3,4].map(n=>`<option value="${n}"${n===cal.qtd?" selected":""}>${n} ${
      cal.tipo==="trimestre"?"trimestres":"bimestres"}</option>`).join("")}</select>
    <p class="hint">O normal é 4 para bimestral e 3 para trimestral. Use 2 quando o
      módulo tiver só dois bimestres, como acontece na EJA.</p>
    <div class="rot">Disciplinas nesta turma</div>
    ${ds.length?ds.map((d,i)=>`<div class="lin">
        <input data-dn="${i}" value="${esc(d.nome)}" ${viva(d)?"":'class="arq"'}>
        <button class="tag${viva(d)?"":" ok"}" data-dtog="${i}">${viva(d)?"encerrar":"reativar"}</button>
        ${temHistorico(t.id,d.id)?"":`<button data-ddel="${i}" title="excluir">✕</button>`}
      </div>`).join(""):'<p class="hint" style="margin:0 0 8px">Nenhuma disciplina cadastrada.</p>'}
    <button class="btn sec" id="tAddD" style="margin-top:6px">Acrescentar disciplina</button>
    <p class="hint">Encerrar uma disciplina só a tira das listas de criação de prova.
      As provas e notas dela continuam no histórico da turma.</p>
    <button class="btn" id="tSalva" style="margin-top:16px">Salvar alterações</button>
    <div class="rot">Situação</div>
    <button class="btn gho" id="tArq">${viva(t)?"Encerrar esta turma":"Reativar esta turma"}</button>
    ${(!nProvas&&!(t.alunos||[]).length)

    <p class="hint">Se você deixar de lecionar nesta turma, encerre — assim as notas

/* Extrai o texto de um PDF no próprio aparelho, preservando as linhas.
   Serve tanto para a prova quanto para a lista de estudantes. */
let workerPdfPronto=null;

/* O pdf.js cria o worker a partir de uma URL. Offline, se essa URL não
   estiver guardada, ele falha com "Setting up fake worker failed".
   Buscar o arquivo antes e transformá-lo em blob resolve: o worker passa
   a nascer de bytes que já temos na mão. */
async function prepararWorkerPdf(){
  if(workerPdfPronto) return workerPdfPronto;
  workerPdfPronto=(async()=>{
    try{
      const r=await fetch("pdf.worker.min.js");
      if(!r.ok) throw new Error("HTTP "+r.status);
      const b=await r.blob();
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b);
      return true;
    }catch(e){
      console.warn("worker do pdf via blob falhou, usando o caminho direto",e);
      pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
      return false;
    }
  })();
  return workerPdfPronto;
}

async function abrirPdf(arquivo){
  if(typeof pdfjsLib==="undefined") throw new Error("faltou o arquivo pdf.min.js");
  await prepararWorkerPdf();
  const dados=new Uint8Array(await arquivo.arrayBuffer());
  const limite=new Promise((_,rej)=>setTimeout(()=>rej(new Error(
    "a leitura do PDF não respondeu — confira se o arquivo pdf.worker.min.js "+
    "foi enviado junto com o app")),25000));
  /* Sem os arquivos de fonte padrão, um PDF que não embute suas fontes
     é renderizado SEM TEXTO — e as tabelas sairiam recortadas vazias. */
  return await Promise.race([pdfjsLib.getDocument({
    data:dados,
    standardFontDataUrl:"standard_fonts/",
    useSystemFonts:false
  }).promise, limite]);
}

/* Texto e figuras, página a página.

   As figuras não são procuradas como imagens embutidas: muitos PDFs
   desenham gráficos em vetor, sem imagem nenhuma. Em vez disso o app
   procura VÃOS grandes entre linhas de texto — é ali que a figura está —,
   renderiza a página e recorta a faixa. Funciona nos dois casos. */
const VAO_MINIMO = 45;     // pontos de espaço vertical que denunciam uma figura
const ESCALA_FIG = 2;      // resolução do recorte
const FOLGA_FIG = 5;       // afasta o recorte das linhas de texto vizinhas

async function conteudoDePdf(arquivo){
  const doc=await abrirPdf(arquivo);
  const paginas=[], figuras=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const c=await pg.getTextContent();

    // agrupa os pedaços em linhas, guardando altura para medir os vãos
    const linhas=[];
    c.items.forEach(it=>{
      const y=it.transform[5], h=it.height||10;
      const u=linhas[linhas.length-1];
      if(u && Math.abs(u.y-y)<=3){ u.txt+=it.str; u.h=Math.max(u.h,h); }
      else linhas.push({y, h, txt:it.str});
    });

    const bandas=[];

    // 1) vãos grandes = gráfico, esquema ou desenho
    for(let k=0;k<linhas.length-1;k++){
      const vao=linhas[k].y-(linhas[k+1].y+linhas[k+1].h);
      if(vao>=VAO_MINIMO)
        bandas.push({tipo:"figura", depois:k, engole:[],
          de:linhas[k+1].y+linhas[k+1].h+FOLGA_FIG,
          ate:linhas[k].y-FOLGA_FIG});
    }

    // 2) blocos de linhas tabulares = tabela; vira imagem, com as bordas
    let k=0;
    while(k<linhas.length){
      if(!pareceTabela(linhas[k].txt)){ k++; continue; }
      let fim=k;
      while(fim+1<linhas.length && pareceTabela(linhas[fim+1].txt)) fim++;
      if(fim>k){                                   // pelo menos duas linhas
        let ini=k;
        // puxa o cabeçalho da tabela, que costuma não ter números
        if(ini>0){
          const acima=String(linhas[ini-1].txt).trim();
          if(acima.split(/\s+/).length<=6 && acima.length<=60 && !/[:.]$/.test(acima)) ini--;
        }
        bandas.push({tipo:"tabela", depois:ini-1, engole:[ini,fim],
          de:linhas[fim].y-linhas[fim].h*0.4-FOLGA_FIG,
          ate:linhas[ini].y+linhas[ini].h+FOLGA_FIG});
      }
      k=fim+1;
    }

    let recortes=[];
    if(bandas.length) recortes=await recortarFiguras(pg, bandas);

    const engolidas=new Set();
    bandas.forEach((b,j)=>{ if(recortes[j] && b.engole.length)
      for(let x=b.engole[0];x<=b.engole[1];x++) engolidas.add(x); });

    // monta as linhas de texto intercalando a marca da figura no lugar certo
    const saida=[];
    bandas.forEach((b,j)=>{ if(b.depois<0 && recortes[j]){
      figuras.push(recortes[j]); saida.push(MARCA_FIG+(figuras.length-1)); }});
    linhas.forEach((L,idx)=>{
      const t=String(L.txt).trim();
      if(t && !engolidas.has(idx)) saida.push(t);
      bandas.forEach((b,j)=>{
        if(b.depois===idx && recortes[j]){
          figuras.push(recortes[j]);
          saida.push(MARCA_FIG+(figuras.length-1));
        }
      });
    });
    paginas.push({linhas:saida, imagens:[]});
  }
  return {paginas, figuras};
}

async function recortarFiguras(pg, bandas){
  const saida=[];
  try{
    const vp=pg.getViewport({scale:ESCALA_FIG});
    const cv=document.createElement("canvas");
    cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
    const cx=cv.getContext("2d");
    cx.fillStyle="#ffffff"; cx.fillRect(0,0,cv.width,cv.height);
    const tarefa=pg.render({canvasContext:cx, viewport:vp});
    const ok=await comLimite(tarefa.promise.then(()=>true), 20000, false);
    if(!ok) return saida;
    const alturaPdf=vp.viewBox[3];
    bandas.forEach(b=>{
      const yTopo=Math.max(0, Math.floor((alturaPdf-b.ate)*ESCALA_FIG));
      const yBase=Math.min(cv.height, Math.ceil((alturaPdf-b.de)*ESCALA_FIG));
      if(yBase-yTopo<20){ saida.push(null); return; }
      const faixa=document.createElement("canvas");
      faixa.width=cv.width; faixa.height=yBase-yTopo;
      faixa.getContext("2d").drawImage(cv,0,yTopo,cv.width,faixa.height,0,0,cv.width,faixa.height);
      saida.push(apararBranco(faixa));
    });
  }catch(e){ console.warn("recorte de figura falhou",e); }
  return saida;
}

/* Corta o branco em volta e devolve no formato que o gerador usa. */
function apararBranco(cv){
  const cx=cv.getContext("2d"), w=cv.width, h=cv.height;
  let d;
  try{ d=cx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(d[i]<245 || d[i+1]<245 || d[i+2]<245){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  if(x1<0 || (x1-x0)<40 || (y1-y0)<18) return null;   // vão em branco de verdade
  const m=6;
  x0=Math.max(0,x0-m); y0=Math.max(0,y0-m);
  x1=Math.min(w-1,x1+m); y1=Math.min(h-1,y1+m);
  let lw=x1-x0+1, lh=y1-y0+1;
  const esc=Math.min(1, 900/Math.max(lw,lh));
  const out=document.createElement("canvas");
  out.width=Math.round(lw*esc); out.height=Math.round(lh*esc);
  const ox=out.getContext("2d");
  ox.fillStyle="#ffffff"; ox.fillRect(0,0,out.width,out.height);
  ox.drawImage(cv,x0,y0,lw,lh,0,0,out.width,out.height);
  try{ return {dados:out.toDataURL("image/jpeg",0.8), w:out.width, h:out.height}; }
  catch(e){ return null; }
}

function comLimite(promessa, ms, padrao){
  return Promise.race([promessa, new Promise(r=>setTimeout(()=>r(padrao), ms))]);
}

async function textoDePdf(arquivo){
  const {paginas}=await conteudoDePdf(arquivo);
  return paginas.map(p=>p.linhas.join("\n"))
    .join("\n").replace(new RegExp(MARCA_FIG+"\\d+","g"),"");
}

async function textoDeDocx(arquivo){
  if(typeof mammoth==="undefined") throw new Error("faltou o arquivo mammoth.browser.min.js");
  const buf=await arquivo.arrayBuffer();
  return (await mammoth.extractRawText({arrayBuffer:buf})).value||"";
}

async function lerDocx(f,p){
  const info=t=>{ const el=$("#iaInfo"); if(el) el.innerHTML=t; };
  if(typeof mammoth==="undefined"){
    info('<div class="aviso" style="margin-top:10px">Faltou o arquivo mammoth.browser.min.js. Envie-o para o GitHub.</div>');
    return; }
  info('<div class="diag" style="margin-top:10px">Abrindo o documento…</div>');
  try{
    const buf=await f.arrayBuffer();
    const txt=(await mammoth.extractRawText({arrayBuffer:buf})).value||"";
    let html="";
    try{ html=(await mammoth.convertToHtml({arrayBuffer:buf})).value||""; }catch(e){}
    iaImagens=[...html.matchAll(/<img[^>]+src="(data:image\/[^;]+;base64,[^"]+)"/g)].map(m=>m[1]);
    iaTextoDoc=txt;
    info(`<div class="diag" style="margin-top:10px"><b>${esc(f.name)}</b>
      ${txt.split(/\r?\n/).filter(l=>l.trim()).length} linhas de texto e
      ${iaImagens.length} imagem${iaImagens.length===1?"":"ns"} · lido no próprio aparelho</div>`);
    pintarPreDoc(p);
  }catch(e){
    info(`<div class="aviso" style="margin-top:10px">Não consegui abrir o Word: ${esc(e.message)}</div>`);
  }
}

/* Cada gráfico pertence à questão que fala em gráfico/figura naquela
   página. Se nenhuma falar, vai para a primeira questão da página. */
function casarFiguras(questoes, figuras){
  (questoes||[]).forEach(q=>{
    if(q.figIdx!=null && figuras && figuras[q.figIdx]) q.imagem=figuras[q.figIdx];
  });
  return questoes;
}

function textoComPaginas(paginas){
  return paginas.map((p,i)=>MARCA_PAG+i+"\n"+p.linhas.join("\n")).join("\n");
}

/* PDF de texto (como os gerados por computador) também pode ser lido de
   graça aqui. PDF que é só imagem escaneada não devolve texto — aí a IA
   ou o chat continuam sendo o caminho. */
async function lerPdfProva(f,p){
  const info=t=>{ const el=$("#iaInfo"); if(el) el.innerHTML=t; };
  try{
    const {paginas:brutas, figuras}=await conteudoDePdf(f);
    const pags=limparRuidoProva(brutas);
    const util=pags.reduce((n,x)=>n+x.linhas.length,0);
    const nImgs=figuras.length;
    iaFiguras=figuras;
    if(util<3){
      info(`<div class="diag" style="margin-top:10px"><b>${esc(f.name)}</b>
        PDF sem texto — parece digitalizado. Use a leitura pela Claude abaixo.</div>`);
      return; }
    iaTextoDoc=textoComPaginas(pags);
    iaImagens=figuras.map(im=>im.dados);
    info(`<div class="diag" style="margin-top:10px"><b>${esc(f.name)}</b>
      ${util} linhas de texto${nImgs?" e "+nImgs+" gráfico"+(nImgs===1?"":"s"):""}
      · lido no próprio aparelho</div>`);
    pintarPreDoc(p);
  }catch(e){
    console.warn("PDF sem texto extraível",e);
    const semWorker=/worker|load script/i.test(String(e.message||""));
    info(`<div class="aviso" style="margin-top:10px">Não consegui ler o PDF: ${esc(e.message)}
      ${semWorker?"<br><br><b>O que fazer:</b> conecte-se à internet uma vez, abra "+
        "Configurações e toque em “Verificar uso offline”. Isso baixa a peça que faltou.":""}</div>`);
  }
}

/* Um .docx já vem em texto. Se ele estiver no formato de prova, dá para
   montar as questões sem IA nenhuma — de graça e na hora. */
function pintarPreDoc(p){
  const box=$("#iaPreDoc"); if(!box) return;
  if(!iaTextoDoc){ box.innerHTML=""; return; }
  const achadas=lerQuestoes(iaTextoDoc);
  const bate=p?(achadas.questoes.length===p.nq):(achadas.questoes.length>=5);
  box.innerHTML=`<div class="rot">Caminho 0 — sem IA, direto do arquivo</div>
    <div class="${bate?"diag":"aviso"}">
      ${bate?`<b>Encontrei ${achadas.questoes.length} questões</b>Dá para usar sem gastar nada.`
            :(p?`Reconheci <b>${achadas.questoes.length}</b> questões no texto, e a prova tem
               <b>${p.nq}</b>. Você pode usar assim mesmo e ajustar, ou mandar para a IA abaixo.`
               :`Reconheci só <b>${achadas.questoes.length}</b> questões — o documento pode não
                 estar no formato numerado. Tente a leitura por IA abaixo.`)}
    </div>
    <button class="btn${bate?"":" gho"}" id="bDireto" style="margin-top:9px">Usar o texto do arquivo</button>
    ${iaImagens.length?`<p class="hint">${iaImagens.length===1?"A imagem encontrada no documento fica guardada"
      :"As "+iaImagens.length+" imagens do documento ficam guardadas"}
      para você anexar em “Figuras das questões”.</p>`:""}`;
  // entrega o texto JÁ normalizado: o que aparece no editor é o que será salvo
  $("#bDireto").onclick=()=>{

    if(iaFiguras) casarFiguras(achadas.questoes, iaFiguras);

    const no=p?p.no:Math.max(4,Math.min(5,
      achadas.questoes.reduce((m,q)=>Math.max(m,(q.alternativas||[]).length),5)));
    entregarLeitura(questoesParaTexto(achadas.questoes)||iaTextoDoc, p, no); };
}

function extrairJson(txt){
  let t=String(txt||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const i=t.indexOf("{"), j=t.lastIndexOf("}");
  if(i<0||j<i) throw new Error("não encontrei um JSON na resposta");
  return JSON.parse(t.slice(i,j+1));
}
function jsonParaTexto(dados,no){
  const qs=(dados.questoes||dados||[]);
  if(!Array.isArray(qs)||!qs.length) throw new Error("o JSON não trouxe questões");
  return qs.map((q,i)=>{
    const alts=(q.alternativas||[]).slice(0,no).map((a,k)=>
      ((q.correta===k)?"*":"")+"ABCDE"[k]+") "+String(a).trim());
    return (i+1)+". "+String(q.enunciado||"").trim()+(alts.length?"\n"+alts.join("\n"):"");
  }).join("\n\n");
}
function aplicarJson(txt,p){
  try{
    const dados=extrairJson(txt);
    const no=p?p.no:alternativasDe(dados);
    entregarLeitura(jsonParaTexto(dados,no),p,no);
  }catch(e){
    $("#iaErro").innerHTML=`<div class="aviso" style="margin-top:10px">Não consegui usar: ${esc(e.message)}</div>`;
  }
}

let iaTextoPara=null;  // para QUAL prova ele foi lido ("novo" = cadastro em criação)
function descartarLeitura(){
  iaTexto=null; iaTextoPara=null; iaArquivo=null; iaTextoDoc=null;
  iaImagens=[]; iaFiguras=null;

const alternativasDe=d=>{
  const qs=(d&&d.questoes)||d||[];
  const m=(qs||[]).reduce((x,q)=>Math.max(x,((q.alternativas)||[]).length),0);
  return m>=5?5:(m>=4?4:5);
};

/* Se já existe prova, o texto vai para a revisão dela. Se não existe,
   vai para o cadastro com número de questões, alternativas e gabarito
   já preenchidos pela leitura — que é o caminho de quem começa do arquivo. */
function entregarLeitura(texto,p,no){
  iaTexto=texto; iaTextoPara=p?p.id:"novo";
  if(p && !substituindo){ casaNivel="questoes"; montarCasa(); return; }

  casaForm={codigo:velha?velha.codigo:"", titulo:velha?velha.titulo:"",
    nq:Math.max(5,Math.min(30,lidas.questoes.length||10)),
    no:no||5, gab:lidas.gabarito.indexOf("?")<0?lidas.gabarito:"",
    habs:velha?(velha.habs||[]).join("\n"):"",
    po:velha?pontosObj(velha):10, pd:velha?pontosDisc(velha):0,
    per:velha?(velha.periodo||1):ultimoPeriodo, vindoDeArquivo:true,
    substitui:substituindo||null};
  iaTextoPara="novo";
  casaNivel="nova"; montarCasa();
}

  st.innerHTML='<div class="diag" style="margin-top:10px">Enviando para a Claude…</div>';

  const bloco = iaTextoDoc

        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:lerModelo(),max_tokens:8000,

  }

/* ── figuras: uma por questão, comprimidas antes de guardar ─────── */
const FIG_LADO=760, FIG_QUALIDADE=0.72;

function comprimirImagem(arquivo){
  return new Promise((ok,erro)=>{
    const url=URL.createObjectURL(arquivo), im=new Image();
    im.onload=()=>{
      const e=Math.min(1,FIG_LADO/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*e));
      c.height=Math.max(1,Math.round(im.height*e));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ ok({dados:c.toDataURL("image/jpeg",FIG_QUALIDADE),w:c.width,h:c.height}); }
      catch(x){ erro(new Error("não consegui converter a imagem")); }
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); erro(new Error("arquivo de imagem inválido")); };
    im.src=url;
  });
}

/* ── discursivas: ficam fora do cartão, com nota digitada ───────── */
function lerDiscursivas(txt){
  const out=[]; let atual=null;
  String(txt).split(/\r?\n/).forEach(l=>{
    const t=l.trim(); if(!t){ return; }
    const m=/^(\d{1,2})\s*[.)\-–]\s*(.*)$/.exec(t);
    if(m){ atual={enunciado:m[2].trim(),pontos:null,linhas:4}; out.push(atual); return; }
    const mp=/^\[(\d+(?:[.,]\d+)?)\s*(?:pt|pts|pontos?)?\s*(?:,\s*(\d+)\s*linhas?)?\]$/i.exec(t);
    if(mp && atual){ atual.pontos=parseFloat(mp[1].replace(",","."));
      if(mp[2]) atual.linhas=parseInt(mp[2],10); return; }
    if(atual) atual.enunciado+=" "+t;
    else out.push(atual={enunciado:t,pontos:null,linhas:4});
  });
  return out;
}
function discursivasParaTexto(ds){
  return (ds||[]).map((q,i)=>(i+1)+". "+q.enunciado+
    "\n["+(q.pontos!=null?q.pontos:"")+" pt, "+(q.linhas||4)+" linhas]").join("\n\n");
}

/* ── diagnóstico do uso sem internet ────────────────────────────── */
let ultimaConferencia=null;

function montarOffline(){
  const c=$("#offEstado"); if(!c) return;
  if(!("serviceWorker" in navigator)){
    c.innerHTML='<div class="aviso">Este navegador não guarda o app para uso offline.</div>'; return; }
  const r=ultimaConferencia;
  if(!r){ c.innerHTML='<p class="hint" style="margin-top:0">Toque em verificar para conferir '+
    'se todas as peças do app estão guardadas no aparelho.</p>'; return; }
  if(!r.faltando.length){
    c.innerHTML=`<div class="diag"><b>Tudo guardado</b>${r.total} arquivos no aparelho
      (${esc(r.versao||"")}). O app abre e funciona sem internet.</div>`;
    return; }
  const abre=!r.faltando.some(f=>/index\.html|layout|embaralho|gerador|fonte\.js|jsqr|jspdf|qrcode|\.\/$/.test(f));
  c.innerHTML=`<div class="aviso"><b>${r.faltando.length} de ${r.total} não foram guardados</b>
    ${abre?"O app <b>abre</b> sem internet; o que falta afeta só a leitura de prova por arquivo."
          :"Faltam peças essenciais — o app pode não abrir sem internet."}<br><br>
    ${r.faltando.map(f=>esc(f.replace("./",""))).join(", ")}<br><br>
    ${navigator.onLine?"Toque em verificar de novo para baixar o que falta."
      :"Conecte-se à internet e toque em verificar."}</div>`;
}

function verificarOffline(){
  const c=$("#offEstado");
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller){
    if(c) c.innerHTML='<div class="aviso">O app ainda não foi guardado. '+
      'Conecte-se à internet, recarregue a página e tente de novo.</div>';
    return; }
  if(c) c.innerHTML='<div class="diag">Conferindo…</div>';
  navigator.serviceWorker.controller.postMessage(navigator.onLine?"completar":"conferir");
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", ev=>{
    const d=ev.data||{};
    if(d.tipo==="conferencia"){ ultimaConferencia=d; montarOffline(); }
    if(d.tipo==="extras" && d.falhas && d.falhas.length){
      console.warn("[sw] extras que faltaram:", d.falhas);
      avisoFlutuante('<b>Uso offline incompleto</b>'+d.falhas.length+
        ' arquivo(s) não foram baixados. O app abre sem internet, mas ler prova '+
        'de PDF ou Word pode falhar. Configurações › Verificar uso offline.',"aviso",9);
    }
  });
}

const ULTIMO_BACKUP="dbm_ultimo_backup";

function resumoDados(){
  const turmas=(E.turmas||[]).filter(t=>(t.alunos||[]).length).length;
  const alunos=(E.turmas||[]).reduce((n,t)=>n+(t.alunos||[]).length,0);
  const figuras=(E.provas||[]).reduce((n,p)=>n+((p.questoes||[]).filter(q=>q.imagem).length),0);
  return {turmas, alunos, provas:(E.provas||[]).length,
          notas:(E.res||[]).length, figuras,
          kb:Math.round(espacoUsado()/1024)};
}

function montarBackup(){
  const c=$("#bkResumo"); if(!c) return;
  const r=resumoDados();
  const q=guarda.ler(ULTIMO_BACKUP);
  const dias=q?Math.floor((Date.now()-Number(q))/86400000):null;
  const alerta=(r.notas>0 && (dias===null || dias>=30));
  c.innerHTML=`<div class="${alerta?"aviso":"diag"}">
    ${alerta?"<b>Sem cópia recente</b>":"<b>Seus dados</b>"}
    ${r.turmas} turma${r.turmas===1?"":"s"} com estudantes · ${r.alunos} estudantes ·
    ${r.provas} prova${r.provas===1?"":"s"} · ${r.notas} nota${r.notas===1?"":"s"} ·
    ${r.figuras} figura${r.figuras===1?"":"s"} · ${r.kb} KB<br>
    ${q?("Última cópia: "+new Date(Number(q)).toLocaleDateString("pt-BR")+
        (dias?" ("+dias+" dia"+(dias===1?"":"s")+" atrás)":" (hoje)"))
      :"Nenhuma cópia baixada até agora."}</div>`;
}

function baixarBackup(){
  const pacote={
    formato:"desbugando-omr",
    versao:E.v||8,
    gerado:new Date().toISOString(),
    professor:lerProfessor(),
    dados:E                      // a chave de API fica de fora, de propósito
  };
  const hoje=new Date().toISOString().slice(0,10);
  baixar(JSON.stringify(pacote), "backup_provas_"+hoje+".json", "application/json");
  guarda.esc(ULTIMO_BACKUP, String(Date.now()));
  montarBackup();
}

function validarBackup(txt){
  const d=JSON.parse(txt);
  const E2=d && (d.dados||d);
  if(!E2 || !Array.isArray(E2.turmas) || !Array.isArray(E2.provas))
    throw new Error("este arquivo não é uma cópia do app");
  return migrarV6(E2);        // cópias antigas ganham a lista de disciplinas
}

/* Juntar preserva o que existe aqui e acrescenta o que veio de fora.
   Em conflito de nota, vence a mais recente. */
function juntarBackup(E2){
  const porId=(lista,novos)=>{
    const mapa={}; lista.forEach(x=>mapa[x.id]=x);
    (novos||[]).forEach(x=>{ if(!mapa[x.id]) lista.push(x); });
    return lista;
  };
  porId(E.escolas, E2.escolas);
  const trocaTurma={}, trocaDisc={};       // id de fora -> id daqui
  (E2.turmas||[]).forEach(t2=>{
    const t=E.turmas.find(x=>x.id===t2.id || x.nome===t2.nome);
    if(!t){ E.turmas.push(t2); return; }
    trocaTurma[t2.id]=t.id;
    (t2.alunos||[]).forEach(a2=>{
      if(!t.alunos.some(a=>a.numero===a2.numero)) t.alunos.push(a2); });
    t.alunos.sort((a,b)=>ordNum(a.numero,b.numero));
    if(!t.periodo && t2.periodo) t.periodo=t2.periodo;
    /* disciplina que já existe aqui (mesmo id ou mesmo nome) não duplica —
       as provas que vieram de fora passam a apontar para a daqui */
    t.disciplinas=disciplinasDe(t);
    (t2.disciplinas||[]).forEach(d2=>{
      const igual=t.disciplinas.find(d=>d.id===d2.id ||
        String(d.nome).toLowerCase()===String(d2.nome).toLowerCase());
      if(igual) trocaDisc[d2.id]=igual.id;
      else { t.disciplinas.push(d2); trocaDisc[d2.id]=d2.id; }
    });
  });
  (E2.provas||[]).forEach(p2=>{
    if(trocaTurma[p2.turma]) p2.turma=trocaTurma[p2.turma];
    if(trocaDisc[p2.disciplina]) p2.disciplina=trocaDisc[p2.disciplina];
  });
  porId(E.provas, E2.provas);
  if(!Array.isArray(E.simulados)) E.simulados=[];
  (E2.simulados||[]).forEach(s2=>{ if(trocaTurma[s2.turma]) s2.turma=trocaTurma[s2.turma]; });
  porId(E.simulados, E2.simulados);
  E.descritores=E.descritores||{LP:{},MAT:{}};
  COMPONENTES.forEach(c=>{
    const de=(E2.descritores||{})[c.id]||{};
    E.descritores[c.id]=Object.assign({},de,E.descritores[c.id]||{});
  });
  (E2.res||[]).forEach(r2=>{
    const i=E.res.findIndex(r=>chave(r)===chave(r2));
    if(i<0) E.res.push(r2);
    else if((r2.t||0)>(E.res[i].t||0)) E.res[i]=r2;
  });
}

/* Cabeçalho e rodapé se repetem em todas as páginas; linhas de
   habilidade e numeração de página não fazem parte da questão. */
function limparRuidoProva(paginas){
  /* Só as bordas da página podem ser cabeçalho ou rodapé. Olhar o miolo
     apagaria alternativas parecidas entre si — "A) f(x) = 3x + 6" e
     "A) f(x) = 5x + 4" viram a mesma coisa depois de trocar os números. */
  const BORDA=2;
  const conta={};
  paginas.forEach(p=>{
    const bordas=[...p.linhas.slice(0,BORDA), ...p.linhas.slice(-BORDA)];
    new Set(bordas).forEach(l=>{
      const chave=l.replace(/\d+/g,"#").trim();
      conta[chave]=(conta[chave]||0)+1;
    });
  });
  const minimo=Math.max(2,Math.ceil(paginas.length*0.6));
  const repetida=(l,i,total)=>{
    if(i>=BORDA && i<total-BORDA) return false;
    const chave=l.replace(/\d+/g,"#").trim();
    return chave.length>12 && conta[chave]>=minimo;
  };
  const lixo=[
    /^\s*habilidade\b/i,
    /^\s*p[áa]gina\s*\d+\s*$/i,
    /^\s*\d+\s*$/,
    /^\s*coment[áa]rios?\s+das\s+respostas/i
  ];
  return paginas.map(p=>({
    imagens:p.imagens,
    linhas:p.linhas.filter((l,i,arr)=>{
      if(repetida(l,i,arr.length)) return false;
      return !lixo.some(re=>re.test(l));
    })
  }));
}

/* Linhas de tabela (muitos números soltos) precisam continuar em
   linhas próprias, senão viram uma frase ilegível. */
function pareceTabela(l){
  const t=String(l).trim();
  if(!t) return false;
  // alternativa ou enunciado numerado nunca é linha de tabela —
  // "A) R$ 12,00" e "A) 20%" enganavam a regra e sumiam da prova
  if(/^\*?\s*[A-Ea-e]\s*[).\-–]\s/.test(t)) return false;
  if(/^\d{1,2}\s*[.)\-–]\s/.test(t)) return false;
  const toks=t.split(/\s+/);
  const nums=toks.filter(x=>/^-?[\d.,]+%?$/.test(x)).length;
  // linha com vários números soltos: "Tempo (h) 1 2 3 4"
  if(toks.length>=3 && nums>=3 && nums/toks.length>=0.4) return true;
  // linha curta terminando em número: "Ônibus 80", "A pé 60"
  if(toks.length<=4 && nums>=1 && /[\d]$|[\d]%$/.test(t) && t.length<=28) return true;
  return false;
}

/* Muitas provas trazem o gabarito no fim, em bloco. Ele precisa ser
   separado ANTES de ler as questões: senão "01. B  02. C" vira questão. */
function separarGabarito(txt){
  const linhas=String(txt).split(/\r?\n/);
  const marca=/^\s*(gabarito|respostas?|chave\s+de\s+respostas?|folha\s+de\s+respostas?)\s*:?\s*$/i;
  let i=linhas.findIndex(l=>marca.test(l));
  if(i<0){                                   // às vezes vem com texto na mesma linha
    i=linhas.findIndex(l=>/^\s*(gabarito|respostas)\b/i.test(l) &&
      /\d{1,2}\s*[).:\-–]?\s*[A-Ea-e]\b/.test(l));
  }
  if(i<0) return {corpo:txt, chave:null};
  const bloco=linhas.slice(i);
  const chave={};

  // formato de tabela: uma linha com os números, outra com as letras
  for(let k=0;k<bloco.length-1;k++){
    const a=bloco[k].trim(), b=bloco[k+1].trim();
    if(!/^(quest[ãa]o|item|n[ºo°]?)\b/i.test(a)) continue;
    if(!/^(resposta|gabarito|alternativa)/i.test(b)) continue;
    const nums=(a.match(/\d{1,2}/g)||[]).map(Number);
    const letras=(b.match(/\b[A-Ea-e]\b/g)||[]).map(x=>x.toUpperCase());
    if(nums.length && nums.length===letras.length){
      nums.forEach((n,idx)=>chave[n]=letras[idx]);
      break;
    }
  }

  // formato em lista: 01. B  /  1) C  /  1-B
  if(!Object.keys(chave).length){
    const re=/(\d{1,2})\s*[).:\-–]?\s*([A-Ea-e])(?![A-Za-zÀ-ÿ0-9])/g;
    let m; while((m=re.exec(bloco.join("\n")))) if(chave[+m[1]]==null) chave[+m[1]]=m[2].toUpperCase();
  }
  if(!Object.keys(chave).length) return {corpo:txt, chave:null};
  return {corpo:linhas.slice(0,i).join("\n"), chave};
}

/* Marca de página invisível ao professor, usada só para casar figuras. */
const MARCA_PAG="\u0001PAG";
const MARCA_FIG="\u0001FIG";

/* ── parágrafos do enunciado ───────────────────────────────────────
   No Word, o parágrafo vem separado por linha em branco. No PDF não há
   nenhuma marca: as linhas são só quebras de largura. O que denuncia um
   parágrafo ali é a linha CURTA — quem termina antes da margem terminou
   por vontade do autor, não por falta de espaço. É isso que separa o
   texto de apoio, a fonte e o comando da questão, que antes vinham
   grudados num bloco só. */
/* Largura aproximada em "ems": contar caracteres trata "iiiii" e "MMMMM"
   como iguais, e é isso que fazia uma linha cheia passar por curta. */
const LARGURA_CHAR=(()=>{
  const fino="iltfjr.,;:!|'’‘\"()[]{} ", largo="mwMWQ@%—–";
  return c=>{
    if(fino.indexOf(c)>=0) return 0.45;
    if(largo.indexOf(c)>=0) return 1.35;
    if(c>="A"&&c<="Z") return 1.1;
    return 0.85;
  };
})();
const larguraTexto=t=>{
  let w=0; const s=String(t);
  for(let i=0;i<s.length;i++) w+=LARGURA_CHAR(s.charAt(i));
  return w;
};

function montarParagrafos(linhas, cheiaDoc){
  const ls=(linhas||[]).map(x=>typeof x==="string"?{txt:x,duro:false}:x)
    .filter(x=>String(x.txt).trim());
  if(!ls.length) return "";
  /* a largura de referência vem do documento inteiro, não da questão:
     uma questão curta pode não ter nenhuma linha cheia, e aí qualquer
     linha pareceria "curta" e viraria parágrafo */
  const cheia=cheiaDoc||Math.max.apply(null, ls.map(x=>larguraTexto(x.txt)));
  /* A pergunta certa não é "esta linha é curta?", e sim "por que ela
     terminou aqui?". Se a primeira palavra da linha seguinte ainda
     caberia, a quebra foi do autor — é parágrafo. Se não caberia, foi a
     margem que quebrou, e o texto continua. Medir por proporção do
     comprimento erra justamente nas linhas quase cheias. */
  const FOLGA=1.6;                     // sobra para o erro da estimativa
  /* Duas condições, não uma. A largura diz que ainda cabia mais uma
     palavra; o texto tem de concordar: parágrafo não termina em vírgula
     nem continua com letra minúscula. Só com a largura, uma linha que
     acabava em "…ela é inevitável," e seguia com "e nada que…" virava
     parágrafo novo no meio da frase. */
  const fechaFrase=t=>/[.!?…:;”"’)\]]\s*$/.test(t);
  const abreFrase=t=>/^["“'‘(\[\-–—]?[A-ZÀ-Ý0-9]/.test(String(t).trim());
  const voluntaria=(atualTxt,proxTxt)=>{
    if(proxTxt==null) return true;                       // fim do bloco
    const palavra=String(proxTxt).trim().split(/\s+/)[0]||"";
    const coube=larguraTexto(atualTxt)+larguraTexto(" "+palavra) <= cheia-FOLGA;
    return coube && (fechaFrase(atualTxt) || abreFrase(proxTxt));
  };
  const paras=[]; let atual=[];
  ls.forEach((x,i)=>{
    if(x.duro && atual.length){ paras.push(atual.join(" ")); atual=[]; }
    atual.push(x.txt);
    const prox=ls[i+1] ? ls[i+1].txt : null;
    if(voluntaria(x.txt, prox)){ paras.push(atual.join(" ")); atual=[]; }
  });
  if(atual.length) paras.push(atual.join(" "));
  return paras.filter(p=>p.trim()).join("\n");
}

function lerQuestoes(txtBruto){
  const {corpo:txt, chave}=separarGabarito(txtBruto);
  const questoes=[]; let gab="", atual=null, ultimaAlt=null, alvo=null, pulouLinha=false;
  let paginaAtual=0;
  let linhas=String(txt).split(/\r?\n/);
  // descarta cabeçalho/instruções antes da primeira questão numerada,
  // senão o título do documento vira uma questão fantasma
  const inicio=linhas.findIndex(l=>/^\s*\d{1,2}\s*[.)\-–]\s*\S/.test(l));
  if(inicio>0) linhas=linhas.slice(inicio);
  linhas.forEach(linha=>{
    const l=linha.trim();
    if(l.indexOf(MARCA_PAG)===0){ paginaAtual=parseInt(l.slice(MARCA_PAG.length),10)||0; return; }
    if(l.indexOf(MARCA_FIG)===0){
      const n=parseInt(l.slice(MARCA_FIG.length),10);
      if(atual && !isNaN(n) && atual.figIdx==null) atual.figIdx=n;
      return; }
    /* Linha em branco NÃO encerra o enunciado. O Word separa parágrafos
       por linha vazia, e encerrar aqui fazia sumir todo o texto depois da
       primeira linha — o enunciado saía impresso só com "Leia o texto.".
       Ela encerra, sim, a continuação de uma alternativa. */
    if(!l){ if(alvo==="alt") alvo=null; else if(alvo==="enun") pulouLinha=true; return; }
    const mq=/^(\d{1,2})\s*[.)\-–]\s*(.*)$/.exec(l);
    /* O texto pode faltar: num PDF, "A) 1⁄20" sai com a fração empilhada
       em outra linha de base, e a alternativa chega só como "A)". Sem
       aceitar isso, a questão fica SEM alternativas e engole a próxima. */
    const ma=/^(\*?)\s*([A-Ea-e])\s*[).\-–]\s*(.*)$/.exec(l);
    if(ma && atual){
      const k=ma[2].toUpperCase().charCodeAt(0)-65;
      while(atual.alternativas.length<k) atual.alternativas.push("");
      atual.alternativas[k]=ma[3].trim();
      if(ma[1]==="*") atual.correta=k;
      ultimaAlt=k; alvo="alt"; pulouLinha=false; return;
    }
    /* Numeração em sequência é sinal forte de questão nova: aceita mesmo
       que a anterior tenha ficado sem alternativas legíveis. Sem isso,
       uma questão com alternativas ilegíveis engolia a seguinte — foi o
       que sumiu com duas questões de um simulado de frações. */
    const naSequencia=mq && parseInt(mq[1],10)===questoes.length+1;
    if(mq && (!atual || atual.alternativas.length || naSequencia)){
      atual={enunciado:"",alternativas:[],correta:null,pagina:paginaAtual,
        _linhas:[{txt:mq[2].trim(), duro:false}]};
      questoes.push(atual); ultimaAlt=null; alvo="enun"; pulouLinha=false; return;
    }
    if(atual && alvo==="alt" && ultimaAlt!==null){
      const atualAlt=atual.alternativas[ultimaAlt]||"";
      /* fração empilhada: "1" e "⁄20" viram "1⁄20", sem espaço no meio */
      const cola=(/^[⁄\/]/.test(l)||/[⁄\/]$/.test(atualAlt)) ? "" : (atualAlt?" ":"");
      atual.alternativas[ultimaAlt]=atualAlt+cola+l; return; }
    if(atual && alvo==="enun"){
      /* guarda as linhas cruas: a divisão em parágrafos é decidida no
         fim, quando dá para comparar os comprimentos entre si */
      atual._linhas=atual._linhas||[];
      atual._linhas.push({txt:l, duro:pulouLinha||pareceTabela(l)});
      pulouLinha=false;
      return; }
    if(!atual){ atual={enunciado:l,alternativas:[],correta:null,pagina:paginaAtual};
      questoes.push(atual); alvo="enun"; }
  });
  if(chave) questoes.forEach((q,i)=>{
    const letra=chave[i+1];
    if(letra && q.correta==null){
      const k="ABCDE".indexOf(letra);
      if(k>=0 && k<Math.max(q.alternativas.length,5)) q.correta=k;
    }
  });
  const limpar=t=>String(t==null?"":t).split(MARCA_PAG)[0].replace(/\s+$/,"");
  /* largura da linha cheia do documento: percentil alto de todas as
     linhas, para uma linha esticada isolada não puxar a régua */
  const todas=[];
  questoes.forEach(q=>(q._linhas||[]).forEach(x=>todas.push(larguraTexto(x.txt))));
  todas.sort((a,b)=>a-b);
  const cheiaDoc=todas.length?todas[Math.min(todas.length-1,
    Math.floor(todas.length*0.93))]:0;
  questoes.forEach(q=>{
    q.enunciado=limpar(montarParagrafos(q._linhas, cheiaDoc));
    delete q._linhas;
    q.alternativas=q.alternativas.map(limpar);
  });
  questoes.forEach(q=>{ gab += (q.correta==null?"?":"ABCDE"[q.correta]); });
  return {questoes,gabarito:gab,doArquivo:!!chave};
}
function questoesParaTexto(qs){
  return (qs||[]).map((q,i)=>{
    const alt=(q.alternativas||[]).map((a,k)=>
      ((q.correta===k)?"*":"")+"ABCDE"[k]+") "+a).join("\n");
    return (i+1)+". "+q.enunciado+(alt?"\n"+alt:"");
  }).join("\n\n");
}

function telaQuestoes(box){
  const p=provaDe(casaProva);
  if(!p){ casaNivel="turmas"; return montarCasa(); }
  box.innerHTML=`<div class="migalha"><button id="mVolta">‹ ${esc(p.codigo)}</button></div>
    <h2>Questões da prova</h2>
    <p class="sub">Digite ou cole no formato de sempre. Marque a correta com
      <b>*</b> antes da letra e o gabarito se preenche sozinho.</p>
    <textarea id="txQ" spellcheck="false" style="min-height:300px"
      placeholder="1. Dados os conjuntos A = {1,2,3,4} e B = {3,4,5}, determine A ∩ B.
A) {1,2}
*B) {3,4}
C) {5}
D) {1,2,3,4,5}
E) conjunto vazio

2. Um prisma reto tem base quadrada de lado 5 cm e altura 12 cm..."></textarea>
    <div id="qAviso"></div>
    <div class="duo" style="margin-top:11px">
      <button class="btn sec" id="bConferir">Conferir</button>
      <button class="btn" id="bSalvaQ">Salvar questões</button></div>
    <button class="btn gho" id="bLerArq" style="margin-top:9px">Ler de uma foto ou PDF</button>
    <p class="hint">Linhas soltas continuam o enunciado ou a alternativa anterior,
      então pode colar texto quebrado que o app remonta.</p>`;
  if(iaTexto && iaTextoPara===p.id){ $("#txQ").value=iaTexto; iaTexto=null; iaTextoPara=null;
    $("#qAviso").innerHTML='<div class="aviso">Texto vindo da leitura automática. '+
      'Confira sinais, expoentes e frações antes de salvar — é aqui que a IA erra.</div>';
  } else $("#txQ").value=questoesParaTexto(p.questoes);
  const conferir=()=>{
    const {questoes,gabarito}=lerQuestoes($("#txQ").value);
    const av=[];
    if(questoes.length!==p.nq)
      av.push(`Encontrei <b>${questoes.length}</b> questões, mas a prova foi criada com <b>${p.nq}</b>.`);
    const curtas=questoes.map((q,i)=>q.alternativas.filter(a=>a&&a.trim()).length<p.no?i+1:0).filter(Boolean);
    if(curtas.length) av.push(`Questão ${curtas.join(", ")}: menos de ${p.no} alternativas.`);
    const vazias=questoes.map((q,i)=>!q.enunciado?i+1:0).filter(Boolean);
    if(vazias.length) av.push(`Questão ${vazias.join(", ")}: enunciado vazio.`);
    if(typeof caracteresFaltando==="function"){
      const t=[]; questoes.forEach(q=>{t.push(q.enunciado);q.alternativas.forEach(a=>t.push(a));});
      const fora=caracteresFaltando(t);
      if(fora.length) av.push(`Estes caracteres não existem na fonte e sumiriam da prova: <b>${esc(fora.join(" "))}</b>`);
    }
    const semMarca=gabarito.indexOf("?")>=0;
    const divergiu=!semMarca && questoes.length===p.nq && gabarito!==p.gabC;
    let h="";
    if(av.length) h+=`<div class="aviso">${av.join("<br>")}</div>`;
    if(divergiu)
      h+=`<div class="aviso">Pelas marcações <b>*</b> o gabarito seria <b>${esc(gabarito)}</b>,
          e o cadastrado é <b>${esc(p.gabC)}</b>. Salvar vai usar o das marcações.</div>`;
    if(semMarca && !av.length)
      h+=`<div class="aviso">Nenhuma alternativa marcada com <b>*</b>.
          O gabarito cadastrado (<b>${esc(p.gabC)}</b>) será mantido.</div>`;
    if(!av.length && !semMarca && !divergiu)
      h+=`<div class="diag"><b>Tudo certo</b>${questoes.length} questões, gabarito ${esc(gabarito)}.</div>`;
    $("#qAviso").innerHTML=h;
    return {questoes,gabarito,semMarca};
  };
  $("#txQ").oninput=()=>{ $("#qAviso").innerHTML=""; };
  $("#bConferir").onclick=conferir;
  $("#mVolta").onclick=()=>{casaNivel="prova";montarCasa();};
  $("#bLerArq").onclick=()=>{casaNivel="ler";montarCasa();};
  $("#bSalvaQ").onclick=()=>{
    const {questoes,gabarito,semMarca}=conferir();
    if(!questoes.length){ alert("Não encontrei nenhuma questão no texto."); return; }
    const antigas=p.questoes||[];
    p.questoes=questoes.map((q,i)=>({enunciado:q.enunciado,
      alternativas:q.alternativas.slice(0,p.no),correta:q.correta,
      // a figura fica presa à posição da questão: reeditar o texto não a perde
      imagem:(antigas[i]&&antigas[i].imagem)||(iaFiguradas&&iaFiguradas[i])||null}));
    iaFiguradas=null;
    if(!semMarca && gabarito.length===p.nq) p.gabC=gabarito;
    salvar(); casaNivel="prova"; montarCasa(); };
}

/* ── geração dos PDFs ────────────────────────────────────────────── */
function gerarPDF(p,t,modo){
  const st=$("#pdfStatus");
  const dizer=(cls,txt)=>{ st.innerHTML=`<div class="${cls}" style="margin-top:12px">${txt}</div>`; };
  if(!t.alunos.length){ dizer("aviso","Cadastre os estudantes da turma antes de gerar."); return; }
  if(typeof window.jspdf==="undefined"||typeof qrcode!=="function"){
    dizer("aviso","Faltou carregar jspdf.umd.min.js ou qrcode.min.js. Envie-os para o GitHub."); return; }
  if(modo==="prova" && ehCaderno(p)){
    const f=faltasDoCaderno(p);
    if(f.totalQuestoes){
      const detalhe=COMPONENTES.filter(c=>f.questoes[c.id])
        .map(c=>f.questoes[c.id]+" de "+nomeComp(c.id)).join(" e ");
      dizer("aviso",`Faltam ${f.totalQuestoes} itens sem enunciado (${esc(detalhe)}).
        Suba o arquivo daquele componente, ou gere só os cartões.`); return; }
  }else if(modo==="prova" && (p.questoes||[]).length!==p.nq){
    dizer("aviso",`A prova tem ${p.nq} questões, mas só ${(p.questoes||[]).length} foram digitadas.
      Use “Questões da prova”, ou gere só os cartões.`); return; }
  if(ehCaderno(p)){
    const f=faltasDoCaderno(p);
    if(f.gab){ dizer("aviso",`Faltam ${f.gab} letras no gabarito. O gabarito vai dentro do
      QR de cada cartão — sem ele a correção sai errada.`); return; }
  }
  dizer("diag","Montando "+t.alunos.length+" provas…");
  setTimeout(()=>{
    try{
      const e=escolaDe(t.escola);
      const cfg={codigo:p.codigo,titulo:p.titulo,escola:e?e.nome:"",turma:t.nome,
        disciplina:ehCaderno(p)
          ? COMPONENTES.filter(c=>temComp(p,c.id)).map(c=>c.nome).join(" e ")
          : nomeDisc(t,p.disciplina),
        professor:lerProfessor(),
        periodoLabel:ehCaderno(p)
          ? "Simulado SAEPE · "+(simuladoDe(p.simulado)||{ano:""}).ano
          : nomePeriodo(t,p.periodo||1),
        gabaritoCanonico:p.gabC,no:p.no,questoes:p.questoes||[],
        discursivas:p.discursivas||[],
        comps:ehCaderno(p)?(p.comps||null):null,
        alternarBlocos:ehCaderno(p)&&alternaBlocos(p),
        tipos:ehCaderno(p)?((simuladoDe(p.simulado)||{}).tipos||0):0,
        simulado:ehCaderno(p), maxPaginas:ehCaderno(p)?MAX_PAG_SIMULADO:undefined,
        rotulosComp:COMPONENTES.reduce((m,c)=>{m[c.id]=c.nome;return m;},{})};
      const doc = (modo==="cartoes")
        ? gerarFolhasDeCartoes(cfg,t.alunos)
        : gerarProvas(cfg,t.alunos,window.jspdf.jsPDF);
      const nome=(modo==="cartoes"?"cartoes_":"provas_")+t.nome+"_"+p.codigo+".pdf";
      doc.save(nome);
      let extra="";
      if(doc.avisoCaracteres&&doc.avisoCaracteres.length)
        extra=`<br><b>Atenção:</b> os caracteres ${esc(doc.avisoCaracteres.join(" "))} não existem na fonte e não foram impressos.`;
      if(doc.avisoPaginas)
        extra+=`<br><b>Atenção:</b> saiu com ${doc.avisoPaginas} páginas por estudante,
          acima do limite de 4. A letra já foi reduzida ao mínimo — para caber,
          corte questões ou encurte os enunciados.`;
      const porAluno=doc.paginasPorAluno||
        (doc.getNumberOfPages()/Math.max(1,t.alunos.length)).toFixed(0);
      if(ehCaderno(p)){
        const sm=simuladoDe(p.simulado);
        if(sm){ sm.geradoEm=Date.now(); salvar(); }
      }
      dizer("diag","<b>Pronto</b>"+doc.getNumberOfPages()+" páginas ("+porAluno+
        " por estudante) · corpo "+(doc.corpoUsado||"")+"pt · "+nome+extra);
    }catch(err){ console.error(err); dizer("aviso","Falhou ao gerar: "+err.message); }
  },50);
}

/* várias etiquetas por folha, para quem imprime a prova à parte */
function gerarFolhasDeCartoes(cfg,alunos){
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  prepararFontes(doc);
  const L=montarLayout(String(cfg.gabaritoCanonico).length,cfg.no);
  const alt=L.box_h+2*L.quiet_zone, margem=14, passo=alt+6;
  const porFolha=Math.max(1,Math.floor((297-2*margem)/passo));
  const aviso=(pg)=>{
    doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(150,156,166);
    doc.text("Recorte na linha tracejada antes de distribuir — a câmera não lê "+
             "dois cartões na mesma folha.", 12, 8);
  };
  aviso();
  alunos.forEach((a,i)=>{
    if(i && i%porFolha===0){ doc.addPage(); aviso(); }
    const linha=i%porFolha;
    desenharCartao(doc,{x:margem,y:margem+linha*passo,codigo:cfg.codigo,
      gabaritoCanonico:cfg.gabaritoCanonico,no:cfg.no,turma:cfg.turma,
      comps:cfg.comps||null, alternar:cfg.alternarBlocos,
      chave:chaveDeOrdem(a.numero,cfg.tipos||0),
      numero:a.numero,nome:a.nome});
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(120,128,140);
    doc.text(a.numero+" · "+a.nome, margem, margem+linha*passo+alt+1.5);
  });
  return doc;
}

/* ── evolução por descritor ────────────────────────────────────────
   Uma tela por turma: como cada estudante vem se saindo em cada
   descritor, comparado com a última vez em que aquele descritor foi
   avaliado. Descritor ausente de um simulado não aparece como queda —
   ele simplesmente não foi medido ali. */
let evolComp=null, evolAluno=null;

function telaEvolucao(box){
  const t=turmaDe(casaTurma);
  if(!t){ casaNivel="turmas"; return montarCasa(); }
  evolComp=evolComp||"LP";
  const sims=simuladosDa(t.id);
  const hist=historicoPorDescritor(sims);
  const e=escolaDe(t.escola)||{curto:""};
  let h=`<div class="migalha"><button id="mVolta">‹ Simulados</button><span>·</span>
      <span>${esc(t.nome)}</span></div>
    <h2>Evolução por descritor</h2>
    <p class="sub">${esc(t.nome)} · ${hist.avaliacoes.length}
      ${hist.avaliacoes.length===1?"simulado corrigido":"simulados corrigidos"} ·
      comparação com a última vez em que cada descritor foi avaliado</p>`;

  if(!hist.linhas.length){
    h+=`<div class="vazio"><b>Ainda não há histórico</b>
      Corrija ao menos um simulado com descritores para ver a evolução.</div>`;
    box.innerHTML=h;
    $("#mVolta").onclick=()=>{casaNivel="simulados";montarCasa();};
    return;
  }

  h+=`<div class="esco" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px">`+
    COMPONENTES.map(c=>`<button data-comp="${c.id}" class="${evolComp===c.id?"sel":""}">
      <div class="t">${esc(c.nome)}</div></button>`).join("")+`</div>`;

  const doComp=hist.linhas.filter(L=>L.comp===evolComp);
  const R=resumoLongitudinal(hist).filter(x=>x.comp===evolComp);

  if(!doComp.length){
    h+=`<p class="hint">Nenhum descritor deste componente foi avaliado ainda.</p>`;
  }else{
    const cores={melhorou:"var(--mint)", manteve:"var(--sky)",
                 piorou:"var(--coral)", primeira:"var(--mute)"};
    const sinal=d=>d==null?"":(d>0?"+":"")+d.toFixed(0).replace("-","−")+" p.p.";

    h+=`<div class="rot">Resumo do componente</div>`;
    R.forEach(x=>{
      h+=`<div class="item" style="cursor:default"><div class="cor">
        <div class="t1">${esc(rotuloDesc(evolComp,x.cod))}</div>
        <div class="t2">${x.estudantes} estudante${x.estudantes===1?"":"s"} ·
          <span style="color:${cores.melhorou}">${x.melhorou} melhorou</span> ·
          <span style="color:${cores.manteve}">${x.manteve} manteve</span> ·
          <span style="color:${cores.piorou}">${x.piorou} piorou</span>${
          x.persistentes?` · <span style="color:var(--coral)">${x.persistentes}
            com dificuldade persistente</span>`:""}</div></div>
        <div class="nt" style="color:${x.mediaAtual>=50?"var(--mint)":"var(--coral)"}">${
          x.mediaAtual==null?"—":Math.round(x.mediaAtual)+"%"}</div></div>`;
    });

    const persistentes=doComp.filter(L=>L.persistente);
    if(persistentes.length){
      h+=`<div class="rot">Dificuldade persistente — abaixo de ${hist.piso}% em
        avaliações sucessivas</div>`;
      persistentes.forEach(L=>{
        h+=`<div class="aluno" style="cursor:default"><div style="flex:1;min-width:0">
          <div class="nm"><span style="color:var(--mute);font-family:var(--mono);font-size:12px">${
            esc(L.numero)} </span>${esc(L.nome)}</div>
          <div class="rs">${esc(rotuloDesc(evolComp,L.cod))} · ${L.abaixoSeguidas}
            avaliações seguidas</div></div>
          <div class="nt" style="color:var(--coral)">${Math.round(L.atual.pct)}%</div></div>`;
      });
    }

    h+=`<div class="rot">Estudante por estudante</div>`;
    const porAluno={};
    doComp.forEach(L=>{ (porAluno[L.numero]=porAluno[L.numero]||{nome:L.nome,linhas:[]})
      .linhas.push(L); });
    Object.keys(porAluno).sort(ordNum).forEach(n=>{
      const A=porAluno[n];
      h+=`<div class="grupo"><div class="esc">
        <span class="nm">${esc(n)} · ${esc(A.nome)}</span><span class="ln"></span></div>`;
      A.linhas.forEach(L=>{
        h+=`<div class="item" style="cursor:default"><div class="cor">
          <div class="t1">${esc(rotuloDesc(evolComp,L.cod))}</div>
          <div class="t2">${L.anterior
            ? Math.round(L.anterior.pct)+"% ("+esc(L.anterior.simulado.titulo)+") → "+
              Math.round(L.atual.pct)+"% ("+esc(L.atual.simulado.titulo)+")"
            : Math.round(L.atual.pct)+"% em "+esc(L.atual.simulado.titulo)}</div></div>
          <div class="nt" style="font-size:13px;color:${cores[L.classe]}">${
            L.classe==="primeira"?"1ª vez":sinal(L.delta)}</div></div>`;
      });
      h+=`</div>`;
    });
  }

  h+=`<div class="rot">Exportar</div>
    <button class="btn sec" id="evolXlsx">Baixar planilha da evolução (Excel)</button>
    <p class="hint">A comparação de cada descritor é com a última vez em que ele
      foi avaliado, e não com o simulado anterior: um descritor que não entrou
      num simulado fica como <b>não avaliado</b>, nunca como zero. O mesmo código
      em Língua Portuguesa e em Matemática são descritores diferentes e nunca são
      comparados entre si. A tolerância para “manteve” é de ±${hist.tolerancia}
      pontos percentuais.</p>`;

  box.innerHTML=h;
  $("#mVolta").onclick=()=>{casaNivel="simulados";montarCasa();};
  box.querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>{
